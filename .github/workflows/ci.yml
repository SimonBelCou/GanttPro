name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks analyse l'historique complet

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Prend la dernière 22.x publiée plutôt qu'une version déjà présente sur le runner (correctifs de sécurité).
          check-latest: true

      - name: Fichier assemblé à jour et sans construction interdite (GanttPro.html, CSP par empreinte)
        run: python3 tools/build.py --check

      - name: Syntaxe JavaScript du fichier livré
        run: |
          python3 - <<'PY'
          import re
          html = open('GanttPro.html', encoding='utf-8').read()
          open('/tmp/app.js', 'w', encoding='utf-8').write(re.search(r'<script>(.*?)</script>', html, re.S).group(1))
          PY
          node --check /tmp/app.js

      - name: Moteur et scénarios chiffrés de la recette (node --test, sans dépendance)
        run: node --test tests/core/*.test.mjs

      - name: Dépendances entre fonctions à jour (commentaires « Appelle / Appelée par » et graphe d'Architecture.md)
        run: |
          npm install --no-save acorn@8.19.0 axe-core@4.14.0
          node tools/dependances.mjs --check
          node --test tests/test_dependances.mjs

      - name: Détection de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests de bout en bout (sécurité, parcours, accessibilité)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.14.0 acorn@8.19.0
          python3 tests/test_v3.py
          python3 tests/test_v3_espace.py
          PERF_FACTOR=2 python3 tests/test_v3_recette.py
