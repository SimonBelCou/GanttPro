# Publication d'une version (décision V8 du 3 novembre 2026, procédure : CLAUDE.md §13.6).
#
# Déclenchée par une étiquette « vX.Y.Z » : poussée à la main, ou posée par le workflow etiquette.yml qui appelle ce
# workflow (une étiquette poussée avec GITHUB_TOKEN ne déclenche pas d'autre workflow, d'où l'appel explicite).
# Reconstruit GanttPro.html avec tools/build.py, vérifie qu'il est identique au fichier commité, joint GanttPro.html et
# son empreinte SHA-256, et prend les notes dans la section « ## [X.Y.Z] - AAAA-MM-JJ » de CHANGELOG.md.
#
# Sécurité : permissions nulles par défaut, « contents: write » seulement pour le job de publication ; actions épinglées
# sur un SHA complet (version en commentaire) ; le nom de l'étiquette passe par une variable d'environnement et est
# validé par expression régulière avant tout usage (pas d'interpolation ${{ }} dans les scripts).
name: Publication

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: "Étiquette à publier (vX.Y.Z)"
        required: true
        type: string

permissions: {}

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      - name: Étiquette conforme et égale à VERSION
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Étiquette invalide : $TAG"; exit 1; }
          [ "v$(tr -d '[:space:]' < VERSION)" = "$TAG" ] || { echo "VERSION ($(cat VERSION)) ne correspond pas à $TAG"; exit 1; }
          python3 tools/version.py tag-check "${TAG#v}"

      - name: Reconstruction identique au fichier commité, outils et moteur
        run: |
          python3 tools/build.py --check
          python3 tests/test_build.py
          node --test tests/core/*.test.mjs

      - name: Empreinte et notes de publication
        run: |
          sha256sum GanttPro.html > GanttPro.html.sha256
          cat GanttPro.html.sha256
          python3 tools/version.py notes "${TAG#v}" > notes.md

      - name: Création de la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" GanttPro.html GanttPro.html.sha256 --verify-tag --title "GanttPro ${TAG#v}" --notes-file notes.md
