    const inField = ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]');
    if (inField) return;
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'd' && App.selected) { ev.preventDefault(); ACTIONS.duplicateTask(); }
    if (ev.altKey && !ev.ctrlKey && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && App.selected) {
      ev.preventDefault();
      nudge(ev.key === 'ArrowRight' ? 1 : -1, ev.shiftKey);
    }
  });
}

/* Sélection simple et multiple (EF-03, EF-81), actions groupées (EF-82), hiérarchie (EF-59, EF-60,
 * EF-61, EF-63), suppression (EF-06), tri (EF-09), réordonnancement par glisser-déposer (EF-10),
 * repli de la liste (EF-43), largeur des colonnes (EF-44), raccourcis de liste (EF-58). */
App.multi = new Set();
let selAnchor = null;

/** Identifiants sélectionnés, dans l'ordre de la liste. */
function selectedIds() {
  if (App.multi.size) return App.project.tasks.filter(x => App.multi.has(x.id)).map(x => x.id);
  return App.selected && taskById(App.selected) ? [App.selected] : [];
}
/** Sélection sans les éléments dont un ancêtre est aussi sélectionné (ils suivent leur parent). */
function topSelected() {
  const ids = new Set(selectedIds());
  return [...ids].filter(id => !ancestorsOf(id).some(a => ids.has(a)));
}
const visibleOrder = () => [...document.querySelectorAll('#task-rows tr[data-id]')].map(tr => tr.dataset.id).filter((v, i, a) => a.indexOf(v) === i);

action('selectTask', (id, el, ev) => {

/* ── Suppression (EF-06, EF-63) ─────────────────────────────────────────────────────────── */
action('deleteTask', async () => {
  const ids = topSelected();
  if (!ids.length) return;
  const all = new Set(ids.flatMap(id => [id, ...descendants(id).map(x => x.id)]));
  const summaries = ids.filter(id => taskById(id).type === 'summary');
  const desc = [...all].filter(id => !ids.includes(id)).length;
  const losing = App.project.tasks.filter(x => !all.has(x.id) && x.deps.some(d => all.has(d.id))).length;
  const first = taskById(ids[0]);
  const title = ids.length === 1 ? t('dlg.deleteTask', { id: first.id, name: first.name }) : t('sel.deleteN', { count: ids.length });
  const lines = [losing ? t('dlg.deleteTaskDeps', { count: losing }) : ''];
  let keep = false;
  if (summaries.length && desc) {
    lines.unshift(t('dlg.deleteSummary', { count: desc }));
    const v = await Dialog.open({ title, body: lines.filter(Boolean).map(x => h('p', { text: x })), actions: [
      { label: t('dlg.cancel'), value: 'cancel', focus: true },
      { label: t('sel.keepChildren'), value: 'keep' },
      { label: t('sel.deleteAll', { count: desc }), value: 'all', kind: 'danger' }] });
    if (v === 'cancel') return;
    keep = v === 'keep';
  } else if (!(await Dialog.confirm(title, lines, t('edit.delete')))) return;
  const gone = keep ? new Set(ids) : all;
  commit(p => {
    if (keep) for (const x of p.tasks) if (gone.has(x.parent)) { let up = p.tasks.find(y => y.id === x.parent); while (up && gone.has(up.id)) up = p.tasks.find(y => y.id === up.parent); x.parent = up ? up.id : ''; }
    p.tasks = p.tasks.filter(x => !gone.has(x.id));
    for (const x of p.tasks) x.deps = x.deps.filter(d => !gone.has(d.id));
  });
  clearSelection();
  Editor.close();
  render();
  announce(ids.length === 1 ? t('deleted', { id: ids[0] }) : t('sel.deleted', { count: gone.size }));
  $('main').focus();
});

/* ── Hiérarchie (EF-59, EF-60) ──────────────────────────────────────────────────────────── */
/** Hauteur d'un sous-arbre (0 pour une feuille). */
function heightOf(id, tasks) { const kids = tasks.filter(x => x.parent === id); return kids.length ? 1 + Math.max(...kids.map(k => heightOf(k.id, tasks))) : 0; }
function depthOk(p) { return p.tasks.every(x => ancestorsOf(x.id, p.tasks).length <= Model.LIMITS.depth); }

function hierarchyChange(mutate, okMsg) {
  const trial = clone(App.project);
  const err = mutate(trial);
  if (err) { announce(err); Dialog.message(t('sel.hierarchy'), err); return false; }
  normalizeOrder(trial);
  if (!depthOk(trial)) { Dialog.message(t('sel.hierarchy'), t('err.depth', { max: Model.LIMITS.depth })); return false; }
  const cycle = Model.findCycle(trial.tasks);
  if (cycle) { Dialog.message(t('sel.hierarchy'), t('err.cycle', { path: cycle.join(' → ') })); return false; }
  // Un lien entre une tâche et sa propre récapitulative est interdit (RG-09).
  for (const x of trial.tasks) for (const d of x.deps) if (ancestorsOf(x.id, trial.tasks).includes(d.id) || ancestorsOf(d.id, trial.tasks).includes(x.id)) {
    Dialog.message(t('sel.hierarchy'), t('sel.linkHierarchy', { a: d.id, b: x.id })); return false;
  }
  commit(p => { mutate(p); });
  announce(okMsg);
  return true;
}

action('indent', () => {
  const ids = topSelected();
  if (!ids.length || App.view.groupBy) return;
  hierarchyChange(p => {
    for (const id of ids) {
      const x = p.tasks.find(y => y.id === id);
      const sibs = p.tasks.filter(y => y.parent === x.parent);
      const prev = sibs.slice(0, sibs.indexOf(x)).reverse().find(y => !ids.includes(y.id));
      if (!prev || prev.type !== 'summary') return t('sel.needSummary');
      x.parent = prev.id;
      // Devient le dernier enfant de cette récapitulative : on le place après sa descendance.
      const block = [x, ...descendants(x.id, p.tasks)];
      p.tasks = p.tasks.filter(y => !block.includes(y));
      const d = descendants(prev.id, p.tasks);
      p.tasks.splice(p.tasks.indexOf(d.length ? d[d.length - 1] : prev) + 1, 0, ...block);
    }
    return null;
  }, t('sel.indented', { count: ids.length }));
});

action('outdent', () => {
  const ids = topSelected();
  if (!ids.length || App.view.groupBy) return;
  hierarchyChange(p => {
    for (const id of [...ids].reverse()) {
      const x = p.tasks.find(y => y.id === id);
      if (!x.parent) return t('sel.topLevel');
      const parent = p.tasks.find(y => y.id === x.parent);
      const block = [x, ...descendants(x.id, p.tasks)];
      p.tasks = p.tasks.filter(y => !block.includes(y));
      x.parent = parent.parent;
      const d = descendants(parent.id, p.tasks);
      p.tasks.splice(p.tasks.indexOf(d.length ? d[d.length - 1] : parent) + 1, 0, ...block);
    }
    return null;
  }, t('sel.outdented', { count: ids.length }));
});

action('groupUnder', () => {
  const ids = topSelected();
  if (!ids.length || App.view.groupBy) return;
  const parents = new Set(ids.map(id => taskById(id).parent));
  if (parents.size > 1) { Dialog.message(t('sel.hierarchy'), t('sel.sameLevel')); return; }
  if (App.project.tasks.length >= Model.LIMITS.tasks) { Dialog.message(t('sel.hierarchy'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; }
  const sid = Model.nextTaskId(App.project.tasks.map(x => x.id));
  const ok = hierarchyChange(p => {
    const first = p.tasks.find(y => y.id === ids[0]);
    const summary = { id: sid, name: t('newSummary'), type: 'summary', parent: first.parent, dur: 0, deps: [], assign: [], cat: '', pct: 0,
      forcedStart: '', notBefore: '', deadline: '', realStart: '', realEnd: '', tags: [], notes: '', comments: [], collapsed: false };
    p.tasks.splice(p.tasks.indexOf(first), 0, summary);
    for (const id of ids) p.tasks.find(y => y.id === id).parent = sid;
    return null;
  }, t('sel.grouped', { id: sid, count: ids.length }));
  if (ok) { clearSelection(); Editor.open(sid); }
});

/* ── Replier tout (EF-61), tri (EF-09), liste repliée (EF-43) ─────────────────────────────── */
action('collapseAll', v => { for (const x of App.project.tasks) if (x.type === 'summary') x.collapsed = v === '1'; render(); });

/** Tri topologique stable : chaque prédécesseur avant ses successeurs, ordre actuel sinon (EF-09). */
function sortedOrder(tasks) {
  const index = new Map(tasks.map((x, i) => [x.id, i]));
  const indeg = new Map(tasks.map(x => [x.id, 0]));
  const succ = new Map(tasks.map(x => [x.id, []]));
  for (const x of tasks) for (const d of x.deps) if (succ.has(d.id)) { succ.get(d.id).push(x.id); indeg.set(x.id, indeg.get(x.id) + 1); }
  const ready = tasks.filter(x => !indeg.get(x.id)).map(x => x.id);
  const rank = new Map();
  while (ready.length) {
    ready.sort((a, b) => index.get(a) - index.get(b));
    const id = ready.shift();
    rank.set(id, rank.size);
    for (const s of succ.get(id)) { indeg.set(s, indeg.get(s) - 1); if (!indeg.get(s)) ready.push(s); }
  }
  // Une récapitulative prend le rang de son premier descendant.
  const rankOf = x => (x.type === 'summary' ? Math.min(Infinity, ...descendants(x.id, tasks).map(rankOf)) : rank.get(x.id) ?? index.get(x.id));
  return [...tasks].sort((a, b) => rankOf(a) - rankOf(b) || index.get(a.id) - index.get(b.id));
}
action('sortTasks', async () => {
  if (!(await Dialog.confirm(t('view.sort'), [t('sort.warn')], t('view.sort'), false))) return;
  commit(p => { p.tasks = sortedOrder(p.tasks); });
  announce(t('sort.done'));
});

/* ── Largeur des colonnes (EF-44) : poignées utilisables à la souris et au clavier ─────────── */
const COL_LIMITS = { id: [36, 120], name: [120, 400], dur: [50, 140], deps: [60, 300], res: [80, 300], status: [70, 200] };
App.colWidths = {};
function applyColWidths() {
  const table = $('tasks-table');
  const any = Object.keys(App.colWidths).length > 0;
  table.classList.toggle('fixed', any);
  for (const col of table.querySelectorAll('col')) {
    const w = App.colWidths[col.dataset.col];
    if (w) col.style.setProperty('width', w + 'px'); else col.style.removeProperty('width');
  }
  for (const sep of table.querySelectorAll('.col-resize')) {
    const k = sep.dataset.col;
    const th = sep.closest('th');
    const w = Math.round(App.colWidths[k] || th.getBoundingClientRect().width);
    sep.setAttribute('aria-valuenow', String(Math.max(COL_LIMITS[k][0], Math.min(COL_LIMITS[k][1], w))));
  }
}
function initColumns() {
  const ths = $('tasks-table').querySelectorAll('thead th');
  const keys = ['id', 'name', 'dur', 'deps', 'res', 'status'];
  ths.forEach((th, i) => {
    const k = keys[i];
    const sep = h('span', { class: 'col-resize', role: 'separator', tabindex: '0', data: { col: k },
      aria: { orientation: 'vertical', valuemin: COL_LIMITS[k][0], valuemax: COL_LIMITS[k][1], label: t('col.resize', { col: th.textContent }),
        valuenow: Math.max(COL_LIMITS[k][0], Math.min(COL_LIMITS[k][1], Math.round(th.getBoundingClientRect().width) || COL_LIMITS[k][0])) } });
    th.append(sep);
    const set = w => { App.colWidths[k] = Math.max(COL_LIMITS[k][0], Math.min(COL_LIMITS[k][1], Math.round(w))); applyColWidths(); };
    sep.addEventListener('keydown', ev => {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      ev.preventDefault();
      set((App.colWidths[k] || th.getBoundingClientRect().width) + (ev.key === 'ArrowRight' ? 10 : -10));
    });
    sep.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      sep.setPointerCapture(ev.pointerId);
      const x0 = ev.clientX, w0 = th.getBoundingClientRect().width;
      const move = e => set(w0 + e.clientX - x0);
      const up = () => { sep.removeEventListener('pointermove', move); sep.removeEventListener('pointerup', up); };
      sep.addEventListener('pointermove', move);
      sep.addEventListener('pointerup', up);
    });
  });
}

/* ── Glisser-déposer dans la liste (EF-10, EF-64) ────────────────────────────────────────── */
function initRowDrag() {
  const body = $('task-rows');
  let dragId = null;
  body.addEventListener('dragstart', ev => {
    const tr = ev.target.closest('tr[data-id]');
    if (!tr || App.view.groupBy) { ev.preventDefault(); return; }
    dragId = tr.dataset.id;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', dragId);
  });
  body.addEventListener('dragover', ev => { if (dragId && ev.target.closest('tr[data-id]')) ev.preventDefault(); });
  body.addEventListener('drop', ev => {
    const tr = ev.target.closest('tr[data-id]');
    if (!dragId || !tr) return;
    ev.preventDefault();
    const target = tr.dataset.id, id = dragId;
    dragId = null;
    if (target === id) return;
    if (descendants(id).some(x => x.id === target)) { Dialog.message(t('sel.hierarchy'), t('sel.intoSelf')); return; }
    hierarchyChange(p => {
      const x = p.tasks.find(y => y.id === id), tg = p.tasks.find(y => y.id === target);
      const block = [x, ...descendants(id, p.tasks)];
      p.tasks = p.tasks.filter(y => !block.includes(y));
      x.parent = tg.parent;
      p.tasks.splice(p.tasks.indexOf(tg), 0, ...block);
      return null;
    }, t('sel.moved', { id, target }));
  });
  body.addEventListener('dragend', () => { dragId = null; });
}

/* ── Raccourcis de liste (EF-58, EF-60, EF-81) ───────────────────────────────────────────── */
function initListKeys() {
  document.addEventListener('keydown', ev => {
    if (document.querySelector('dialog[open]')) return;
    const inField = ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]');
    if (inField) return;
    const inList = ev.target.closest && ev.target.closest('#task-rows');
    if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && inList && !ev.altKey) {
      ev.preventDefault();
      const order = visibleOrder();
      const cur = ev.target.closest('tr[data-id]');
      const i = cur ? order.indexOf(cur.dataset.id) : -1;
      const next = order[Math.max(0, Math.min(order.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)))];
      if (!next) return;
      if (ev.shiftKey) {
        if (!App.multi.size && App.selected) App.multi.add(App.selected);
        App.multi.add(next);
      } else App.multi.clear();
      App.selected = next;
      render();
      const b = document.querySelector(`button.select[data-arg="${CSS.escape(next)}"]`);
      if (b) { b.focus(); b.scrollIntoView({ block: 'nearest' }); }
      return;
    }
    if ((ev.key === 'Delete' || ev.key === 'Suppr') && selectedIds().length) { ev.preventDefault(); ACTIONS.deleteTask(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a' && !ev.altKey) {
      ev.preventDefault();
      App.multi = new Set(visibleOrder());
      App.selected = [...App.multi][0] || null;
      render();
      announce(t('sel.count', { count: App.multi.size }));
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
      ev.preventDefault();
      ACTIONS[ev.key === 'ArrowRight' ? 'indent' : 'outdent']();
      return;
    }
    if (ev.key === '?' && typeof ACTIONS.openHelp === 'function') { ev.preventDefault(); ACTIONS.openHelp(); return; }
    if (ev.key === 'Escape' && App.multi.size) { clearSelection(true); render(); }
  });
}

// ── js/ui/64-bulk.js ──
/* Actions groupées : dupliquer la sélection et modifier en masse (EF-82). Tout ou rien :
 * si une tâche refuse une valeur, rien n'est appliqué et le message liste les tâches en cause. */

action('duplicateSelection', () => {
  const ids = topSelected();
  if (!ids.length) return;
  const trial = clone(App.project);
  const created = [];
  for (const id of ids) { const c = duplicateBlock(trial, id); if (!c) { Dialog.message(t('edit.duplicate'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; } created.push(...c); }
  try { Schedule.compute(trial); } catch { announce(t('calc.error')); return; }
  commit(p => { for (const id of ids) duplicateBlock(p, id); });
  App.multi = new Set(created.filter(id => ids.some(o => taskById(o) && created.includes(id))));
  render();
  announce(t('dup.done', { count: created.length, ids: created.join(', ') }));
});

    onAction: v => {
      if (v !== 'ok') return true;
      const err = msg => { const e = $('bulk-err'); e.textContent = msg; e.hidden = false; announce(msg); return false; };
      const val = id => $(id).value;
      const cat = val('bk-cat'), mode = val('bk-res-mode'), res = val('bk-res'), units = Number(val('bk-units'));
      const pctRaw = val('bk-pct'), tagAdd = val('bk-tag-add').trim(), tagRm = val('bk-tag-remove').trim(), shiftRaw = val('bk-shift'), nb = val('bk-nb'), dl = val('bk-dl');
      if (pctRaw !== '' && !(Number.isInteger(Number(pctRaw)) && Number(pctRaw) >= 0 && Number(pctRaw) <= 100)) return err(t('err.int', { field: t('f.pct'), min: 0, max: 100 }));
      if (shiftRaw !== '' && !(Number.isInteger(Number(shiftRaw)) && Math.abs(Number(shiftRaw)) <= 365)) return err(t('err.int', { field: t('bulk.shift'), min: -365, max: 365 }));
      if (mode && mode !== 'remove' && !(Number.isInteger(units) && units >= 1 && units <= 100)) return err(t('err.int', { field: t('rs.units'), min: 1, max: 100 }));
      const refused = [];
      const apply = pr => {
        const r = pr.resources.find(x => x.id === res);
        for (const id of ids) {
          const x = pr.tasks.find(y => y.id === id);
          if (cat !== '-') x.cat = cat;
          if (mode && x.type === 'task' && r) {
            if (mode === 'remove') x.assign = x.assign.filter(a => a.res !== res);
            else {
              if (units > r.capacity) { refused.push(`${id} (${t('err.capacity', { field: r.name, name: r.name, cap: r.capacity })})`); continue; }
              if (mode === 'replace') x.assign = [{ res, units }];
              else if (!x.assign.some(a => a.res === res)) {
                if (x.assign.length >= Model.LIMITS.assign) { refused.push(`${id} (${t('err.limit', { max: Model.LIMITS.assign, what: t('f.assign').toLowerCase() })})`); continue; }
                x.assign.push({ res, units });
              }
            }
          }
          if (pctRaw !== '') {
            const n = Number(pctRaw);
            if (x.type === 'milestone') x.pct = n >= 100 ? 100 : 0; else { x.pct = n; if (n < 100) x.realEnd = ''; }
          }
          if (tagAdd && !x.tags.some(g => g.toLowerCase() === tagAdd.toLowerCase())) {
            if (x.tags.length >= Model.LIMITS.tags) { refused.push(`${id} (${t('err.limit', { max: Model.LIMITS.tags, what: t('view.f.tag').toLowerCase() })})`); continue; }
            x.tags.push(tagAdd);
          }
          if (tagRm) x.tags = x.tags.filter(g => g.toLowerCase() !== tagRm.toLowerCase());
          if (shiftRaw !== '' && Number(shiftRaw) && x.forcedStart) {
            const cal = App.sched.cal;
            x.forcedStart = Dates.toISO(cal.dnOf(cal.ceil(Dates.parse(x.forcedStart)) + Number(shiftRaw)));
          }
          if (nb) x.notBefore = nb;
          if (dl) x.deadline = dl;
        }
      };
      const trial = clone(App.project);
      apply(trial);
      if (refused.length) return err(t('bulk.refused', { list: refused.join(' ; ') }));
      try { Schedule.compute(trial); } catch { return err(t('calc.error')); }
      commit(apply);
      announce(t('bulk.done', { count: ids.length }));
      return true;
    },
  });
}

// ── js/ui/65-gestures.js ──
/* Gestes sur la grille (EF-74 à EF-77, EF-79, RG-29) : déplacer une barre (date imposée), tirer son
 * bord droit (durée), tirer d'une poignée de lien à une autre (lien typé), tirer l'avancement.
 * Souris : le geste démarre après 3 px ; doigt : appui long de 0,3 s. Échap annule. Un geste = un
 * pas d'annulation. Aucun geste n'est indispensable : édition et Alt + flèches font de même (EX-01). */
const Gesture = { g: null, suppressClick: false };

function toast(text, undoable) {
  const box = $('toast');
  clear(box);
  box.append(h('span', { text }));
  if (undoable) box.append(h('button', { type: 'button', data: { click: 'toastUndo' } }, t('top.undo')));
  box.hidden = false;
  announce(text);
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { box.hidden = true; }, 8000);
}
action('toastUndo', () => { $('toast').hidden = true; ACTIONS.undo(); });

function gestureTip(text, x, y) {
  const tip = $('tooltip');
  clear(tip); tip.append(h('div', { text })); tip.hidden = false;
  tip.style.setProperty('left', Math.min(window.innerWidth - 220, x + 12) + 'px');
  tip.style.setProperty('top', (y + 16) + 'px');
}

function endGesture(cancelled) {
  const g = Gesture.g;
  if (!g) return;
  Gesture.g = null;
  clearTimeout(g.timer);
  if (g.ghost) g.ghost.remove();
  if (g.line) g.line.remove();
  document.querySelectorAll('.lk.target').forEach(el => el.classList.remove('target'));
  document.body.classList.remove('dragging');
  $('tooltip').hidden = true;
  if (g.active) { Gesture.suppressClick = true; setTimeout(() => { Gesture.suppressClick = false; }, 0); }
  if (cancelled && g.active) announce(t('gst.cancelled'));
}

function linkType(fromEnd, toEnd) { return fromEnd ? (toEnd ? 'FF' : 'FS') : (toEnd ? 'SF' : 'SS'); }

/** Contrôle d'un nouveau lien pred → succ (EF-76) ; renvoie un message d'erreur ou null. */
function linkError(predId, succId) {
  const pred = taskById(predId), succ = taskById(succId);
  if (!pred || !succ || predId === succId) return t('gst.linkSelf');
  if (pred.type === 'summary' || succ.type === 'summary') return t('gst.linkSummary');
  if (succ.deps.some(d => d.id === predId)) return t('gst.linkDup', { pred: predId, succ: succId });
  if (ancestorsOf(succId).includes(predId) || ancestorsOf(predId).includes(succId)) return t('sel.linkHierarchy', { a: predId, b: succId });
  const trial = App.project.tasks.map(x => (x.id === succId ? { ...x, deps: [...x.deps, { id: predId, type: 'FS', lag: 0 }] } : x));
  const cycle = Model.findCycle(trial);
  return cycle ? t('err.cycle', { path: cycle.join(' → ') }) : null;
}

function startGesture(g, ev) {
  g.active = true;
  document.body.classList.add('dragging');
  if (g.kind === 'link') {
    const layer = document.querySelector('.g-body');
    g.line = svg('svg', { class: 'g-drag', 'aria-hidden': 'true' }, svg('line', { x1: g.ox, y1: g.oy, x2: g.ox, y2: g.oy }));
    layer.append(g.line);
    for (const el of document.querySelectorAll('#gantt .lk')) if (el.closest('[data-arg]').dataset.arg !== g.id) el.classList.add('target');
  } else {
    g.ghost = g.el.cloneNode(false);
    g.ghost.className = 'ghost';
    g.ghost.removeAttribute('role'); g.ghost.removeAttribute('tabindex'); g.ghost.removeAttribute('aria-label');
    for (const k of Object.keys(g.ghost.dataset)) delete g.ghost.dataset[k];
    g.ghost.setAttribute('aria-hidden', 'true');
    g.el.parentNode.append(g.ghost);
  }
  moveGesture(ev);
}

function moveGesture(ev) {
  const g = Gesture.g;
  if (!g || !g.active) return;
  const s = App.sched, cal = s.cal, dayW = App.grid.dayW;
  const dx = ev.clientX - g.x0, days = Math.round(dx / dayW);
  if (g.kind === 'move') {
    let dn = g.r.startDn + days;
    dn = cal.dnOf(cal.ceil(dn));
    g.value = Dates.toISO(dn);
    g.ghost.style.setProperty('left', ((dn - App.grid.from) * dayW + (g.task.type === 'milestone' ? dayW / 2 : 0)) + 'px');
    gestureTip(t('gst.moveTo', { date: I18n.date(dn) }), ev.clientX, ev.clientY);
  } else if (g.kind === 'resize') {
    const target = Math.max(g.r.startDn, g.r.endDn + days);
    const d = Math.min(Model.LIMITS.dur, Math.max(1, cal.count(g.r.startDn, target)));
    g.value = d;
    const endDn = cal.dnOf(g.r.s + d - 1);
    g.ghost.style.setProperty('width', Math.max(4, (endDn - g.r.startDn + 1) * dayW) + 'px');
    gestureTip(t('gst.dur', { count: d, date: I18n.date(endDn) }), ev.clientX, ev.clientY);
  } else if (g.kind === 'pct') {
    const rect = g.el.getBoundingClientRect();
    const raw = ((ev.clientX - rect.left) / rect.width) * 100;
    const step = ev.shiftKey ? 1 : 5;
    g.value = Math.max(0, Math.min(100, Math.round(raw / step) * step));
    g.ghost.classList.add('pct');
    g.ghost.style.setProperty('width', rect.width + 'px');
    g.ghost.style.setProperty('--pct', g.value + '%');
    gestureTip(t('gst.pct', { pct: g.value }), ev.clientX, ev.clientY);
  } else if (g.kind === 'link') {
    const layer = document.querySelector('.g-body').getBoundingClientRect();
    const line = g.line.firstChild;
    line.setAttribute('x2', ev.clientX - layer.left);
    line.setAttribute('y2', ev.clientY - layer.top);
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const lk = over && over.closest && over.closest('.lk.target');
    g.drop = lk ? { id: lk.closest('[data-arg]').dataset.arg, end: lk.classList.contains('lk-e') } : null;
    gestureTip(g.drop ? t('gst.linkTo', { type: t('link.' + linkType(g.fromEnd, g.drop.end)), pred: g.id, succ: g.drop.id }) : t('gst.linkHint'), ev.clientX, ev.clientY);
  }
}

function finishGesture() {
  const g = Gesture.g;
  if (!g || !g.active || g.value === undefined && g.kind !== 'link') { endGesture(false); return; }
  const id = g.id;
  endGesture(false);
  if (g.kind === 'move') {
    const trial = clone(App.project); trial.tasks.find(x => x.id === id).forcedStart = g.value;
    try { Schedule.compute(trial); } catch { toast(t('calc.error')); return; }
    commit(p => { p.tasks.find(x => x.id === id).forcedStart = g.value; });
    toast(t('gst.moved', { id, date: I18n.shortDate(Dates.parse(g.value)) }), true);
  } else if (g.kind === 'resize') {
    if (g.value === g.task.dur) return;
    commit(p => { p.tasks.find(x => x.id === id).dur = g.value; });
    toast(t('gst.resized', { id, count: g.value }), true);
  } else if (g.kind === 'pct') {
    commit(p => { const x = p.tasks.find(y => y.id === id); x.pct = g.value; if (g.value < 100) x.realEnd = ''; });
    toast(t('gst.pctDone', { id, pct: g.value }), true);
  } else if (g.kind === 'link') {
    if (!g.drop) return;
    const err = linkError(id, g.drop.id);
    if (err) { toast(err); return; }
    const type = linkType(g.fromEnd, g.drop.end);
    commit(p => { p.tasks.find(x => x.id === g.drop.id).deps.push({ id, type, lag: 0 }); });
    toast(t('gst.linked', { type: t('link.' + type), pred: id, succ: g.drop.id }), true);
  }
}

function initGestures() {
  const grid = $('gantt');
  grid.addEventListener('pointerdown', ev => {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    const el = ev.target.closest('.bar, .ms[data-arg]');
    if (!el || !App.sched) return;
    const task = taskById(el.dataset.arg);
    if (!task || task.type === 'summary') return;
    const part = ev.target.closest('.h-end, .lk, .h-pct');
    const kind = !part ? 'move' : part.classList.contains('h-end') ? 'resize' : part.classList.contains('h-pct') ? 'pct' : 'link';
    if (App.zoom < 60 && kind !== 'link') { toast(t('gst.monthView')); return; }
    const body = document.querySelector('.g-body').getBoundingClientRect();
    const pr = (part || el).getBoundingClientRect();
    Gesture.g = { el, id: task.id, task, kind, r: App.sched.tasks.get(task.id), x0: ev.clientX, y0: ev.clientY, active: false,
      fromEnd: part ? part.classList.contains('lk-e') : false, ox: pr.left + pr.width / 2 - body.left, oy: pr.top + pr.height / 2 - body.top, pointerId: ev.pointerId };
    if (part) ev.preventDefault();
    if (ev.pointerType === 'touch') Gesture.g.timer = setTimeout(() => { if (Gesture.g) { el.setPointerCapture(ev.pointerId); startGesture(Gesture.g, ev); } }, 300);
  });
  document.addEventListener('pointermove', ev => {
    const g = Gesture.g;
    if (!g) return;
    if (!g.active) {
      const dist = Math.hypot(ev.clientX - g.x0, ev.clientY - g.y0);
      if (ev.pointerType === 'touch') { if (dist > 8) endGesture(true); return; }
      if (dist >= 3) { try { g.el.setPointerCapture(g.pointerId); } catch { /* déjà relâché */ } startGesture(g, ev); }
      return;
    }
    ev.preventDefault();
    moveGesture(ev);
  });
  document.addEventListener('pointerup', () => { if (Gesture.g) finishGesture(); });
  document.addEventListener('pointercancel', () => endGesture(true));
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && Gesture.g) { ev.preventDefault(); ev.stopPropagation(); endGesture(true); } }, true);
  // Un clic qui termine un geste ne sélectionne pas la tâche.
  document.addEventListener('click', ev => { if (Gesture.suppressClick) { ev.stopPropagation(); ev.preventDefault(); } }, true);
}

}

action('resField', (arg, el) => {
  const [id, k] = arg.split(':');
  const r = resById(id);
  const err = $('rerr-' + id);
  const fail = msg => { err.textContent = msg; err.hidden = false; el.setAttribute('aria-invalid', 'true'); announce(msg); el.focus(); };
  if (err) { err.hidden = true; el.removeAttribute('aria-invalid'); }
  if (k === 'name') { const e = nameError(App.project.resources, id, el.value, t('res.name')); if (e) return fail(e); }
  if (k === 'capacity') {
    const n = Number(el.value);
    const maxUnits = Math.max(1, ...App.project.tasks.flatMap(x => x.assign.filter(a => a.res === id).map(a => a.units)));
    if (!Number.isInteger(n) || n < 1 || n > 100) return fail(t('err.int', { field: t('res.capacity'), min: 1, max: 100 }));
    if (n < maxUnits) return fail(t('err.int', { field: t('res.capacity'), min: maxUnits, max: 100 }));
  }
  if (k === 'color' && !Model.PALETTE.includes(el.value)) return;
  commit(() => {
    if (k === 'name') r.name = el.value.trim();
    else if (k === 'role') r.role = el.value.slice(0, 100);
    else if (k === 'capacity') r.capacity = Number(el.value);
    else if (k === 'color') r.color = el.value;

  if (k === 'color' && resourcesWindow.paint) { resourcesWindow.paint(); document.querySelector(`[data-arg="${CSS.escape(arg)}"]`).focus(); }
});

/* Résolution des conflits (EF-31) : propositions simulées par Resolve.suggest, appliquées d'un clic. */
let resolveState = null;

function optionLabel(o) {
  const res = id => (resById(id) || { name: '' }).name;
  switch (o.kind) {
    case 'moveForced': return t('rsv.opt.moveForced', { task: o.task, date: I18n.date(Dates.parse(o.date)) });
    case 'unforce': return t('rsv.opt.unforce', { task: o.task });
    case 'reassign': return t('rsv.opt.reassign', { task: o.task, from: res(o.from), to: res(o.to) });
    case 'sequence': return t('rsv.opt.sequence', { first: o.first, task: o.task });
    default: return t('rsv.opt.level');
  }
}
function impactLabel(a) {
  const left = a.conflicts ? t('rsv.left', { count: a.conflicts }) : t('rsv.left0');
  const end = a.endShift > 0 ? t('rsv.endLater', { count: a.endShift }) : a.endShift < 0 ? t('rsv.endEarlier', { count: -a.endShift }) : t('rsv.endSame');
  return `${left} ; ${end}`;
}

function paintResolve(body) {
  clear(body);
  if (!App.sched || !App.sched.conflicts.length) { body.append(h('p', { text: t('rsv.none') })); resolveState = null; return; }
  const sug = Resolve.suggest(App.project, App.sched);
  resolveState = sug;
  body.append(h('p', { class: 'hint', text: t('rsv.intro') }));
  const msgs = alertMessages().filter(m => m.kind === 'conflict');
  const optionRow = (o, arg) => h('li', {},
    h('span', {}, optionLabel(o), h('br'), h('span', { class: 'impact', text: impactLabel(o.after) })),
    h('button', { type: 'button', class: 'primary', data: { click: 'applyResolve', arg }, aria: { label: t('rsv.applyLabel', { what: optionLabel(o) }) } }, t('rsv.apply')));
  sug.conflicts.forEach((c, k) => {
    body.append(h('section', { class: 'rsv-conflict' },
      h('h3', { text: '⚠ ' + (msgs[k] ? msgs[k].text : '') }),
      c.options.length ? h('ul', { class: 'rsv-options' }, c.options.map((o, j) => optionRow(o, `${k}:${j}`))) : h('p', { class: 'hint', text: t('rsv.noOption') })));
  });
  if (sug.global.length) body.append(h('section', { class: 'rsv-conflict' }, h('h3', { text: t('rsv.global') }),
    h('ul', { class: 'rsv-options' }, sug.global.map((o, j) => optionRow(o, `g:${j}`)))));
  if (sug.more) body.append(h('p', { class: 'hint', text: t('rsv.more', { count: sug.more }) }));
}

function resolveWindow() {
  const body = h('div', { id: 'rsv-win' });
  resolveWindow.body = body;
  paintResolve(body);
  return Dialog.open({ title: t('rsv.title'), body: [body], size: 'wide', actions: [{ label: t('dlg.close'), value: 'close', kind: 'primary' }] })
    .then(() => { resolveWindow.body = null; resolveState = null; });
}

action('applyResolve', arg => {
  if (!resolveState) return;
  const [k, j] = arg.split(':');
  const o = k === 'g' ? resolveState.global[Number(j)] : (resolveState.conflicts[Number(k)] || { options: [] }).options[Number(j)];
  if (!o) return;
  commit(p => o.mutate(p));
  const left = App.sched && App.sched.conflicts.length ? t('rsv.left', { count: App.sched.conflicts.length }) : t('rsv.left0');

/* Tableau de bord (EF-37 à EF-40) : indicateurs, courbe en S, tableau de suivi.
 * Courbe : une seule échelle (0-100 %), traits de 2 px, prévu et réel en couleurs validées pour le
 * daltonisme (outil dataviz), baselines en pointillé, étiquettes directes, survol et focus avec
 * réticule, et un tableau des valeurs pour qui ne lit pas un graphique (EF-40). */
const Dash = { unit: 'week', showValues: false, sort: { key: 'order', dir: 1 }, baseline: '', tab: 'summary' };

function fmtPct(v) { return `${I18n.number(v)} %`; }

function sCurveChart(curve) {
  const W = 760, H = 280, m = { l: 44, r: 140, t: 16, b: 34 };
  const n = curve.periods.length;
  const px = i => m.l + (n <= 1 ? 0 : (i * (W - m.l - m.r)) / (n - 1));
  const py = v => m.t + (1 - v / 100) * (H - m.t - m.b);
  const chart = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'scurve', role: 'img', 'aria-labelledby': 'sc-title sc-desc' });
  const last = a => (a.length ? a[a.length - 1] : 0);
  chart.append(svg('title', { id: 'sc-title', text: t('dash.curve') }),
    svg('desc', { id: 'sc-desc', text: t('dash.curveDesc', { planned: fmtPct(last(curve.planned)), real: fmtPct(last(curve.real)) }) }));
  for (const v of [0, 25, 50, 75, 100]) {
    chart.append(svg('line', { x1: m.l, x2: W - m.r, y1: py(v), y2: py(v), class: 'grid' }),
      svg('text', { x: m.l - 6, y: py(v) + 4, class: 'axis', 'text-anchor': 'end', text: `${v} %` }));
  }
  const step = Math.max(1, Math.ceil(n / 8));
  curve.periods.forEach((p, i) => {
    if (i % step && i !== n - 1) return;
    chart.append(svg('text', { x: px(i), y: H - m.b + 18, class: 'axis', 'text-anchor': 'middle',
      text: Dash.unit === 'month' ? I18n.monthLabel(p.start) : I18n.shortDate(p.start) }));
  });
  const td = Dates.todayDn();
  const ti = curve.periods.findIndex(p => p.start <= td && td <= p.end);
  if (ti >= 0) chart.append(svg('line', { x1: px(ti), x2: px(ti), y1: m.t, y2: H - m.b, class: 'today' }),
    svg('text', { x: px(ti) + 4, y: m.t + 10, class: 'axis', text: t('gantt.today') }));
  const line = (vals, cls, color) => {
    if (!vals.length) return;
    const pts = vals.map((v, i) => `${px(i)},${py(v)}`).join(' ');
    chart.append(svg('polyline', { points: pts, class: 'series ' + cls, stroke: color || null, fill: 'none' }));
  };
  const labels = [];
  for (const b of App.project.baselines.filter(x => x.shownOnScurve)) {
    line(curve.baselines[b.id] || [], 'baseline', safeColor(b.color));
    labels.push({ v: last(curve.baselines[b.id] || []), text: `${b.name} ${fmtPct(last(curve.baselines[b.id] || []))}`, i: n - 1 });
  }
  line(curve.planned, 'planned');
  line(curve.real, 'real');
  labels.push({ v: last(curve.planned), text: `${t('dash.planned')} ${fmtPct(last(curve.planned))}`, i: n - 1 });
  if (curve.real.length) labels.push({ v: last(curve.real), text: `${t('dash.real')} ${fmtPct(last(curve.real))}`, i: curve.real.length - 1 });
  // Étiquettes directes, écartées verticalement pour ne pas se chevaucher.
  labels.sort((a, b) => py(a.v) - py(b.v));
  let prev = -Infinity;
  for (const l of labels) {
    const y = Math.max(py(l.v) + 4, prev + 14);
    prev = y;
    chart.append(svg('text', { x: px(l.i) + 6, y, class: 'label', text: l.text }));
  }
  // Réticule au survol et au clavier (flèches gauche/droite).
  const cross = svg('line', { y1: m.t, y2: H - m.b, class: 'cross', visibility: 'hidden' });
  const zone = svg('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' });
  chart.append(cross, zone);
  const tip = h('div', { class: 'chart-tip', hidden: true, role: 'status' });

  const showAt = i => {

    const p = curve.periods[idx];
    const parts = [`${Dash.unit === 'month' ? I18n.monthLabel(p.start) : t('gantt.week', { date: I18n.shortDate(p.start) })}`,
      `${t('dash.planned')} ${fmtPct(curve.planned[idx])}`];
    if (idx < curve.real.length) parts.push(`${t('dash.real')} ${fmtPct(curve.real[idx])}`);
    for (const b of App.project.baselines.filter(x => x.shownOnScurve)) parts.push(`${b.name} ${fmtPct((curve.baselines[b.id] || [])[idx] || 0)}`);

  const box = h('div', { class: 'chart-box', tabindex: '0', role: 'group', aria: { label: t('dash.explore') } }, chart, tip);
  zone.addEventListener('mouseleave', () => { if (document.activeElement !== box) { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; } });
  box.addEventListener('focus', () => showAt(idx < 0 ? (ti >= 0 ? ti : n - 1) : idx));
  box.addEventListener('blur', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
  box.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); showAt(idx + (ev.key === 'ArrowLeft' ? -1 : 1)); }
    if (ev.key === 'Home') { ev.preventDefault(); showAt(0); }
    if (ev.key === 'End') { ev.preventDefault(); showAt(n - 1); }

}

/* Charge des ressources (EF-87, RG-26) : une petite courbe en barres par ressource, avec un trait à
 * 100 %. Une surcharge est rouge ET marquée ▲ ; une absence est hachurée ET nommée dans l'infobulle

function loadChart(res, periods) {

  const maxPct = Math.max(150, ...occ.map(o => (o.ratio || 0) * 100 + 20));

/** Impression : le contenu est copié dans #print-area, seul visible à l'impression (EX-26). */
function printNode(node, cls, pageRule) {
  const area = clear($('print-area'));
  area.append(node);
  area.hidden = false;
  document.body.classList.add('printing', cls);
  const sheet = document.styleSheets[0];
  let ruleIndex = -1;
  // Feuille de style via le CSSOM (autorisé par la CSP) ; textes échappés pour une chaîne CSS.
  const cssStr = v => '"' + String(v).replace(/[\\"]/g, '\\$&').replace(/[\n\r]/g, ' ') + '"';
  try {
    ruleIndex = sheet.insertRule(`@page { size: ${pageRule}; margin: 12mm; @top-left { content: ${cssStr(App.project.name)}; } @top-right { content: ${cssStr(I18n.date(Dates.todayDn()))}; } @bottom-right { content: counter(page) " / " counter(pages); } }`, sheet.cssRules.length);
  } catch {
    try { ruleIndex = sheet.insertRule(`@page { size: ${pageRule}; margin: 12mm; }`, sheet.cssRules.length); } catch { ruleIndex = -1; }
  }
  const done = () => {
    document.body.classList.remove('printing', cls);
    area.hidden = true; clear(area);
    if (ruleIndex >= 0) try { sheet.deleteRule(ruleIndex); } catch { /* règle déjà retirée */ }
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  window.print();
  // Certains navigateurs n'émettent pas afterprint : nettoyage de secours.
  setTimeout(() => { if (document.body.classList.contains('printing')) done(); }, 1500);
}

function copyText(text) {
  const fallback = () => {
    const ta = h('textarea', { class: 'sr-only', aria: { hidden: 'true' } });
    ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}

/* Impression du Gantt (EF-89, EX-26) : période, échelle, orientation, légende, colonnes.

  const colW = { id: 40, name: 180, dur: 50, deps: 80, res: 110, status: 80 };
  const ganttW = PrintOpt.scale === 'fit' ? Math.max(200, pageW - cols.reduce((a, k) => a + colW[k], 0)) : Math.round(days * 26 * App.zoom / 100 / 7);
  const dayW = ganttW / days;

    const a = Math.max(p.start, from), b = Math.min(p.end, to);
    const c = h('div', { class: 'pg-col', text: dayW * 7 < 22 ? I18n.monthLabel(p.start) : I18n.shortDate(p.start) });
    c.style.setProperty('left', x(a) + 'px'); c.style.setProperty('width', ((b - a + 1) * dayW) + 'px');
    head.append(c);

  const table = h('table', { class: 'print-gantt' },
    h('caption', { text: `${App.project.emoji} ${App.project.name} — ${I18n.date(from)} → ${I18n.date(to)}` }),
    h('thead', {}, h('tr', {}, cols.map(k => h('th', { scope: 'col', text: labels[k] })), h('th', { scope: 'col', class: 'pg-timecell' }, head))));
  const tb = h('tbody');

    const cells = {
      id: task.id, name: task.name, dur: durText(task, r), deps: depsText(task), res: task.type === 'task' ? resText(task) : '',
      status: (st ? t('status.' + st) : '') + (r && r.critical && task.type !== 'summary' ? ' ● ' + t('list.critical') : '') + (fl.conflict.has(task.id) ? ' ⚠' : ''),

      el.style.setProperty('left', x(task.type === 'milestone' ? r.startDn : a) + 'px');
      if (task.type !== 'milestone') {
        el.style.setProperty('width', Math.max(3, (b - a + 1) * dayW) + 'px');

      }

/* Fichiers : nouveau projet (EF-49), import (EF-52, EF-95, EF-96), export (EF-50, EF-51, EF-92 à
 * EF-97), fichiers protégés par mot de passe (EF-102). Tout fichier est contrôlé en entier AVANT
 * tout changement : en cas de refus, le projet ouvert reste intact (EX-14). */

/** Nom de fichier : « <nom>_gantt.<ext> », a-z et 0-9 seulement (EF-50). */
function exportFileName(name, ext = 'json') {
  const base = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '_') || 'projet';
  return `${base}_gantt.${ext}`;
}

function download(data, filename, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, hidden: true });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function doExport() {
  const o = ExportOpt, p = App.project, s = App.sched, today = Dates.todayDn();
  const err = msg => { const e = $('exp-err'); if (e) { e.textContent = msg; e.hidden = false; } announce(msg); };
  if (!s) { err(t('calc.error')); return; }
  try {
    if (o.format === 'json') {
      const text = JSON.stringify(Model.serialize(p, { anonymize: o.anonymize }), null, 2);
      if (o.protect) {
        const a = $('exp-pwd').value, b = $('exp-pwd2').value;
        if (!Secure.passwordOk(a)) { err(t('pwd.short', { min: Secure.MIN_PASSWORD })); $('exp-pwd').focus(); return; }
        if (a !== b) { err(t('pwd.mismatch')); $('exp-pwd2').focus(); return; }
        announce(t('pwd.working'));
        const env = await Secure.encrypt(text, a);
        download(JSON.stringify(env, null, 2), exportFileName(p.name), 'application/json');
      } else download(text, exportFileName(p.name), 'application/json');
      if (!o.anonymize) { App.dirty = false; if (typeof Recovery !== 'undefined') Recovery.clearCurrent(); }
    } else if (o.format === 'csv') download(Exchange.csv(p, s, today, { anonymize: o.anonymize }), exportFileName(p.name, 'csv'), 'text/csv;charset=utf-8');
    else if (o.format === 'xlsx') download(Exchange.xlsx(p, s, today, { anonymize: o.anonymize }), exportFileName(p.name, 'xlsx'), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    else if (o.format === 'msp') {
      const q = o.anonymize ? Model.sanitize(Model.serialize(p, { anonymize: true })).project : p;
      download(Exchange.mspXml(q, o.anonymize ? Schedule.compute(q) : s), exportFileName(p.name, 'xml'), 'application/xml');
    } else if (o.format === 'png') download(await ganttPng(o), exportFileName(p.name, 'png'), 'image/png');
  } catch (e) {
    err(e instanceof Model.Invalid ? I18n.error(e) : t('exp.failed'));
    return;
  }
  document.querySelector('dialog[open] [data-dlg="cancel"]').click();
  toast(t('exp.done', { format: t('exp.f.' + o.format) }));
}

/* ── Image PNG du Gantt (EF-97) ───────────────────────────────────────────────────────────── */
function ganttPng(o) {
  const s = App.sched;
  const tasks = viewItems().filter(it => it.task).map(it => it.task);
  let { from, to } = gridRange();
  if (o.period === 'range') { const a = Dates.parse(o.from), b = Dates.parse(o.to); if (a != null) from = Dates.mondayOf(a); if (b != null) to = Math.max(from + 6, b); }
  const dayW = Math.max(4, 26 * App.zoom / 100 / 7), rowH = 24, left = 260, head = 40;
  const legendH = o.legend ? 30 : 0;
  const W = Math.round(left + (to - from + 1) * dayW + 10), H = head + tasks.length * rowH + legendH + 10;
  if (W * H * o.scale * o.scale > 16e7) throw new Model.Invalid('exp.pngTooBig');
  const canvas = document.createElement('canvas');
  canvas.width = W * o.scale; canvas.height = H * o.scale;
  const g = canvas.getContext('2d');
  g.scale(o.scale, o.scale);
  const css = getComputedStyle(document.documentElement);
  const col = name => css.getPropertyValue(name).trim();
  const white = o.white;
  const ink = white ? '#141a26' : col('--text'), muted = white ? '#4a5468' : col('--muted'), line = white ? '#c7cedb' : col('--line');
  g.fillStyle = white ? '#ffffff' : col('--panel'); g.fillRect(0, 0, W, H);
  g.font = '600 12px Sora, sans-serif'; g.textBaseline = 'middle';
  const x = dn => left + (dn - from) * dayW;
  for (let dn = from; dn <= to; dn++) if (!s.cal.isWork(dn)) { g.fillStyle = white ? 'rgba(20,26,38,.06)' : col('--off'); g.fillRect(x(dn), head, dayW, H - head - legendH); }
  g.fillStyle = muted; g.font = '11px Sora, sans-serif';
  for (const p of Metrics.periods(from, to, dayW * 7 < 22 ? 'month' : 'week')) {
    g.fillRect(x(Math.max(p.start, from)), 0, 1, H - legendH);
    g.fillText(dayW * 7 < 22 ? I18n.monthLabel(p.start) : I18n.shortDate(p.start), x(Math.max(p.start, from)) + 3, head / 2);
  }
  g.fillStyle = ink; g.font = '700 13px Sora, sans-serif';
  g.fillText(`${App.project.name}`, 8, head / 2);
  tasks.forEach((task, i) => {
    const y = head + i * rowH, r = s.tasks.get(task.id);
    g.fillStyle = line; g.fillRect(0, y + rowH - 1, W, 1);
    g.fillStyle = ink; g.font = (task.type === 'summary' ? '700 ' : '') + '12px Sora, sans-serif';
    const depth = ancestorsOf(task.id).length;
    const label = `${task.id}  ${task.name}`;
    g.save(); g.beginPath(); g.rect(0, y, left - 6, rowH); g.clip(); g.fillText(label, 8 + depth * 12, y + rowH / 2); g.restore();
    if (!r || r.empty || r.endDn < from || r.startDn > to) return;
    const cat = catById(task.cat), c = safeColor(cat && cat.color);
    if (task.type === 'milestone') {
      const cx = x(r.startDn) + dayW / 2, cy = y + rowH / 2;
      g.beginPath(); g.moveTo(cx, cy - 7); g.lineTo(cx + 7, cy); g.lineTo(cx, cy + 7); g.lineTo(cx - 7, cy); g.closePath();
      g.fillStyle = task.pct >= 100 ? ink : (white ? '#fff' : col('--panel')); g.fill(); g.strokeStyle = r.critical ? '#c21f1f' : ink; g.lineWidth = 2; g.stroke();
      return;
    }
    const a = Math.max(r.startDn, from), b = Math.min(r.endDn, to);
    const bx = x(a), bw = Math.max(3, (b - a + 1) * dayW);
    if (task.type === 'summary') { g.fillStyle = ink; g.fillRect(bx, y + 8, bw, 6); return; }
    g.fillStyle = c; g.fillRect(bx, y + 5, bw, rowH - 10);
    const pct = Metrics.pctOf(task, s);
    if (pct) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(bx, y + 5, bw * pct / 100, rowH - 10); }
    if (r.critical) { g.strokeStyle = '#c21f1f'; g.lineWidth = 2; g.strokeRect(bx, y + 5, bw, rowH - 10); }
  });
  const td = Dates.todayDn();
  if (td >= from && td <= to) { g.fillStyle = '#c21f1f'; g.fillRect(x(td) + dayW / 2, head, 2, tasks.length * rowH); }
  if (o.legend) {
    g.font = '11px Sora, sans-serif'; g.fillStyle = muted;
    let lx = 8;
    const ly = H - legendH / 2 - 5;
    for (const c of App.project.categories) { g.fillStyle = safeColor(c.color); g.fillRect(lx, ly - 5, 10, 10); g.fillStyle = ink; g.fillText(c.name, lx + 14, ly); lx += 24 + g.measureText(c.name).width; }
    g.fillStyle = ink; g.fillText(t('png.legend'), lx + 10, ly);
  }
  return new Promise((resolve, reject) => canvas.toBlob(b => (b ? resolve(b) : reject(new Error('png'))), 'image/png'));
}

/* ── Import (EF-52, EF-95, EF-96, EF-102) ─────────────────────────────────────────────────── */
async function importFile(file) {
  if (file.size > 20 * 1024 * 1024) { await Dialog.message(t('top.import'), t('imp.tooBig')); return; }
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [])[1] || '';
  try {
    // Aiguillage par le contenu (signature) puis par l'extension : un fichier mal nommé est lu correctement.
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    if (head[0] === 0x50 && head[1] === 0x4b && head[2] === 3 && head[3] === 4) return await sheetWizard({ kind: 'xlsx', bytes: new Uint8Array(await file.arrayBuffer()), name: file.name });
    if (file.size > Model.MAX_BYTES) { await Dialog.message(t('top.import'), t('imp.tooBig')); return; }
    const text = await file.text(), lead = text.replace(/^\uFEFF/, '').trimStart();
    if (lead.startsWith('<')) return await importMsp(text);
    if (lead.startsWith('{')) return await importText(text);
    if (/^(csv|tsv|txt)$/i.test(ext) || !ext) return await sheetWizard({ kind: 'csv', text, name: file.name });
    return await importText(text);
  } catch (e) {
    await Dialog.message(t('top.import'), e instanceof Model.Invalid ? I18n.error(e) : /^zip/.test(e.message) ? t('imp.zip') : t('imp.unreadable'));
  }
}

/** Demande un mot de passe (jamais conservé). Renvoie la chaîne ou null. */
async function askPassword(title, hint) {
  let pwd = null;
  const inp = h('input', { type: 'password', id: 'ask-pwd', autocomplete: 'current-password' });
  const v = await Dialog.open({ title, body: [h('p', { text: hint }), h('div', { class: 'field' }, h('label', { for: 'ask-pwd', text: t('pwd.label') }), inp)],
    actions: [{ label: t('dlg.cancel'), value: 'cancel' }, { label: t('dlg.ok'), value: 'ok', kind: 'primary' }],
    onAction: val => { pwd = inp.value; inp.value = ''; return true; } });
  return v === 'ok' ? pwd : null;
}

async function importText(text, origin = 'file') {
  let result;
  try {
    result = Model.parseFile(text);
    if (result.encrypted) {
      const pwd = await askPassword(t('pwd.openTitle'), t('pwd.openHint'));
      if (pwd === null) return;
      announce(t('pwd.working'));
      result = Model.parseFile(await Secure.decrypt(result.envelope, pwd));
    }
  } catch (e) {
    await Dialog.message(t('top.import'), e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable'));
    return;
  }
  const p = result.project;
  const extra = [
    result.notices.unknown ? t('imp.notice.unknown', { count: result.notices.unknown }) : '',
    result.notices.createdResources.length ? t('imp.notice.resources', { names: result.notices.createdResources.join(', ') }) : '',
    result.notices.createdCategories.length ? t('imp.notice.categories', { names: result.notices.createdCategories.join(', ') }) : '',
  ];
  await confirmOpen(p, extra, origin);
}

/** Aperçu commun d'un projet à ouvrir (EF-52) : nouvel onglet ou remplacement. */
async function confirmOpen(p, extraLines, origin) {
  const avg = Math.round(Metrics.globalProgress(p));
  const lines = [
    h('p', { class: 'strong', text: `${p.emoji} ${p.name}` }),
    p.desc ? h('p', { text: p.desc }) : null,
    h('p', { text: t('imp.summary', { tasks: p.tasks.length, resources: p.resources.length, categories: p.categories.length, baselines: p.baselines.length,
      start: I18n.date(Dates.parse(p.projectStart)), pct: avg }) }),
    ...extraLines.filter(Boolean).map(x => h('p', { class: 'hint', text: x })),
  ];
  const canTab = typeof Tabs !== 'undefined' && Tabs.canOpen();
  if (App.dirty && !canTab) lines.push(h('p', { class: 'warning', text: t('dlg.unsaved') }));
  const actions = [{ label: t('dlg.cancel'), value: 'cancel', focus: true }];
  if (canTab) actions.push({ label: t('imp.newTab'), value: 'tab', kind: 'primary' });
  actions.push({ label: t('imp.replace'), value: 'ok', kind: canTab ? '' : 'primary' });
  const v = await Dialog.open({ title: t('imp.title'), body: lines, actions });
  if (v === 'cancel') return false;
  if (v === 'ok' && App.dirty && canTab && !(await Dialog.confirm(t('imp.replace'), [t('dlg.unsaved')], t('imp.replace')))) return false;
  if (v === 'tab') Tabs.open(p, { dirty: origin !== 'file' });
  else { Editor.close(); clearSelection(); loadProject(p); App.dirty = origin !== 'file'; render(); }
  announce(t('imp.opened', { name: p.name }));
  return true;
}

async function importMsp(text) {
  const { raw, ignored } = Exchange.fromMspXml(text);
  const res = Model.sanitize(raw);
  await confirmOpen(res.project, [ignored.length ? t('msp.ignored', { list: ignored.join(', ') }) : '', t('msp.calNote')], 'msp');
}

/* ── Assistant d'import de tableur (EF-96) : fichier/feuille → colonnes → aperçu ──────────── */
async function sheetWizard(src) {
  let sheets;
  if (src.kind === 'xlsx') sheets = await Xlsx.read(src.bytes);
  else { const { rows } = Csv.parse(src.text); sheets = [{ name: src.name, rows }]; }
  sheets = sheets.filter(s => s.rows.length);
  if (!sheets.length) throw new Model.Invalid('imp.emptySheet');
  const W = { step: 1, sheet: 0, header: true, map: null, mode: 'add', result: null };
  const body = h('div', { id: 'wiz' });
  const rowsOf = () => sheets[W.sheet].rows.map(r => r.map(c => (typeof c === 'number' ? c : String(c ?? ''))));
  const paint = focus => {
    clear(body);
    body.append(h('p', { class: 'hint', text: t('wiz.step', { n: W.step }) }), h('p', { class: 'field-error', id: 'wiz-err', role: 'alert', hidden: true }));
    const rows = rowsOf();
    if (W.step === 1) {
      if (sheets.length > 1) body.append(h('div', { class: 'field' }, h('label', { for: 'wiz-sheet', text: t('wiz.sheet') }),
        h('select', { id: 'wiz-sheet' }, sheets.map((s, i) => h('option', { value: i, selected: i === W.sheet }, `${s.name} (${s.rows.length})`)))));
      body.append(h('div', { class: 'field check' }, h('input', { type: 'checkbox', id: 'wiz-header', checked: W.header }), h('label', { for: 'wiz-header', text: t('wiz.header') })),
        h('p', { text: t('wiz.rows', { count: rows.length - (W.header ? 1 : 0), name: sheets[W.sheet].name }) }));
    } else if (W.step === 2) {
      const n = Math.max(...rows.slice(0, 50).map(r => r.length));
      const colLabel = i => (W.header ? `${Xlsx.colName(i)} — ${rows[0][i] ?? ''}` : `${Xlsx.colName(i)} — ${rows[0][i] ?? ''}…`);
      body.append(h('p', { text: t('wiz.mapHint') }), h('table', { class: 'manage' },
        h('thead', {}, h('tr', {}, h('th', { scope: 'col', text: t('wiz.field') }), h('th', { scope: 'col', text: t('wiz.column') }))),
        h('tbody', {}, Exchange.FIELDS.map(f => h('tr', {}, h('th', { scope: 'row' }, h('label', { for: 'wiz-map-' + f, text: t('wiz.f.' + f) })),
          h('td', {}, h('select', { id: 'wiz-map-' + f }, h('option', { value: '' }, t('f.none')),
            Array.from({ length: n }, (_, i) => h('option', { value: i, selected: W.map[f] === i }, String(colLabel(i)).slice(0, 60))))))))));
    } else {
      const r = W.result;
      body.append(h('p', { class: 'strong', text: t('wiz.valid', { count: r.rows.length, total: r.total }) }));
      if (r.errors.length) body.append(h('div', { class: 'table-scroll' }, h('table', { class: 'manage' }, h('caption', { text: t('wiz.errors') }),
        h('thead', {}, h('tr', {}, h('th', { scope: 'col', text: t('wiz.line') }), h('th', { scope: 'col', text: t('wiz.problem') }))),
        h('tbody', {}, r.errors.slice(0, 200).map(e => h('tr', {}, h('td', { text: String(e.line) }), h('td', { text: e.msg })))))));
      body.append(h('fieldset', { class: 'inline' }, h('legend', { text: t('wiz.mode') }),
        ['add', 'replace'].map(m => h('span', { class: 'check' }, h('input', { type: 'radio', name: 'wiz-mode', id: 'wiz-m-' + m, value: m, checked: W.mode === m }), h('label', { for: 'wiz-m-' + m, text: t('wiz.m.' + m) })))));
    }
    const dlg = body.closest('dialog');
    if (dlg) {
      const next = dlg.querySelector('button[data-dlg="next"]'), back = dlg.querySelector('button[data-dlg="back"]');
      next.textContent = W.step === 3 ? t('wiz.import') : t('wiz.next');
      back.disabled = W.step === 1;
    }
    const el = focus && body.querySelector(focus) || body.querySelector('select, input');
    if (el) el.focus();
  };
  const readStep = () => {
    if (W.step === 1) {
      if ($('wiz-sheet')) W.sheet = Number($('wiz-sheet').value) || 0;
      W.header = $('wiz-header').checked;
      W.map = W.header ? Exchange.guessMapping(rowsOf()[0]) : {};
    } else if (W.step === 2) {
      W.map = {};
      for (const f of Exchange.FIELDS) { const v = $('wiz-map-' + f).value; if (v !== '') W.map[f] = Number(v); }
    } else W.mode = document.querySelector('input[name="wiz-mode"]:checked').value === 'replace' ? 'replace' : 'add';
  };
  paint();
  let done = false;
  queueMicrotask(() => paint());
  await Dialog.open({
    title: t('wiz.title'), body: [body], size: 'wide',
    actions: [{ label: t('dlg.cancel'), value: 'cancel' }, { label: t('wiz.back'), value: 'back' }, { label: t('wiz.next'), value: 'next', kind: 'primary' }],
    onAction: v => {
      const err = msg => { const e = $('wiz-err'); e.textContent = msg; e.hidden = false; announce(msg); return false; };
      readStep();
      if (v === 'back') { if (W.step > 1) W.step--; paint(); return false; }
      if (W.step === 1) { W.step = 2; paint(); return false; }
      if (W.step === 2) {
        if (W.map.name === undefined) return err(t('wiz.needName'));
        try { W.result = Exchange.rowsToTasks(rowsOf(), W.map, App.project.tasks.map(x => x.id), { skipHeader: W.header }); } catch (e) { return err(e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable')); }
        W.step = 3; paint(); return false;
      }
      if (!W.result.rows.length) return err(t('wiz.none'));
      let merged;
      try { merged = Exchange.mergeRows(App.project, W.result.rows, W.mode); } catch (e) { return err(e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable')); }
      commit(p => { for (const k of Object.keys(merged.project)) if (k !== 'versions') p[k] = merged.project[k]; });
      announce(t('wiz.imported', { count: merged.added.length }));
      done = true;
      return true;
    },
  });
  return done;
}

/** Noms du projet initial dans la langue choisie (3.8). */
function initialNames() {
  return { project: t('init.project'), task: t('init.task'), resource: t('init.resource'), category: t('init.category') };
}

async function newProjectAction() {
  if (typeof Tabs !== 'undefined' && Tabs.canOpen()) { Tabs.open(Model.newProject(Dates.toISO(Dates.todayDn()), Date.now(), initialNames())); return; }
  if (App.dirty) {
    const ok = await Dialog.confirm(t('dlg.new'), [t('dlg.unsaved')], t('top.new'));
    if (!ok) return;
  }
  Editor.close();
  loadProject(Model.newProject(Dates.toISO(Dates.todayDn()), Date.now(), initialNames()));
  render();
}

// ── js/ui/82-clipboard.js ──
/* Copier-coller (EF-83) : Ctrl + C copie la sélection en mémoire (avec ses liens internes) ET en
 * texte tabulé ; Ctrl + V colle après la sélection, soit la copie mémoire, soit un texte tabulé
 * venant d'un tableur (RG-30, même compte rendu d'erreurs qu'EF-96). */
App.clipboard = null;
// Sans ligne d'en-tête, un collage depuis un tableur se lit : nom, durée, prédécesseurs, ressources,
// catégorie, avancement, étiquettes (ordre documenté dans le guide).
const CLIP_COLS = ['name', 'dur', 'deps', 'res', 'cat', 'pct', 'tags'];

function clipboardTsv(ids) {
  const p = App.project;
  const head = [t('xp.id'), t('xp.name'), t('xp.dur'), t('xp.deps'), t('xp.res'), t('xp.cat'), t('xp.pct'), t('xp.tags')];
  const rows = ids.map(id => {
    const x = taskById(id);
    const cat = (p.categories.find(c => c.id === x.cat) || { name: '' }).name;
    const res = x.assign.map(a => (resById(a.res) || { name: '' }).name + (a.units !== 100 ? ` ${a.units} %` : '')).join('; ');
    return [x.id, x.name, x.type === 'task' ? x.dur : 0, depsText(x).replace(/, /g, '; '), res, cat, x.pct, x.tags.join('; ')];
  });
  return Csv.write([head, ...rows], '\t', false).replace(/\r\n$/, '');
}

function pasteInternal(clip) {
  const p = App.project;
  if (p.tasks.length + clip.tasks.length > Model.LIMITS.tasks) { Dialog.message(t('clip.paste'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; }
  const anchor = selectedIds().slice(-1)[0];
  const used = p.tasks.map(x => x.id), map = new Map();
  for (const x of clip.tasks) { const id = Model.nextTaskId(used); used.push(id); map.set(x.id, id); }
  const exists = id => p.tasks.some(y => y.id === id);
  const copies = clip.tasks.map(x => ({
    ...clone(x), id: map.get(x.id), parent: map.get(x.parent) || (anchor ? (taskById(anchor).type === 'summary' ? '' : taskById(anchor).parent) : ''),
    deps: x.deps.map(d => ({ ...d, id: map.get(d.id) || d.id })).filter(d => map.has(d.id) || [...map.values()].includes(d.id) || exists(d.id)),
    pct: 0, realStart: '', realEnd: '', comments: [],
    assign: x.assign.filter(a => resById(a.res)), cat: catById(x.cat) ? x.cat : '',
  }));
  const trial = clone(p);
  const at = anchor ? trial.tasks.indexOf(trial.tasks.find(y => y.id === anchor)) + 1 + descendants(anchor, trial.tasks).length : trial.tasks.length;
  trial.tasks.splice(at, 0, ...copies);
  normalizeOrder(trial);
  try { Model.sanitize(Model.serialize(trial)); } catch (e) { Dialog.message(t('clip.paste'), e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable')); return; }
  commit(q => { q.tasks.splice(at, 0, ...clone(copies)); });
  App.multi = new Set(copies.map(c => c.id));
  render();
  announce(t('clip.pasted', { count: copies.length }));
}

async function pasteText(text) {
  const { rows } = Csv.parse(text, '\t');
  if (!rows.length) return;
  let map = Exchange.guessMapping(rows[0]);
  let header = map.name !== undefined;
  if (!header) { map = {}; CLIP_COLS.forEach((f, i) => { map[f] = i; }); }
  let res;
  try { res = Exchange.rowsToTasks(rows, map, App.project.tasks.map(x => x.id), { skipHeader: header }); } catch (e) { Dialog.message(t('clip.paste'), e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable')); return; }
  if (res.errors.length) {
    const ok = await Dialog.open({ title: t('clip.paste'), body: [h('p', { text: t('wiz.valid', { count: res.rows.length, total: res.total }) }),
      h('ul', {}, res.errors.slice(0, 50).map(e => h('li', { text: `${t('wiz.line')} ${e.line} : ${e.msg}` })))],
      actions: [{ label: t('dlg.cancel'), value: 'cancel', focus: true }, { label: t('wiz.importValid', { count: res.rows.length }), value: 'ok', kind: 'primary' }] });
    if (ok !== 'ok' || !res.rows.length) return;
  }
  if (!res.rows.length) return;
  let merged;
  try { merged = Exchange.mergeRows(App.project, res.rows, 'add'); } catch (e) { Dialog.message(t('clip.paste'), e instanceof Model.Invalid ? I18n.error(e) : t('imp.unreadable')); return; }
  commit(p => { for (const k of Object.keys(merged.project)) if (k !== 'versions') p[k] = merged.project[k]; });
  App.multi = new Set(merged.added);
  render();
  announce(t('clip.pasted', { count: merged.added.length }));
}

function initClipboard() {
  const blocked = ev => document.querySelector('dialog[open]') || (ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]'));
  document.addEventListener('copy', ev => {
    if (blocked(ev)) return;
    const top = topSelected();
    if (!top.length) return;
    const ids = top.flatMap(id => [id, ...descendants(id).map(x => x.id)]);
    const tsv = clipboardTsv(ids);
    App.clipboard = { tsv, tasks: clone(ids.map(taskById)) };
    ev.clipboardData.setData('text/plain', tsv);
    ev.preventDefault();
    announce(t('clip.copied', { count: ids.length }));
  });
  document.addEventListener('paste', ev => {
    if (blocked(ev)) return;
    const text = ev.clipboardData.getData('text/plain');
    if (!text) return;
    ev.preventDefault();
    if (App.clipboard && text.replace(/\r\n/g, '\n') === App.clipboard.tsv.replace(/\r\n/g, '\n')) pasteInternal(App.clipboard);
    else pasteText(text);
  });
}

// ── js/ui/99-main.js ──
/* Actions de l'écran principal et démarrage. */


action('toggleCollapse', id => {
  // Replier ne modifie pas les données au sens d'EF-53 : pas d'historique, pas d'indicateur.
  const task = taskById(id);
  if (!task || task.type !== 'summary') return;
  task.collapsed = !task.collapsed;
  render();
  const btn = document.querySelector(`button.toggle[data-arg="${CSS.escape(id)}"]`);
  if (btn) btn.focus();
});

action('addTask', type => {
  if (App.project.tasks.length >= Model.LIMITS.tasks) { Dialog.message(t('top.addTask'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; }
  const id = Model.nextTaskId(App.project.tasks.map(x => x.id));
  const sel = App.selected && taskById(App.selected);
  let parent = sel && sel.type === 'summary' ? sel.id : (sel ? sel.parent : '');
  if (parent && ancestorsOf(parent).length + 1 > Model.LIMITS.depth) parent = '';
  const name = t(type === 'milestone' ? 'newMilestone' : type === 'summary' ? 'newSummary' : 'newTask');
  commit(p => p.tasks.push({
    id, name, type, parent, dur: type === 'task' ? 5 : 0, deps: [], assign: [], cat: type === 'summary' ? '' : (p.categories[0] ? p.categories[0].id : ''),
    pct: 0, forcedStart: '', notBefore: '', deadline: '', realStart: '', realEnd: '', tags: [], notes: '', comments: [], collapsed: false,
  }));
  announce(t('added', { id }));
  Editor.open(id);
  const nameIn = $('f-name');
  if (nameIn) nameIn.select();
});

action('moveTask', dir => {
  const id = App.selected;
  const task = taskById(id);
  if (!task) return;
  const siblings = App.project.tasks.filter(x => x.parent === task.parent);
  const i = siblings.indexOf(task), j = i + Number(dir);
  if (j < 0 || j >= siblings.length) return;
  commit(p => {
    // Échange des deux blocs (tâche + descendance) ; normalizeOrder garde la hiérarchie contiguë.
    const a = p.tasks.find(x => x.id === id), b = p.tasks.find(x => x.id === siblings[j].id);
    const ia = p.tasks.indexOf(a), ib = p.tasks.indexOf(b);
    p.tasks[ia] = b; p.tasks[ib] = a;
  });
  const btn = document.querySelector(`#editor [data-click="moveTask"][data-arg="${dir}"]`);
  if (btn) btn.focus();
});

action('setProjectStart', (arg, el) => {
  if (Dates.parse(el.value) == null) { announce(t('err.date', { field: t('top.start') })); el.value = App.project.projectStart; return; }
  const trial = clone(App.project);
  trial.projectStart = el.value;
  try { Schedule.compute(trial); } catch { announce(t('calc.error')); el.value = App.project.projectStart; return; }
  commit(p => { p.projectStart = el.value; });
});

action('undo', () => { if (undoStep(App.undo, App.redo)) announce(t('undo.done')); });
action('redo', () => { if (undoStep(App.redo, App.undo)) announce(t('redo.done')); });

action('zoom', step => {
  const s = Number(step);
  App.zoom = s === 0 ? 100 : Math.min(300, Math.max(20, App.zoom + 20 * s));
  render();
  announce(t('top.zoom', { pct: App.zoom }));
});

action('toggleAlerts', () => { App.showAlerts = !App.showAlerts; render(); if (!App.showAlerts) $('btn-alerts').focus(); });

action('toggleTheme', () => {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(Settings.get('theme') || 'system') + 1) % 3];
  Settings.set('theme', next);
  applyTheme();
  render();
});

action('toggleLang', () => {
  const next = I18n.getLang() === 'fr' ? 'en' : 'fr';
  Settings.set('lang', next);
  I18n.setLang(next);
  render();
  if (Editor.isOpen()) Editor.open(App.selected);
  $('btn-lang').focus();
});

action('editProject', () => editProjectWindow());
// EF-65 : un lien cliqué s'édite dans le panneau de son successeur.
action('editLink', id => { if (!taskById(id)) return; Editor.open(id); const box = $('deps-box'); if (box) { box.scrollIntoView({ block: 'nearest' }); const sel = box.querySelector('select'); if (sel) sel.focus(); } });
action('openResolve', () => resolveWindow());
action('openBaselines', () => baselinesWindow());
action('openDashboard', () => dashboardWindow());
action('toggleLinks', () => { App.showLinks = !App.showLinks; render(); $('btn-links').focus(); });
action('setLeveling', (arg, el) => {
  if (!Schedule.MODES.includes(el.value)) return;
  commit(p => { p.leveling = el.value; });
  const n = App.sched ? App.sched.conflicts.length : 0;
  announce(`${t('top.leveling')} : ${t('lvl.' + el.value)}. ${n ? t('top.conflicts', { count: n }) : t('rsv.left0')}`);
});
action('openResources', () => resourcesWindow());
action('openCategories', () => categoriesWindow());
action('newProject', () => newProjectAction());
action('exportFile', () => exportWindow());
action('importFile', () => $('file-input').click());
action('fileChosen', async (arg, el) => {
  const file = el.files && el.files[0];
  el.value = '';
  if (file) importFile(file);
});

function applyTheme() {
  const theme = Settings.get('theme') || 'system';
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

function initKeyboard() {
  document.addEventListener('keydown', ev => {
    const inField = ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]');
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !inField && !document.querySelector('dialog[open]')) {
      const k = ev.key.toLowerCase();
      if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); ACTIONS.undo(); }
      else if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); ACTIONS.redo(); }
    }
    if (ev.key === 'Escape' && !document.querySelector('dialog[open]') && Editor.isOpen()) { ev.preventDefault(); Editor.close(); }
    if (!inField && ev.target.closest && ev.target.closest('#gantt') && (ev.key === '+' || ev.key === '-')) { ev.preventDefault(); ACTIONS.zoom(ev.key === '+' ? '1' : '-1'); }
  });
  // Ctrl + molette sur la grille : zoom (EF-41).
  $('gantt').addEventListener('wheel', ev => { if (ev.ctrlKey) { ev.preventDefault(); ACTIONS.zoom(ev.deltaY < 0 ? '1' : '-1'); } }, { passive: false });
}

function init() {
  const lang = Settings.get('lang') || ((navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr');
  I18n.setLang(lang);
  applyTheme();
  initActions();
  initKeyboard();
  Tooltip.init();
  initViewbar();
  initShortcuts();
  initColumns();
  initRowDrag();
  initListKeys();
  initGestures();
  initClipboard();
  loadProject(Model.newProject(Dates.toISO(Dates.todayDn()), Date.now(), initialNames()));
  // Avertissement à la fermeture uniquement si des données ont changé (EF-53).
  window.addEventListener('beforeunload', ev => { if (App.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  // Import par glisser-déposer (EF-52).
  document.addEventListener('dragover', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
  document.addEventListener('drop', async ev => {
    const file = ev.dataTransfer && ev.dataTransfer.files[0];
    if (!file) return;
    ev.preventDefault();
    importFile(file);
  });
  render();
}

init();
})();
