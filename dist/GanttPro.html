/* État de l'application : le projet, son planning calculé, l'historique d'annulation et
 * l'indicateur de modifications non exportées (EF-53, EF-55). */
const App = {
  project: null,
  sched: null,
  calcError: null,
  selected: null,
  zoom: 100,
  showAlerts: true,
  undo: [],
  redo: [],
  dirty: false,
};
const UNDO_MAX = 50;

const clone = o => JSON.parse(JSON.stringify(o));

/** Remet les descendants de chaque récapitulative juste sous elle, en gardant l'ordre relatif. */
function normalizeOrder(project) {
  const kids = new Map();
  const ids = new Set(project.tasks.map(t => t.id));
  for (const t of project.tasks) {
    const p = t.parent && ids.has(t.parent) ? t.parent : '';
    (kids.get(p) || kids.set(p, []).get(p)).push(t);
  }
  const out = [], seen = new Set();
  const walk = t => { if (seen.has(t.id)) return; seen.add(t.id); out.push(t); for (const c of kids.get(t.id) || []) walk(c); };
  for (const t of kids.get('') || []) walk(t);
  for (const t of project.tasks) walk(t); // sûreté : rien ne se perd
  project.tasks = out;
}

function recompute() {
  try {
    App.sched = Schedule.compute(App.project);
    App.calcError = null;
  } catch {
    App.sched = null;
    App.calcError = 'calc.error'; // RangeError : date au-delà de 2199
  }
}

/**
 * Applique une modification de données en un seul pas d'annulation.
 * @param {(p:object) => void} mutate
 */
function commit(mutate) {
  const before = clone(App.project);
  mutate(App.project);
  normalizeOrder(App.project);
  App.undo.push(before);
  if (App.undo.length > UNDO_MAX) App.undo.shift();
  App.redo = [];
  App.dirty = true;
  recompute();
  render();
}

function loadProject(project) {
  App.project = project;
  normalizeOrder(App.project);
  App.undo = []; App.redo = [];
  App.selected = null;
  App.dirty = false;
  recompute();
}

function undoStep(from, to) {
  if (!from.length) return false;
  to.push(clone(App.project));
  App.project = from.pop();
  App.dirty = true;
  if (App.selected && !App.project.tasks.some(t => t.id === App.selected)) App.selected = null;
  recompute();
  render();
  return true;
}

const taskById = id => App.project.tasks.find(t => t.id === id);
const resById = id => App.project.resources.find(r => r.id === id);
const catById = id => App.project.categories.find(c => c.id === id);

/** Descendants d'une récapitulative. */
function descendants(id, tasks = App.project.tasks) {
  const out = [];
  const walk = pid => { for (const t of tasks) if (t.parent === pid) { out.push(t); walk(t.id); } };
  walk(id);
  return out;
}
function ancestorsOf(id, tasks = App.project.tasks) {
  const out = [];
  let t = tasks.find(x => x.id === id);
  while (t && t.parent && out.length <= Model.LIMITS.depth) { out.push(t.parent); t = tasks.find(x => x.id === t.parent); }
  return out;
}

/** Lignes visibles : une tâche dont un ancêtre est replié est masquée (RG-27 : sans effet sur le calcul). */
function visibleTasks() {
  const collapsed = new Set(App.project.tasks.filter(t => t.type === 'summary' && t.collapsed).map(t => t.id));
  return App.project.tasks.filter(t => !ancestorsOf(t.id).some(a => collapsed.has(a)));
}

/* Affichage : barre du haut, chiffres, alertes, liste, grille, légende.
 * Tout est reconstruit à chaque modification (déterministe, < 100 ms pour 1 000 tâches). */
const t = (k, p) => I18n.t(k, p);
const today = () => Dates.todayDn();

function applyStaticTexts() {
  document.documentElement.lang = I18n.getLang();
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t(el.dataset.i18nLabel));
}

function durText(task, r) {
  if (task.type === 'milestone') return t('dur.milestone');
  const d = task.type === 'summary' ? (r && !r.empty ? r.d : 0) : task.dur;
  return t('dur.days', { count: d });
}
function depsText(task) {
  return task.deps.map(d => d.id + (d.type !== 'FS' || d.lag ? ' ' + t('link.short.' + d.type) + (d.lag ? (d.lag > 0 ? '+' : '') + d.lag : '') : '')).join(', ');
}
function resText(task) {
  return task.assign.map(a => { const r = resById(a.res); return r ? r.name + (a.units !== 100 ? ' ' + a.units + ' %' : '') : ''; }).filter(Boolean).join(', ');
}

/** Tâches en conflit et en avertissement, pour les marquer en texte (EF-18, EF-30). */
function flags() {
  const conflict = new Set(), warn = new Set();
  if (App.sched) {
    for (const c of App.sched.conflicts) c.tasks.forEach(id => conflict.add(id));
    for (const w of App.sched.warnings) warn.add(w.task);
  }
  return { conflict, warn };
}

function renderTopbar() {

  label.setAttribute('aria-label', t('top.project', { name: p.name }));

  $('zoom-level').textContent = t('top.zoom', { pct: App.zoom });
  $('btn-undo').disabled = !App.undo.length;
  $('btn-redo').disabled = !App.redo.length;
  const theme = Settings.get('theme') || 'system';
  $('btn-theme').textContent = t('top.theme', { theme: t('theme.' + theme) });
  const lang = $('btn-lang');
  lang.textContent = t('top.lang');

  const n = App.sched ? App.sched.conflicts.length + App.sched.warnings.length : 0;

}

/** « 3 j de décalage (Alice : surcharge) » pour une tâche décalée par le nivellement (EF-106). */
function shiftText(r) {
  if (!r || !r.shift) return '';
  const res = resById(r.shift.res);
  return t('list.shift', { count: r.shift.days, res: res ? res.name : '', why: t('why.' + r.shift.kind) });
}

function renderKpis() {
  const box = clear($('kpis'));
  if (!App.sched) { box.append(h('p', { class: 'error', text: t(App.calcError || 'calc.error') })); return; }
  const s = App.sched, cal = s.cal;
  let first = Infinity;
  for (const r of s.tasks.values()) if (!r.empty) first = Math.min(first, r.s);
  if (first === Infinity) first = 0;
  let offDays = 0;
  for (let dn = cal.dnOf(first); dn <= s.projectEndDn; dn++) {
    const info = cal.dayInfo(dn);
    if (info && (info.kind === 'holiday' || info.kind === 'off')) offDays++;
  }
  const pct = Metrics.globalProgress(App.project);
  const item = (label, ...value) => h('div', { class: 'kpi' }, h('dt', { text: label }), h('dd', {}, value));
  const crit = s.criticalPath.join(' → ') || t('kpi.none');
  box.append(h('dl', {},
    item(t('kpi.duration'), t('kpi.days', { count: s.projectEnd - first + 1 })),
    item(t('kpi.start'), I18n.date(cal.dnOf(first))),
    item(t('kpi.end'), I18n.date(s.projectEndDn)),
    item(t('kpi.holidays'), String(offDays)),
    item(t('kpi.critical'), h('span', { class: 'critical-path', text: crit })),
    item(t('kpi.progress'), `${I18n.number(pct)} % `, h('progress', { max: 100, value: Math.round(pct), aria: { label: t('kpi.progress') } }))));
}

function alertMessages() {
  if (!App.sched) return [];
  const s = App.sched, out = [];
  for (const c of s.conflicts) {
    const r = resById(c.res);
    let peak = 0;
    for (let i = c.s; i <= c.e; i++) peak = Math.max(peak, s.loadOf(c.res, i) * 100 / (r.capacity || 100));
    out.push({ kind: 'conflict', text: t(c.kind === 'absence' ? 'alert.absence' : 'alert.overload', {
      res: r.name, pct: Math.round(peak), start: I18n.shortDate(c.startDn), end: I18n.shortDate(c.endDn), tasks: c.tasks.join(', ') }) });
  }
  for (const w of s.warnings) {
    const r = s.tasks.get(w.task);
    if (w.kind === 'deadline') out.push({ kind: 'warning', text: t('alert.deadline', { task: w.task, count: w.days }) });
    else if (w.kind === 'smooth') { const res = resById(w.res); out.push({ kind: 'warning', text: t('alert.smooth', { task: w.task, res: res ? res.name : '' }) }); }
    else {
      const p = s.tasks.get(w.pred);
      const own = w.type === 'FF' || w.type === 'SF' ? r.endDn : r.startDn;
      const other = w.type === 'SS' || w.type === 'SF' ? p.startDn : p.endDn;
      out.push({ kind: 'warning', text: t('alert.link.' + w.type, { task: w.task, date: I18n.shortDate(own), pred: w.pred, predDate: I18n.shortDate(other) }) });
    }
  }
  return out;
}

function renderAlerts() {
  const msgs = alertMessages();
  const box = $('alerts');
  box.hidden = !App.showAlerts || msgs.length === 0;
  const ul = clear($('alerts-list'));
  for (const m of msgs) ul.append(h('li', { class: m.kind }, h('span', { aria: { hidden: 'true' }, text: '⚠ ' }), m.text));
}

function statusOf(task) {
  if (!App.sched) return null;
  return Metrics.status(task, App.sched, today());
}

function renderList(rows, fl) {
  const body = clear($('task-rows'));
  const s = App.sched;
  const frag = document.createDocumentFragment();
  const auto = (key, dn) => h('tr', { class: 'auto-ms' },
    h('td', { text: '◆' }), h('td', { text: `${t(key)} — ${dn != null ? I18n.date(dn) : ''}` }), h('td'), h('td'), h('td'), h('td'));
  frag.append(auto('list.msStart', s ? s.cal.dnOf(0) : null));
  for (const task of rows) {
    const r = s && s.tasks.get(task.id);
    const depth = ancestorsOf(task.id).length;
    const crit = r && r.critical && task.type !== 'summary';
    const st = statusOf(task);
    const marks = [];
    if (crit) marks.push(t('list.critical'));
    if (fl.conflict.has(task.id)) marks.push(t('list.conflict'));
    if (fl.warn.has(task.id)) marks.push(t('list.warning'));
    if (r && r.shift) marks.push(shiftText(r));
    const nameCell = h('td', { class: 'name' });
    nameCell.style.setProperty('--depth', String(depth));
    if (task.type === 'summary') {
      nameCell.append(h('button', { type: 'button', class: 'toggle icon', data: { click: 'toggleCollapse', arg: task.id },
        aria: { expanded: String(!task.collapsed), label: task.name } }, task.collapsed ? '▸' : '▾'));
    }
    nameCell.append(h('button', { type: 'button', class: 'select', data: { click: 'selectTask', arg: task.id },
      aria: { current: App.selected === task.id ? 'true' : undefined } },
      task.type === 'milestone' ? '◆ ' : '', task.name, task.forcedStart ? ' 📌' : ''));
    if (marks.length) nameCell.append(' ', h('span', { class: ['marks', !crit && !fl.conflict.has(task.id) && !fl.warn.has(task.id) && 'info'], text: (fl.conflict.has(task.id) || fl.warn.has(task.id) ? '⚠ ' : '') + marks.join(', ') }));
    frag.append(h('tr', { class: [task.type, crit && 'critical', App.selected === task.id && 'selected', fl.conflict.has(task.id) && 'conflict'], data: { id: task.id } },
      h('td', { class: 'id' }, crit ? h('span', { class: 'crit-dot', aria: { hidden: 'true' }, text: '● ' }) : '', task.id),
      nameCell,
      h('td', { text: durText(task, r) }),
      h('td', { text: depsText(task) }),
      h('td', { text: task.type === 'task' ? (resText(task) || t('list.noRes')) : '' }),
      h('td', { class: 'status ' + (st || ''), text: st ? t('status.' + st) : '' })));
  }
  frag.append(auto('list.msEnd', s ? s.projectEndDn : null));
  body.append(frag);
}

/** Fenêtre de temps de la grille (EF-17) : toutes les dates affichées. */
function gridRange() {
  const s = App.sched;
  let lo = s.cal.dnOf(0), hi = s.projectEndDn;
  lo = Math.min(lo, Dates.parse(App.project.projectStart));
  for (const r of s.tasks.values()) if (!r.empty) { lo = Math.min(lo, r.startDn); hi = Math.max(hi, r.endDn); }
  for (const task of App.project.tasks) for (const k of ['realStart', 'realEnd']) { const d = Dates.parse(task[k]); if (d != null) { lo = Math.min(lo, d); hi = Math.max(hi, d); } }
  return { from: Dates.mondayOf(lo), to: Dates.mondayOf(hi) + 13 };
}

function renderGantt(rows, fl) {
  const inner = clear($('gantt-inner'));
  const s = App.sched;
  if (!s) return;
  const { from, to } = gridRange();
  const dayW = 26 * App.zoom / 100 / 7;
  const days = to - from + 1;
  const width = Math.max(1, Math.round(days * dayW));
  inner.style.setProperty('--grid-w', width + 'px');
  const x = dn => (dn - from) * dayW;

  // En-tête sur deux lignes : les mois, puis le lundi de chaque semaine (vue semaine) ;
  // sous 60 % de zoom, les mois seuls (RG-21). Les jours fériés sont signalés par semaine (EF-16).
  const head = h('div', { class: 'g-head', aria: { hidden: 'true' } });
  const monthView = App.zoom < 60;
  const cell = (cls, a, b, text, title) => {
    const c = h('div', { class: cls, text, title: title || undefined });
    c.style.setProperty('left', x(a) + 'px');
    c.style.setProperty('width', ((b - a + 1) * dayW) + 'px');
    return c;
  };
  for (const p of Metrics.periods(from, to, 'month')) {
    const a = Math.max(p.start, from), b = Math.min(p.end, to);
    head.append(cell('g-col month' + (monthView ? ' full' : ''), a, b, (b - a + 1) * dayW > 40 ? I18n.monthLabel(p.start) : ''));
  }
  if (!monthView) {
    for (const p of Metrics.periods(from, to, 'week')) {
      const names = [];
      for (let dn = p.start; dn <= p.end; dn++) { const info = s.cal.dayInfo(dn); if (info && info.kind === 'holiday') names.push(t(info.key)); }
      head.append(cell(['g-col', 'week', names.length && 'has-holiday'].filter(Boolean).join(' '), p.start, p.end,
        String(Dates.ymd(p.start).d).padStart(2, '0'), names.join(', ')));
    }
  }
  inner.append(head);

  const body = h('div', { class: 'g-body' });
  body.style.setProperty('--rows', String(rows.length + 2));
  // Jours non travaillés en fond atténué.
  for (let dn = from; dn <= to; dn++) {
    if (s.cal.isWork(dn)) continue;
    let end = dn;
    while (end + 1 <= to && !s.cal.isWork(end + 1)) end++;
    const off = h('div', { class: 'g-off', aria: { hidden: 'true' } });
    off.style.setProperty('left', x(dn) + 'px');
    off.style.setProperty('width', ((end - dn + 1) * dayW) + 'px');
    body.append(off);
    dn = end;
  }
  const td = today();
  if (td >= from && td <= to) {
    const line = h('div', { class: 'g-today', title: t('gantt.today') });
    line.style.setProperty('left', x(td + 0.5) + 'px');
    body.append(line);
  }

  const row = (...children) => h('div', { class: 'g-row' }, children);
  const msAuto = (dn, cls) => { const m = h('div', { class: 'ms auto ' + cls, aria: { hidden: 'true' } }); m.style.setProperty('left', x(dn + 0.5) + 'px'); return row(m); };
  body.append(msAuto(s.cal.dnOf(0), 'start'));
  for (const task of rows) {
    const r = s.tasks.get(task.id);
    if (!r || r.empty) { body.append(row()); continue; }
    const st = statusOf(task);
    const cat = catById(task.cat);
    const color = safeColor(cat && cat.color);
    const pct = Metrics.pctOf(task, s);
    const common = { role: 'button', tabindex: '0', data: { click: 'selectTask', arg: task.id } };
    let el;
    if (task.type === 'milestone') {
      el = h('div', { ...common, class: ['ms', pct >= 100 && 'reached', r.critical && 'critical', App.selected === task.id && 'selected'],
        aria: { label: t('gantt.milestone', { id: task.id, name: task.name, date: I18n.date(r.startDn), status: t('status.' + st) }) } });
      el.style.setProperty('left', x(r.startDn + 0.5) + 'px');
    } else if (task.type === 'summary') {
      el = h('div', { ...common, class: ['sbar', App.selected === task.id && 'selected'],
        aria: { label: t('gantt.summary', { id: task.id, name: task.name, start: I18n.date(r.startDn), end: I18n.date(r.endDn), pct }) } });
      el.style.setProperty('left', x(r.startDn) + 'px');
      el.style.setProperty('width', Math.max(4, (r.endDn - r.startDn + 1) * dayW) + 'px');
    } else {
      const extra = [r.critical && t('list.critical'), fl.conflict.has(task.id) && t('list.conflict'), task.forcedStart && t('gantt.forced'), shiftText(r)].filter(Boolean);
      el = h('div', { ...common, class: ['bar', r.critical && 'critical', fl.conflict.has(task.id) && 'conflict', App.selected === task.id && 'selected'],
        aria: { label: t('gantt.bar', { id: task.id, name: task.name, start: I18n.date(r.startDn), end: I18n.date(r.endDn), dur: durText(task, r), pct, status: t('status.' + st) }) + (extra.length ? ', ' + extra.join(', ') : '') } },
        h('span', { class: 'done', aria: { hidden: 'true' } }),
        h('span', { class: 'bar-label', aria: { hidden: 'true' }, text: task.id + (task.forcedStart ? ' 📌' : '') }));
      el.style.setProperty('left', x(r.startDn) + 'px');
      el.style.setProperty('width', Math.max(4, (r.endDn - r.startDn + 1) * dayW) + 'px');
      el.style.setProperty('--c', color);
      el.style.setProperty('--ink', inkOn(color));
      el.firstChild.style.setProperty('width', pct + '%');
    }
    body.append(row(el));
  }
  body.append(msAuto(s.projectEndDn, 'end'));
  inner.append(body);
}

function renderLegend() {
  const box = clear($('legend'));
  const swatch = c => { const sw = h('span', { class: 'swatch', aria: { hidden: 'true' } }); sw.style.setProperty('background', safeColor(c)); return sw; };
  const items = [
    ...App.project.categories.map(c => h('li', {}, swatch(c.color), c.name)),
    h('li', {}, h('span', { class: 'swatch critical', aria: { hidden: 'true' } }), t('legend.critical')),
    h('li', {}, t('legend.forced')), h('li', {}, t('legend.milestone')),
    h('li', {}, h('span', { class: 'swatch today', aria: { hidden: 'true' } }), t('legend.today')),
  ];
  box.append(h('ul', {}, items));
}

function render() {
  applyStaticTexts();
  renderTopbar();
  renderKpis();
  renderAlerts();
  const rows = visibleTasks();
  const fl = flags();
  renderList(rows, fl);
  renderGantt(rows, fl);
  renderLegend();
}

// ── js/ui/60-editor.js ──
/* Panneau d'édition d'une tâche (EF-04 à EF-08, EF-19, EF-20, EF-60, EF-65 à EF-68).
 * Rien n'est appliqué avant « Enregistrer » : le formulaire travaille sur un brouillon.
 * Chaque champ refusé affiche un message précis sous lui, annoncé, et reçoit le focus (EX-06). */
const Editor = (() => {
  let draft = null;     // copie de la tâche en cours d'édition
  let originalId = null;

  const field = (name, label, control, hint) => {
    const id = 'f-' + name;
    control.id = id;
    control.name = name;
    const err = h('p', { class: 'field-error', id: id + '-err', hidden: true });
    control.setAttribute('aria-describedby', id + '-err');
    return h('div', { class: 'field', data: { field: name } }, h('label', { for: id, text: label }), control, hint ? h('p', { class: 'hint', text: hint }) : null, err);
  };
  const input = (type, value, attrs = {}) => h('input', { type, value: value ?? '', ...attrs });
  const select = (options, value) => h('select', {}, options.map(([v, label]) => h('option', { value: v, selected: v === value }, label)));

  function eligiblePreds() {
    const banned = new Set([originalId, ...descendants(originalId).map(t => t.id), ...ancestorsOf(originalId)]);
    return App.project.tasks.filter(t => t.type !== 'summary' && !banned.has(t.id) && !draft.deps.some(d => d.id === t.id));
  }

  function depsEditor() {
    const box = h('fieldset', { class: 'sub', id: 'deps-box' }, h('legend', { text: t('f.deps') }));
    const list = h('ul', { class: 'rows' });
    draft.deps.forEach((d, i) => {
      const other = taskById(d.id);
      const type = select(Model.LINK_TYPES.map(k => [k, t('link.' + k)]), d.type);
      type.setAttribute('aria-label', t('f.linkType', { id: d.id }));
      type.dataset.change = 'draftDep'; type.dataset.arg = i + ':type';
      const lag = input('number', d.lag, { min: -Model.LIMITS.lag, max: Model.LIMITS.lag, step: 1, inputmode: 'numeric', aria: { label: t('f.lag', { id: d.id }) } });
      lag.dataset.change = 'draftDep'; lag.dataset.arg = i + ':lag';
      list.append(h('li', {}, h('span', { class: 'who', text: `${d.id} ${other ? other.name : ''}` }), type, lag,
        h('button', { type: 'button', class: 'icon', data: { click: 'draftRemoveDep', arg: String(i) }, aria: { label: t('f.remove', { name: d.id }) } }, '✕')));
    });
    box.append(list);
    const opts = eligiblePreds();
    if (opts.length && draft.deps.length < Model.LIMITS.deps) {
      const pick = select([['', t('f.depPick')], ...opts.map(o => [o.id, `${o.id} ${o.name}`])], '');
      pick.id = 'dep-pick';
      pick.setAttribute('aria-label', t('f.depPick'));
      box.append(h('div', { class: 'add-row' }, pick, h('button', { type: 'button', data: { click: 'draftAddDep' } }, t('f.addDep'))));
    }
    box.append(h('p', { class: 'field-error', id: 'deps-err', hidden: true, role: 'alert' }));
    return box;
  }

  function assignEditor() {
    const box = h('fieldset', { class: 'sub', id: 'assign-box' }, h('legend', { text: t('f.assign') }));
    const list = h('ul', { class: 'rows' });
    draft.assign.forEach((a, i) => {
      const r = resById(a.res);
      const units = input('number', a.units, { min: 1, max: r ? r.capacity : 100, step: 1, inputmode: 'numeric', aria: { label: t('f.units', { name: r ? r.name : '' }) } });
      units.dataset.change = 'draftUnits'; units.dataset.arg = String(i);
      list.append(h('li', {}, h('span', { class: 'who', text: r ? r.name : '' }), units,
        h('button', { type: 'button', class: 'icon', data: { click: 'draftRemoveAssign', arg: String(i) }, aria: { label: t('f.remove', { name: r ? r.name : '' }) } }, '✕')));
    });
    box.append(list);
    const free = App.project.resources.filter(r => !draft.assign.some(a => a.res === r.id));
    if (free.length && draft.assign.length < Model.LIMITS.assign) {
      const pick = select([['', t('f.resPick')], ...free.map(r => [r.id, r.name])], '');
      pick.id = 'res-pick';
      pick.setAttribute('aria-label', t('f.resPick'));
      box.append(h('div', { class: 'add-row' }, pick, h('button', { type: 'button', data: { click: 'draftAddAssign' } }, t('f.addAssign'))));
    }
    box.append(h('p', { class: 'field-error', id: 'assign-err', hidden: true, role: 'alert' }));
    return box;
  }

  function build() {
    const box = clear($('edit-fields'));
    const d = draft;
    $('editor-title').textContent = t('edit.title', { id: originalId });
    const r = App.sched && App.sched.tasks.get(originalId);
    if (r && r.shift) {
      const res = resById(r.shift.res);
      box.append(h('p', { class: 'note', id: 'edit-shift', text: t('edit.shift', { count: r.shift.days, res: res ? res.name : '', why: t('why.' + r.shift.kind), date: I18n.date(r.earliestDn) }) }));
    }
    const idIn = input('text', d.id, { maxlength: 12, autocomplete: 'off', spellcheck: 'false', class: 'upper', required: true });
    idIn.dataset.input = 'upperCase';
    box.append(field('id', t('f.id'), idIn));
    box.append(field('name', t('f.name'), input('text', d.name, { maxlength: 200, required: true })));
    if (d.type !== 'summary') {
      const typeSel = select([['task', t('type.task')], ['milestone', t('type.milestone')]], d.type);
      typeSel.dataset.change = 'draftType';
      box.append(field('type', t('f.type'), typeSel));
    }
    const banned = new Set([originalId, ...descendants(originalId).map(x => x.id)]);
    const parents = App.project.tasks.filter(x => x.type === 'summary' && !banned.has(x.id));
    box.append(field('parent', t('f.parent'), select([['', t('f.none')], ...parents.map(p => [p.id, `${p.id} ${p.name}`])], d.parent)));
    if (d.type === 'task') box.append(field('dur', t('f.dur'), input('number', d.durRaw ?? d.dur, { min: 1, max: Model.LIMITS.dur, step: 1, inputmode: 'numeric', required: true })));
    if (d.type !== 'summary') {
      box.append(depsEditor());
      if (d.type === 'task') box.append(assignEditor());
      box.append(field('cat', t('f.cat'), select([['', t('f.none')], ...App.project.categories.map(c => [c.id, c.name])], d.cat)));
    }
    if (d.type === 'task') {
      box.append(field('pct', t('f.pct'), input('number', d.pctRaw ?? d.pct, { min: 0, max: 100, step: 1, inputmode: 'numeric' })));
    } else if (d.type === 'milestone') {
      const cb = input('checkbox', '', { checked: d.pct >= 100 });
      box.append(h('div', { class: 'field check' }, cb, h('label', { for: 'f-reached', text: t('f.reached') })));
      cb.id = 'f-reached'; cb.name = 'reached';
    }
    if (d.type !== 'summary') {
      box.append(field('forcedStart', t('f.forced'), input('date', d.forcedStart, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('notBefore', t('f.notBefore'), input('date', d.notBefore, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('deadline', t('f.deadline'), input('date', d.deadline, { min: '1970-01-01', max: '2199-12-31' })));
    }
    if (d.type === 'task') {
      box.append(field('realStart', t('f.realStart'), input('date', d.realStart, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('realEnd', t('f.realEnd'), input('date', d.realEnd, { min: '1970-01-01', max: '2199-12-31' })));
    }
    box.append(field('tags', t('f.tags'), input('text', d.tagsRaw ?? d.tags.join(', '), { maxlength: 400 })));
    box.append(field('notes', t('f.notes'), h('textarea', { rows: 3, maxlength: 2000, text: d.notes })));
  }

  /** Relit les champs simples du formulaire dans le brouillon (sans valider). */
  function readForm() {
    const f = $('edit-form').elements;
    const val = n => (f[n] ? f[n].value : undefined);
    const d = draft;
    d.id = (val('id') || '').trim().toUpperCase();
    d.name = (val('name') || '').trim();
    if (f.parent) d.parent = val('parent');
    if (f.dur) d.durRaw = val('dur');
    if (f.cat) d.cat = val('cat');
    if (f.pct) d.pctRaw = val('pct');
    if (f.reached) d.pct = f.reached.checked ? 100 : 0;
    for (const k of ['forcedStart', 'notBefore', 'deadline', 'realStart', 'realEnd']) if (f[k]) d[k] = val(k);
    d.tagsRaw = val('tags') || '';
    d.notes = val('notes') || '';
  }

  function open(id) {
    const task = taskById(id);
    if (!task) return;
    originalId = id;
    draft = clone(task);
    App.selected = id;
    $('editor').hidden = false;
    build();
    render();
    $('f-name').focus();
  }

  function close() {
    $('editor').hidden = true;
    draft = null;
    const sel = App.selected && document.querySelector(`button.select[data-arg="${CSS.escape(App.selected)}"]`);
    if (sel) sel.focus();
  }

  function showErrors(errors) {
    for (const el of document.querySelectorAll('#editor .field-error')) { el.hidden = true; el.textContent = ''; }
    for (const el of document.querySelectorAll('#editor [aria-invalid]')) el.removeAttribute('aria-invalid');
    let first = null;
    for (const [name, msg] of Object.entries(errors)) {
      const ctl = $('f-' + name) || $(name + '-box');
      const err = $('f-' + name + '-err') || $(name + '-err');
      if (err) { err.textContent = msg; err.hidden = false; }
      if (ctl && ctl.tagName !== 'FIELDSET') ctl.setAttribute('aria-invalid', 'true');
      if (!first) first = ctl;
    }
    if (first) { (first.tagName === 'FIELDSET' ? first.querySelector('select, input, button') || first : first).focus(); announce(Object.values(errors)[0]); }
  }

  function intIn(raw, min, max) { const n = Number(raw); return raw !== '' && Number.isInteger(n) && n >= min && n <= max ? n : null; }

  function validate() {
    readForm();
    const d = draft, e = {};
    if (!Model.ID_RE.test(d.id)) e.id = t('err.idFormat', { field: t('f.id') });
    else if (d.id !== originalId && taskById(d.id)) e.id = t('err.idTaken', { field: t('f.id'), id: d.id });
    if (!d.name) e.name = t('err.required', { field: t('f.name') });
    if (d.type === 'task') {
      const dur = intIn(d.durRaw, 1, Model.LIMITS.dur);
      if (dur == null) e.dur = t('err.int', { field: t('f.dur'), min: 1, max: '3 650' }); else d.dur = dur;
      const pct = intIn(d.pctRaw, 0, 100);
      if (pct == null) e.pct = t('err.int', { field: t('f.pct'), min: 0, max: 100 }); else d.pct = pct;
    }
    for (const k of ['forcedStart', 'notBefore', 'deadline', 'realStart', 'realEnd']) {
      if (d[k] && Dates.parse(d[k]) == null) e[k] = t('err.date', { field: t('f.' + ({ forcedStart: 'forced' }[k] || k)) });
    }
    if (!e.realStart && !e.realEnd && d.realStart && d.realEnd && d.realEnd < d.realStart) e.realEnd = t('err.realOrder', { field: t('f.realEnd') });
    d.deps.forEach(dep => { if (!Number.isInteger(dep.lag) || Math.abs(dep.lag) > Model.LIMITS.lag) e.deps = t('err.int', { field: t('f.lag', { id: dep.id }), min: -365, max: 365 }); });
    d.assign.forEach(a => { const r = resById(a.res); if (!r || !Number.isInteger(a.units) || a.units < 1 || a.units > r.capacity) e.assign = t('err.capacity', { field: t('f.units', { name: r ? r.name : '' }), name: r ? r.name : '', cap: r ? r.capacity : 100 }); });
    const tags = d.tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
    if (tags.length > Model.LIMITS.tags || tags.some(s => s.length > 30)) e.tags = t('err.text', { field: t('f.tags'), min: 1, max: 30 });
    else d.tags = tags.filter((s, i) => tags.findIndex(x => x.toLowerCase() === s.toLowerCase()) === i);
    if (d.parent) {
      const height = Math.max(0, ...descendants(originalId).map(x => ancestorsOf(x.id).length - ancestorsOf(originalId).length));
      if (ancestorsOf(d.parent).length + 1 + height > Model.LIMITS.depth) e.parent = t('err.depth', { max: Model.LIMITS.depth });
    }
    return e;
  }

  async function save() {
    const e = validate();
    if (Object.keys(e).length) { showErrors(e); return; }
    const d = draft;
    let cleared = false;
    if (d.type === 'task') {
      if (d.realEnd && d.pct < 100) {
        // Une fin réelle porte l'avancement à 100 % (RG-13), sauf si l'utilisateur vient de le baisser.
        const before = taskById(originalId);
        if (before.realEnd === d.realEnd && before.pct === 100) { d.realEnd = ''; cleared = true; } else d.pct = 100;
      }
    }
    const oldId = originalId, newId = d.id;
    const final = {
      id: newId, name: d.name, type: d.type, parent: d.parent, dur: d.type === 'task' ? d.dur : 0,
      deps: d.type === 'summary' ? [] : d.deps.map(x => ({ id: x.id, type: x.type, lag: x.lag })),
      assign: d.type === 'task' ? d.assign.map(a => ({ res: a.res, units: a.units })) : [],
      cat: d.cat, pct: d.type === 'summary' ? 0 : d.pct,
      forcedStart: d.type === 'summary' ? '' : d.forcedStart, notBefore: d.type === 'summary' ? '' : d.notBefore, deadline: d.type === 'summary' ? '' : d.deadline,
      realStart: d.type === 'task' ? d.realStart : '', realEnd: d.type === 'task' ? d.realEnd : '',
      tags: d.tags, notes: d.notes, comments: d.comments, collapsed: d.collapsed,
    };
    // Simulation : le planning doit rester calculable (dates ≤ 2199).
    const trial = clone(App.project);
    applyTask(trial, oldId, final);
    try { Schedule.compute(trial); } catch { showErrors({ forcedStart: t('calc.error') }); return; }
    commit(p => applyTask(p, oldId, final));
    App.selected = newId;
    originalId = newId;
    $('editor').hidden = true;
    draft = null;
    render();
    announce(t('saved', { id: newId }) + (cleared ? ' ' + t('err.realEndCleared') : ''));
    const sel = document.querySelector(`button.select[data-arg="${CSS.escape(newId)}"]`);
    if (sel) sel.focus();
  }

  /** Remplace la tâche oldId ; un changement d'identifiant est répercuté partout (EF-05). */
  function applyTask(p, oldId, final) {
    const i = p.tasks.findIndex(x => x.id === oldId);
    const parentChanged = p.tasks[i].parent !== final.parent;
    p.tasks[i] = final;
    if (oldId !== final.id) {
      for (const x of p.tasks) {
        for (const dep of x.deps) if (dep.id === oldId) dep.id = final.id;
        if (x.parent === oldId) x.parent = final.id;
      }
      for (const b of p.baselines) for (const bt of b.tasks) {
        if (bt.id === oldId) bt.id = final.id;
        bt.deps = bt.deps.map(x => (x === oldId ? final.id : x));
      }
    }
    if (parentChanged && final.parent) {
      // Se place à la fin de sa nouvelle récapitulative.
      const block = [final, ...descendants(final.id, p.tasks)];
      p.tasks = p.tasks.filter(x => !block.includes(x));
      const pi = p.tasks.findIndex(x => x.id === final.parent);
      const after = descendants(final.parent, p.tasks);
      const at = after.length ? p.tasks.indexOf(after[after.length - 1]) + 1 : pi + 1;
      p.tasks.splice(at, 0, ...block);
    }
  }

  // ── Actions du brouillon ───────────────────────────────────────────────────────────────
  action('upperCase', (arg, el) => { const pos = el.selectionStart; el.value = el.value.toUpperCase(); el.setSelectionRange(pos, pos); });
  action('draftType', (arg, el) => { readForm(); draft.type = el.value; if (draft.type === 'milestone') { draft.assign = []; draft.pct = draft.pct >= 100 ? 100 : 0; } else if (!draft.dur) draft.dur = 5; build(); $('f-type').focus(); });
  action('draftDep', (arg, el) => {
    const [i, k] = arg.split(':');
    const dep = draft.deps[Number(i)];
    if (k === 'type') dep.type = Model.LINK_TYPES.includes(el.value) ? el.value : 'FS';
    else dep.lag = el.value === '' ? NaN : Number(el.value);
  });
  action('draftRemoveDep', arg => { readForm(); draft.deps.splice(Number(arg), 1); build(); const p = $('dep-pick'); if (p) p.focus(); });
  action('draftAddDep', () => {
    readForm();
    const pick = $('dep-pick');
    if (!pick || !pick.value) return;
    const trialTasks = App.project.tasks.map(x => (x.id === originalId ? { ...x, deps: [...draft.deps, { id: pick.value, type: 'FS', lag: 0 }] } : x));
    const cycle = Model.findCycle(trialTasks);
    if (cycle) { const err = $('deps-err'); err.textContent = t('err.cycle', { path: cycle.join(' → ') }); err.hidden = false; pick.focus(); return; }
    draft.deps.push({ id: pick.value, type: 'FS', lag: 0 });
    build();
    const again = $('dep-pick'); if (again) again.focus();
  });
  action('draftUnits', (arg, el) => { draft.assign[Number(arg)].units = el.value === '' ? NaN : Number(el.value); });
  action('draftRemoveAssign', arg => { readForm(); draft.assign.splice(Number(arg), 1); build(); const p = $('res-pick'); if (p) p.focus(); });
  action('draftAddAssign', () => {
    readForm();
    const pick = $('res-pick');
    if (!pick || !pick.value) return;
    const r = resById(pick.value);
    draft.assign.push({ res: r.id, units: Math.min(100, r.capacity) });
    build();
    const again = $('res-pick'); if (again) again.focus();
  });
  action('saveTask', () => save());
  action('closeEditor', () => close());

  return { open, close, isOpen: () => !!draft };
})();

/* Fenêtres de gestion : projet (EF-48), ressources (EF-24, EF-25), catégories (EF-27, EF-28). */

async function editProjectWindow() {
  const p = App.project;
  const name = h('input', { type: 'text', id: 'p-name', value: p.name, maxlength: 60, required: true, aria: { describedby: 'p-name-err' } });
  const desc = h('textarea', { id: 'p-desc', rows: 3, maxlength: 500, text: p.desc });
  const emojis = h('fieldset', { class: 'emojis' }, h('legend', { text: t('dlg.emoji') }),
    Model.EMOJIS.map((e, i) => h('span', { class: 'emoji-opt' },
      h('input', { type: 'radio', id: 'p-emo-' + i, name: 'p-emoji', value: e, checked: e === p.emoji }),
      h('label', { for: 'p-emo-' + i, text: e }))));
  await Dialog.open({
    title: t('dlg.project'),
    body: [h('div', { class: 'field' }, h('label', { for: 'p-name', text: t('f.name') }), name, h('p', { class: 'field-error', id: 'p-name-err', hidden: true })),
      h('div', { class: 'field' }, h('label', { for: 'p-desc', text: t('dlg.desc') }), desc), emojis],
    actions: [{ label: t('dlg.cancel'), value: 'cancel' }, { label: t('edit.save'), value: 'ok', kind: 'primary' }],
    onAction: v => {
      if (v !== 'ok') return true;
      const n = name.value.trim();
      if (!n || n.length > 60) {
        const err = $('p-name-err');
        err.textContent = t('err.text', { field: t('f.name'), min: 1, max: 60 }); err.hidden = false;
        name.setAttribute('aria-invalid', 'true'); name.focus();
        return false;
      }
      const checked = document.querySelector('input[name="p-emoji"]:checked');
      const emoji = checked && Model.EMOJIS.includes(checked.value) ? checked.value : p.emoji;
      commit(pr => { pr.name = n; pr.desc = desc.value.slice(0, 500); pr.emoji = emoji; });
      return true;
    },
  });
}

/** Contrôle d'un nom de ressource ou de catégorie : obligatoire, 100 caractères, unique (casse ignorée). */
function nameError(list, id, value, label) {
  const v = value.trim();
  if (!v || v.length > 100) return t('err.text', { field: label, min: 1, max: 100 });
  if (list.some(x => x.id !== id && x.name.toLocaleLowerCase('fr') === v.toLocaleLowerCase('fr'))) return t('err.nameTaken', { field: label, name: v });
  return null;
}

function resourcesWindow() {
  const body = h('div', { id: 'res-win' });
  const paint = () => {
    clear(body);
    body.append(h('p', { class: 'hint', text: t('res.privacy') }));
    const table = h('table', { class: 'manage' },
      h('thead', {}, h('tr', {}, [t('res.name'), t('res.role'), t('res.capacity'), t('res.color'), '', ''].map(x => h('th', { scope: 'col', text: x })))));
    const tb = h('tbody');
    App.project.resources.forEach(r => {
      const used = App.project.tasks.filter(x => x.assign.some(a => a.res === r.id)).length;
      const nameIn = h('input', { type: 'text', value: r.name, maxlength: 100, aria: { label: `${t('res.name')} (${r.name})`, describedby: 'rerr-' + r.id }, data: { change: 'resField', arg: r.id + ':name' } });
      const roleIn = h('input', { type: 'text', value: r.role, maxlength: 100, aria: { label: `${t('res.role')} (${r.name})` }, data: { change: 'resField', arg: r.id + ':role' } });
      const capIn = h('input', { type: 'number', value: r.capacity, min: 1, max: 100, step: 1, inputmode: 'numeric', aria: { label: `${t('res.capacity')} (${r.name})`, describedby: 'rerr-' + r.id }, data: { change: 'resField', arg: r.id + ':capacity' } });
      const color = h('select', { aria: { label: `${t('res.color')} (${r.name})` }, data: { change: 'resField', arg: r.id + ':color' } },
        Model.PALETTE.map((c, i) => h('option', { value: c, selected: c === r.color }, t('color.pick', { n: i + 1 }))));
      const sw = h('span', { class: 'swatch', aria: { hidden: 'true' } }); sw.style.setProperty('background', safeColor(r.color));
      tb.append(h('tr', {},
        h('td', {}, nameIn, h('p', { class: 'field-error', id: 'rerr-' + r.id, hidden: true })),
        h('td', {}, roleIn), h('td', {}, capIn), h('td', {}, sw, color),
        h('td', { text: t('res.tasks', { count: used }) }),
        h('td', {}, h('button', { type: 'button', class: 'danger', data: { click: 'resDelete', arg: r.id } }, `${t('edit.delete')} ${r.name}`))));
    });
    table.append(tb);
    body.append(table, h('button', { type: 'button', data: { click: 'resAdd' } }, t('res.add')));
  };
  resourcesWindow.paint = paint;
  paint();
  return Dialog.open({ title: t('dlg.resources'), body: [body], size: 'wide', actions: [{ label: t('dlg.close'), value: 'close', kind: 'primary' }] })
    .then(() => { resourcesWindow.paint = null; });
}

action('resField', (arg, el) => {
  const [id, k] = arg.split(':');
  const r = resById(id);
  const err = $('rerr-' + id);
  const fail = msg => { err.textContent = msg; err.hidden = false; el.setAttribute('aria-invalid', 'true'); announce(msg); el.focus(); };
  if (err) { err.hidden = true; el.removeAttribute('aria-invalid'); }
  if (k === 'name') { const e = nameError(App.project.resources, id, el.value, t('res.name')); if (e) return fail(e); }
  if (k === 'capacity') {
    const n = Number(el.value);
    const maxUnits = Math.max(1, ...App.project.tasks.flatMap(x => x.assign.filter(a => a.res === id).map(a => a.units)));
    if (!Number.isInteger(n) || n < 1 || n > 100) return fail(t('err.int', { field: t('res.capacity'), min: 1, max: 100 }));
    if (n < maxUnits) return fail(t('err.int', { field: t('res.capacity'), min: maxUnits, max: 100 }));
  }
  if (k === 'color' && !Model.PALETTE.includes(el.value)) return;
  commit(() => {
    if (k === 'name') r.name = el.value.trim();
    else if (k === 'role') r.role = el.value.slice(0, 100);
    else if (k === 'capacity') r.capacity = Number(el.value);
    else if (k === 'color') r.color = el.value;
  });
  // On garde le focus dans la fenêtre : on ne repeint que si la liste change de forme.
  if (k === 'color' && resourcesWindow.paint) { resourcesWindow.paint(); document.querySelector(`[data-arg="${CSS.escape(arg)}"]`).focus(); }
});

action('resAdd', () => {
  if (App.project.resources.length >= Model.LIMITS.resources) { Dialog.message(t('dlg.resources'), t('err.limit', { max: Model.LIMITS.resources, what: t('dlg.resources').toLowerCase() })); return; }
  let n = App.project.resources.length + 1, name;
  do { name = `${t('res.new')} ${n++}`; } while (nameError(App.project.resources, '', name, ''));
  const used = new Set(App.project.resources.map(r => r.color));
  const color = Model.PALETTE.find(c => !used.has(c)) || Model.PALETTE[0];
  let id = 1; while (resById('R' + id)) id++;
  commit(p => p.resources.push({ id: 'R' + id, name, role: '', color, capacity: 100, absences: [] }));
  resourcesWindow.paint && resourcesWindow.paint();
  const inputs = document.querySelectorAll('#res-win tbody tr:last-child input');
  if (inputs[0]) { inputs[0].focus(); inputs[0].select(); }
});

action('resDelete', async id => {
  const r = resById(id);
  const used = App.project.tasks.filter(x => x.assign.some(a => a.res === id)).length;
  const ok = await Dialog.confirm(t('res.delete', { name: r.name }), [used ? t('res.deleteUsed', { count: used }) : ''], t('edit.delete'));
  if (!ok) return;
  commit(p => {
    p.resources = p.resources.filter(x => x.id !== id);
    for (const x of p.tasks) x.assign = x.assign.filter(a => a.res !== id);
  });
  resourcesWindow.paint && resourcesWindow.paint();
});

function categoriesWindow() {
  const body = h('div', { id: 'cat-win' });
  const paint = () => {
    clear(body);
    const table = h('table', { class: 'manage' },
      h('thead', {}, h('tr', {}, [t('res.name'), t('res.color'), '', ''].map(x => h('th', { scope: 'col', text: x })))));
    const tb = h('tbody');
    App.project.categories.forEach(c => {
      const used = App.project.tasks.filter(x => x.cat === c.id).length;
      const sw = h('span', { class: 'swatch', aria: { hidden: 'true' } }); sw.style.setProperty('background', safeColor(c.color));
      const color = h('select', { aria: { label: `${t('res.color')} (${c.name})` }, data: { change: 'catField', arg: c.id + ':color' } },
        Model.PALETTE.map((col, i) => h('option', { value: col, selected: col === c.color }, t('color.pick', { n: i + 1 }))));
      tb.append(h('tr', {},
        h('td', {}, h('input', { type: 'text', value: c.name, maxlength: 100, aria: { label: `${t('res.name')} (${c.name})`, describedby: 'cerr-' + c.id }, data: { change: 'catField', arg: c.id + ':name' } }),
          h('p', { class: 'field-error', id: 'cerr-' + c.id, hidden: true })),
        h('td', {}, sw, color),
        h('td', { text: t('res.tasks', { count: used }) }),
        h('td', {}, h('button', { type: 'button', class: 'danger', data: { click: 'catDelete', arg: c.id } }, `${t('edit.delete')} ${c.name}`))));
    });
    table.append(tb);
    body.append(table, h('button', { type: 'button', data: { click: 'catAdd' } }, t('cat.add')));
  };
  categoriesWindow.paint = paint;
  paint();
  return Dialog.open({ title: t('dlg.categories'), body: [body], size: 'wide', actions: [{ label: t('dlg.close'), value: 'close', kind: 'primary' }] })
    .then(() => { categoriesWindow.paint = null; });
}

action('catField', (arg, el) => {
  const [id, k] = arg.split(':');
  const c = catById(id);
  const err = $('cerr-' + id);
  if (err) { err.hidden = true; el.removeAttribute('aria-invalid'); }
  if (k === 'name') {
    const e = nameError(App.project.categories, id, el.value, t('res.name'));
    if (e) { err.textContent = e; err.hidden = false; el.setAttribute('aria-invalid', 'true'); announce(e); el.focus(); return; }
  }
  if (k === 'color' && !Model.PALETTE.includes(el.value)) return;
  commit(() => { if (k === 'name') c.name = el.value.trim(); else c.color = el.value; });
  if (k === 'color' && categoriesWindow.paint) { categoriesWindow.paint(); document.querySelector(`[data-arg="${CSS.escape(arg)}"]`).focus(); }
});

action('catAdd', () => {
  if (App.project.categories.length >= Model.LIMITS.categories) { Dialog.message(t('dlg.categories'), t('err.limit', { max: Model.LIMITS.categories, what: t('dlg.categories').toLowerCase() })); return; }
  let n = App.project.categories.length + 1, name;
  do { name = `${t('cat.new')} ${n++}`; } while (nameError(App.project.categories, '', name, ''));
  let id = 1; while (catById('C' + id)) id++;
  commit(p => p.categories.push({ id: 'C' + id, name, color: Model.PALETTE[p.categories.length % Model.PALETTE.length] }));
  categoriesWindow.paint && categoriesWindow.paint();
  const inp = document.querySelector('#cat-win tbody tr:last-child input');
  if (inp) { inp.focus(); inp.select(); }
});

action('catDelete', async id => {
  const c = catById(id);
  const others = App.project.categories.filter(x => x.id !== id);
  if (!others.length) { await Dialog.message(t('dlg.categories'), t('err.lastCategory')); return; }
  const used = App.project.tasks.filter(x => x.cat === id).length;
  const ok = await Dialog.confirm(t('cat.delete', { name: c.name }), [used ? t('cat.deleteUsed', { count: used, other: others[0].name }) : ''], t('edit.delete'));
  if (!ok) return;
  commit(p => {
    p.categories = p.categories.filter(x => x.id !== id);
    for (const x of p.tasks) if (x.cat === id) x.cat = others[0].id;
  });
  categoriesWindow.paint && categoriesWindow.paint();
});

/* Résolution des conflits (EF-31) : propositions simulées par Resolve.suggest, appliquées d'un clic. */
let resolveState = null;

function optionLabel(o) {
  const res = id => (resById(id) || { name: '' }).name;
  switch (o.kind) {
    case 'moveForced': return t('rsv.opt.moveForced', { task: o.task, date: I18n.date(Dates.parse(o.date)) });
    case 'unforce': return t('rsv.opt.unforce', { task: o.task });
    case 'reassign': return t('rsv.opt.reassign', { task: o.task, from: res(o.from), to: res(o.to) });
    case 'sequence': return t('rsv.opt.sequence', { first: o.first, task: o.task });
    default: return t('rsv.opt.level');
  }
}
function impactLabel(a) {
  const left = a.conflicts ? t('rsv.left', { count: a.conflicts }) : t('rsv.left0');
  const end = a.endShift > 0 ? t('rsv.endLater', { count: a.endShift }) : a.endShift < 0 ? t('rsv.endEarlier', { count: -a.endShift }) : t('rsv.endSame');
  return `${left} ; ${end}`;
}

function paintResolve(body) {
  clear(body);
  if (!App.sched || !App.sched.conflicts.length) { body.append(h('p', { text: t('rsv.none') })); resolveState = null; return; }
  const sug = Resolve.suggest(App.project, App.sched);
  resolveState = sug;
  body.append(h('p', { class: 'hint', text: t('rsv.intro') }));
  const msgs = alertMessages().filter(m => m.kind === 'conflict');
  const optionRow = (o, arg) => h('li', {},
    h('span', {}, optionLabel(o), h('br'), h('span', { class: 'impact', text: impactLabel(o.after) })),
    h('button', { type: 'button', class: 'primary', data: { click: 'applyResolve', arg }, aria: { label: t('rsv.applyLabel', { what: optionLabel(o) }) } }, t('rsv.apply')));
  sug.conflicts.forEach((c, k) => {
    body.append(h('section', { class: 'rsv-conflict' },
      h('h3', { text: '⚠ ' + (msgs[k] ? msgs[k].text : '') }),
      c.options.length ? h('ul', { class: 'rsv-options' }, c.options.map((o, j) => optionRow(o, `${k}:${j}`))) : h('p', { class: 'hint', text: t('rsv.noOption') })));
  });
  if (sug.global.length) body.append(h('section', { class: 'rsv-conflict' }, h('h3', { text: t('rsv.global') }),
    h('ul', { class: 'rsv-options' }, sug.global.map((o, j) => optionRow(o, `g:${j}`)))));
  if (sug.more) body.append(h('p', { class: 'hint', text: t('rsv.more', { count: sug.more }) }));
}

function resolveWindow() {
  const body = h('div', { id: 'rsv-win' });
  resolveWindow.body = body;
  paintResolve(body);
  return Dialog.open({ title: t('rsv.title'), body: [body], size: 'wide', actions: [{ label: t('dlg.close'), value: 'close', kind: 'primary' }] })
    .then(() => { resolveWindow.body = null; resolveState = null; });
}

action('applyResolve', arg => {
  if (!resolveState) return;
  const [k, j] = arg.split(':');
  const o = k === 'g' ? resolveState.global[Number(j)] : (resolveState.conflicts[Number(k)] || { options: [] }).options[Number(j)];
  if (!o) return;
  commit(p => o.mutate(p));
  const left = App.sched && App.sched.conflicts.length ? t('rsv.left', { count: App.sched.conflicts.length }) : t('rsv.left0');
  announce(t('rsv.applied', { left }));
  if (resolveWindow.body) {
    paintResolve(resolveWindow.body);
    const next = resolveWindow.body.querySelector('button');
    if (next) next.focus(); else resolveWindow.body.closest('dialog').querySelector('.actions button').focus();
  }
});

// ── js/ui/80-files.js ──
/* Fichiers : nouveau projet (EF-49), import (EF-52), export (EF-50, EF-51).
 * Un fichier importé est contrôlé en entier par Model.parseFile AVANT tout changement :
 * en cas de refus, le projet ouvert reste intact (EX-14). */

/** Nom de fichier d'export : « <nom>_gantt.json », a-z et 0-9 seulement (EF-50). */
function exportFileName(name) {
  const base = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '_') || 'projet';
  return base + '_gantt.json';
}

function download(text, filename, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: filename, hidden: true });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportWindow() {
  const anon = h('input', { type: 'checkbox', id: 'exp-anon' });
  const v = await Dialog.open({
    title: t('top.export'),
    body: [h('p', { text: t('exp.notice') }), h('div', { class: 'field check' }, anon, h('label', { for: 'exp-anon', text: t('exp.anonymize') }))],
    actions: [{ label: t('dlg.cancel'), value: 'cancel' }, { label: t('top.export'), value: 'ok', kind: 'primary', focus: true }],
  });
  if (v !== 'ok') return;
  const file = Model.serialize(App.project, { anonymize: anon.checked });
  download(JSON.stringify(file, null, 2), exportFileName(App.project.name), 'application/json');
  if (!anon.checked) App.dirty = false; // un export anonymisé ne conserve pas le projet complet
  announce(t('exp.notice'));
}

async function importText(text) {
  let result;
  try {
    result = Model.parseFile(text);
  } catch (e) {
    if (e instanceof Model.Invalid) { await Dialog.message(t('top.import'), I18n.error(e)); return; }
    await Dialog.message(t('top.import'), t('imp.unreadable'));
    return;
  }
  if (result.encrypted) { await Dialog.message(t('top.import'), t('imp.encrypted')); return; }
  const p = result.project;
  const work = p.tasks.filter(x => x.type === 'task');
  const avg = work.length ? Math.round(Metrics.globalProgress(p)) : 0;
  const lines = [
    h('p', { class: 'strong', text: `${p.emoji} ${p.name}` }),
    p.desc ? h('p', { text: p.desc }) : null,
    h('p', { text: t('imp.summary', { tasks: p.tasks.length, resources: p.resources.length, categories: p.categories.length, baselines: p.baselines.length,
      start: I18n.date(Dates.parse(p.projectStart)), pct: avg }) }),
    result.notices.unknown ? h('p', { class: 'hint', text: t('imp.notice.unknown', { count: result.notices.unknown }) }) : null,
    result.notices.createdResources.length ? h('p', { class: 'hint', text: t('imp.notice.resources', { names: result.notices.createdResources.join(', ') }) }) : null,
    result.notices.createdCategories.length ? h('p', { class: 'hint', text: t('imp.notice.categories', { names: result.notices.createdCategories.join(', ') }) }) : null,
    App.dirty ? h('p', { class: 'warning', text: t('dlg.unsaved') }) : null,
  ];
  const v = await Dialog.open({
    title: t('imp.title'), body: lines,
    actions: [{ label: t('dlg.cancel'), value: 'cancel', focus: true }, { label: t('imp.replace'), value: 'ok', kind: 'primary' }],
  });
  if (v !== 'ok') return;
  Editor.close();
  loadProject(p);
  App.dirty = false;
  render();
}

/** Noms du projet initial dans la langue choisie (3.8). */
function initialNames() {
  return { project: t('init.project'), task: t('init.task'), resource: t('init.resource'), category: t('init.category') };
}

async function newProjectAction() {
  if (App.dirty) {
    const ok = await Dialog.confirm(t('dlg.new'), [t('dlg.unsaved')], t('top.new'));
    if (!ok) return;
  }
  Editor.close();
  loadProject(Model.newProject(Dates.toISO(Dates.todayDn()), Date.now(), initialNames()));
  render();
}

// ── js/ui/99-main.js ──
/* Actions de l'écran principal et démarrage. */

action('selectTask', id => { if (taskById(id)) Editor.open(id); });

action('toggleCollapse', id => {
  // Replier ne modifie pas les données au sens d'EF-53 : pas d'historique, pas d'indicateur.
  const task = taskById(id);
  if (!task || task.type !== 'summary') return;
  task.collapsed = !task.collapsed;
  render();
  const btn = document.querySelector(`button.toggle[data-arg="${CSS.escape(id)}"]`);
  if (btn) btn.focus();
});

action('addTask', type => {
  if (App.project.tasks.length >= Model.LIMITS.tasks) { Dialog.message(t('top.addTask'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; }
  const id = Model.nextTaskId(App.project.tasks.map(x => x.id));
  const sel = App.selected && taskById(App.selected);
  let parent = sel && sel.type === 'summary' ? sel.id : (sel ? sel.parent : '');
  if (parent && ancestorsOf(parent).length + 1 > Model.LIMITS.depth) parent = '';
  const name = t(type === 'milestone' ? 'newMilestone' : type === 'summary' ? 'newSummary' : 'newTask');
  commit(p => p.tasks.push({
    id, name, type, parent, dur: type === 'task' ? 5 : 0, deps: [], assign: [], cat: type === 'summary' ? '' : (p.categories[0] ? p.categories[0].id : ''),
    pct: 0, forcedStart: '', notBefore: '', deadline: '', realStart: '', realEnd: '', tags: [], notes: '', comments: [], collapsed: false,
  }));
  announce(t('added', { id }));
  Editor.open(id);
  const nameIn = $('f-name');
  if (nameIn) nameIn.select();
});

action('deleteTask', async () => {
  const id = App.selected;
  const task = taskById(id);
  if (!task) return;
  const desc = descendants(id);
  const gone = new Set([id, ...desc.map(x => x.id)]);
  const losing = App.project.tasks.filter(x => !gone.has(x.id) && x.deps.some(d => gone.has(d.id))).length;
  const ok = await Dialog.confirm(t('dlg.deleteTask', { id, name: task.name }),
    [desc.length ? t('dlg.deleteSummary', { count: desc.length }) : '', losing ? t('dlg.deleteTaskDeps', { count: losing }) : ''], t('edit.delete'));
  if (!ok) return;
  commit(p => {
    p.tasks = p.tasks.filter(x => !gone.has(x.id));
    for (const x of p.tasks) x.deps = x.deps.filter(d => !gone.has(d.id));
  });
  App.selected = null;
  Editor.close();
  render();
  announce(t('deleted', { id }));
  $('main').focus();
});

action('moveTask', dir => {
  const id = App.selected;
  const task = taskById(id);
  if (!task) return;
  const siblings = App.project.tasks.filter(x => x.parent === task.parent);
  const i = siblings.indexOf(task), j = i + Number(dir);
  if (j < 0 || j >= siblings.length) return;
  commit(p => {
    // Échange des deux blocs (tâche + descendance) ; normalizeOrder garde la hiérarchie contiguë.
    const a = p.tasks.find(x => x.id === id), b = p.tasks.find(x => x.id === siblings[j].id);
    const ia = p.tasks.indexOf(a), ib = p.tasks.indexOf(b);
    p.tasks[ia] = b; p.tasks[ib] = a;
  });
  const btn = document.querySelector(`#editor [data-click="moveTask"][data-arg="${dir}"]`);
  if (btn) btn.focus();
});

action('setProjectStart', (arg, el) => {
  if (Dates.parse(el.value) == null) { announce(t('err.date', { field: t('top.start') })); el.value = App.project.projectStart; return; }
  const trial = clone(App.project);
  trial.projectStart = el.value;
  try { Schedule.compute(trial); } catch { announce(t('calc.error')); el.value = App.project.projectStart; return; }
  commit(p => { p.projectStart = el.value; });
});

action('undo', () => { if (undoStep(App.undo, App.redo)) announce(t('undo.done')); });
action('redo', () => { if (undoStep(App.redo, App.undo)) announce(t('redo.done')); });

action('zoom', step => {
  const s = Number(step);
  App.zoom = s === 0 ? 100 : Math.min(300, Math.max(20, App.zoom + 20 * s));
  render();
  announce(t('top.zoom', { pct: App.zoom }));
});

action('toggleAlerts', () => { App.showAlerts = !App.showAlerts; render(); if (!App.showAlerts) $('btn-alerts').focus(); });

action('toggleTheme', () => {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(Settings.get('theme') || 'system') + 1) % 3];
  Settings.set('theme', next);
  applyTheme();
  render();
});

action('toggleLang', () => {
  const next = I18n.getLang() === 'fr' ? 'en' : 'fr';
  Settings.set('lang', next);
  I18n.setLang(next);
  render();
  if (Editor.isOpen()) Editor.open(App.selected);
  $('btn-lang').focus();
});

action('editProject', () => editProjectWindow());
action('openResolve', () => resolveWindow());
action('setLeveling', (arg, el) => {
  if (!Schedule.MODES.includes(el.value)) return;
  commit(p => { p.leveling = el.value; });
  const n = App.sched ? App.sched.conflicts.length : 0;
  announce(`${t('top.leveling')} : ${t('lvl.' + el.value)}. ${n ? t('top.conflicts', { count: n }) : t('rsv.left0')}`);
});
action('openResources', () => resourcesWindow());
action('openCategories', () => categoriesWindow());
action('newProject', () => newProjectAction());
action('exportFile', () => exportWindow());
action('importFile', () => $('file-input').click());
action('fileChosen', async (arg, el) => {
  const file = el.files && el.files[0];
  el.value = '';
  if (!file) return;
  if (file.size > Model.MAX_BYTES) { await Dialog.message(t('top.import'), t('imp.tooBig')); return; }
  importText(await file.text());
});

function applyTheme() {
  const theme = Settings.get('theme') || 'system';
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

function initKeyboard() {
  document.addEventListener('keydown', ev => {
    const inField = ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]');
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !inField && !document.querySelector('dialog[open]')) {
      const k = ev.key.toLowerCase();
      if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); ACTIONS.undo(); }
      else if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); ACTIONS.redo(); }
    }
    if (ev.key === 'Escape' && !document.querySelector('dialog[open]') && Editor.isOpen()) { ev.preventDefault(); Editor.close(); }
    if (!inField && ev.target.closest && ev.target.closest('#gantt') && (ev.key === '+' || ev.key === '-')) { ev.preventDefault(); ACTIONS.zoom(ev.key === '+' ? '1' : '-1'); }
  });
  // Ctrl + molette sur la grille : zoom (EF-41).
  $('gantt').addEventListener('wheel', ev => { if (ev.ctrlKey) { ev.preventDefault(); ACTIONS.zoom(ev.deltaY < 0 ? '1' : '-1'); } }, { passive: false });
}

function init() {
  const lang = Settings.get('lang') || ((navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr');
  I18n.setLang(lang);
  applyTheme();
  initActions();
  initKeyboard();
  loadProject(Model.newProject(Dates.toISO(Dates.todayDn()), Date.now(), initialNames()));
  // Avertissement à la fermeture uniquement si des données ont changé (EF-53).
  window.addEventListener('beforeunload', ev => { if (App.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  // Import par glisser-déposer (EF-52).
  document.addEventListener('dragover', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
  document.addEventListener('drop', async ev => {
    const file = ev.dataTransfer && ev.dataTransfer.files[0];
    if (!file) return;
    ev.preventDefault();
    if (file.size > Model.MAX_BYTES) { await Dialog.message(t('top.import'), t('imp.tooBig')); return; }
    importText(await file.text());
  });
  render();
}

init();
})();
