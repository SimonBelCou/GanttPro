/* Thèmes (EF-47, EX-03) : contrastes du texte ≥ 4,5:1 et des éléments d'interface ≥ 3:1. */
:root {
  --bg: #f6f7fb; --panel: #ffffff; --panel-2: #eef1f7; --text: #141a26; --muted: #4a5468; --line: #c7cedb;
  --accent: #1f5fd1; --accent-ink: #ffffff; --critical: #c21f1f; --warning: #8a5200; --ok: #17733f;
  --focus: #1f5fd1; --off: rgba(20, 26, 38, 0.07); --today: #c21f1f; --bar-ink: #000;
  --row: 34px; --head: 34px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --panel: #171c27; --panel-2: #202737; --text: #e8ecf4; --muted: #a9b3c6; --line: #3a4458;
    --accent: #7fb0ff; --accent-ink: #0b1220; --critical: #ff7a7a; --warning: #ffc069; --ok: #6fdc9c;
    --focus: #9cc2ff; --off: rgba(255, 255, 255, 0.06); --today: #ff7a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --panel: #171c27; --panel-2: #202737; --text: #e8ecf4; --muted: #a9b3c6; --line: #3a4458;
  --accent: #7fb0ff; --accent-ink: #0b1220; --critical: #ff7a7a; --warning: #ffc069; --ok: #6fdc9c;
  --focus: #9cc2ff; --off: rgba(255, 255, 255, 0.06); --today: #ff7a7a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 Sora, system-ui, sans-serif; }
h1, h2 { margin: 0; font-weight: 700; }
h2 { font-size: 1.1rem; margin-bottom: .75rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem 1rem; z-index: 10; }
.skip:focus { left: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

button, input, select, textarea { font: inherit; color: inherit; }
button {
  min-height: 32px; padding: .3rem .7rem; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2); cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .55; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--critical); border-color: var(--critical); background: transparent; }
button.icon { min-width: 32px; padding: .2rem .4rem; }
input, select, textarea { background: var(--panel); border: 1px solid var(--muted); border-radius: 6px; padding: .3rem .45rem; min-height: 32px; }
input[type="checkbox"], input[type="radio"] { min-height: 0; width: 18px; height: 18px; accent-color: var(--accent); }
input.upper { text-transform: uppercase; font-family: 'Fira Code', monospace; }
[aria-invalid="true"] { border-color: var(--critical); border-width: 2px; }

/* Barre du haut */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .6rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-size: 1.15rem; letter-spacing: .02em; }
.project-label { font-weight: 600; background: transparent; }
.field-inline { display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.toolbar .group { display: inline-flex; gap: .25rem; align-items: center; padding-right: .5rem; border-right: 1px solid var(--line); }
.toolbar .group:last-child { border-right: 0; }
.zoom-level { min-width: 6.5em; text-align: center; color: var(--muted); }
.badge { color: var(--critical); border-color: var(--critical); font-weight: 600; }

/* Chiffres */
.kpis { padding: .5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.kpis dl { display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; margin: 0; }
.kpi { display: flex; gap: .4rem; align-items: baseline; }
.kpi dt { color: var(--muted); }
.kpi dd { margin: 0; font-weight: 600; display: inline-flex; gap: .4rem; align-items: center; }
.critical-path { font-family: 'Fira Code', monospace; color: var(--critical); }
progress { width: 90px; height: 10px; accent-color: var(--accent); }

/* Alertes */
.alerts { display: flex; gap: 1rem; justify-content: space-between; padding: .5rem 1rem; background: color-mix(in srgb, var(--critical) 10%, var(--panel)); border-bottom: 1px solid var(--critical); }
.alerts ul { margin: 0; padding-left: 0; list-style: none; }
.alerts li.conflict { color: var(--critical); font-weight: 600; }
.alerts li.warning { color: var(--warning); font-weight: 600; }

/* Planning : liste + grille, défilement vertical commun */
main { outline: none; }
.planner { display: grid; grid-template-columns: minmax(520px, 56%) 1fr; max-height: calc(100vh - 210px); min-height: 300px; overflow: auto; border-bottom: 1px solid var(--line); }
.list { background: var(--panel); border-right: 1px solid var(--line); overflow-x: auto; }
table.tasks { border-collapse: collapse; width: 100%; }
.tasks th, .tasks td { height: var(--row); padding: 0 .45rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tasks thead th { height: var(--head); position: sticky; top: 0; background: var(--panel-2); z-index: 2; font-weight: 600; }
.tasks td.id { font-family: 'Fira Code', monospace; }
.tasks td.name { padding-left: calc(.45rem + var(--depth, 0) * 1.1rem); max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
.tasks button.select { background: transparent; border: 0; padding: 0 .2rem; min-height: 28px; text-align: left; max-width: 18rem; overflow: hidden; text-overflow: ellipsis; }
.tasks button.toggle { background: transparent; border: 0; min-height: 26px; min-width: 26px; }
.tasks tr.summary button.select { font-weight: 700; }
.tasks tr.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tasks tr.critical td.id { color: var(--critical); font-weight: 700; }
.tasks .marks { margin-left: .4rem; font-size: .8rem; color: var(--critical); }
.tasks .marks.info { color: var(--muted); }
.note { margin: 0 0 .8rem; padding: .5rem .7rem; border-left: 4px solid var(--accent); background: var(--panel-2); }
.rsv-conflict { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; margin: .6rem 0; }
.rsv-conflict h3 { margin: 0 0 .4rem; font-size: .95rem; color: var(--critical); }
.rsv-options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
.rsv-options li { display: flex; gap: .6rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.rsv-options .impact { color: var(--muted); font-size: .85rem; }
.tasks tr.auto-ms td { color: var(--muted); font-style: italic; }
.tasks td.status.late { color: var(--critical); font-weight: 600; }
.tasks td.status.done { color: var(--ok); }

.gantt { overflow-x: auto; overflow-y: hidden; background: var(--panel); }
.gantt-inner { position: relative; width: var(--grid-w); min-width: 100%; }
.g-head { position: relative; height: var(--head); background: var(--panel-2); border-bottom: 1px solid var(--line); }
.g-col { position: absolute; border-left: 1px solid var(--line); font-size: .72rem; line-height: 17px; color: var(--muted); padding: 0 .2rem; overflow: hidden; white-space: nowrap; }
.g-col.month { top: 0; height: 17px; font-weight: 600; }
.g-col.month.full { height: 100%; line-height: var(--head); }
.g-col.week { top: 17px; height: 17px; border-top: 1px solid var(--line); text-align: center; padding: 0; }
.g-col.has-holiday { background: color-mix(in srgb, var(--warning) 14%, transparent); }
.g-body { position: relative; }
.g-row { position: relative; height: var(--row); border-bottom: 1px solid var(--line); }
.g-off { position: absolute; top: 0; bottom: 0; background: var(--off); pointer-events: none; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--today); z-index: 1; }
.bar {
  position: absolute; top: 7px; height: 20px; border-radius: 4px; background: var(--c, #8a94a6);
  border: 1px solid color-mix(in srgb, var(--c, #8a94a6) 60%, #000); overflow: hidden; cursor: pointer; z-index: 2;
}
.bar .done {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: repeating-linear-gradient(135deg, rgba(0,0,0,.28) 0 4px, transparent 4px 8px);
}
.bar .bar-label { position: relative; padding: 0 .3rem; font: 600 11px/18px 'Fira Code', monospace; color: var(--ink, #000); white-space: nowrap; }
.bar.critical { box-shadow: 0 0 0 2px var(--critical); }
.bar.conflict { outline: 2px dashed var(--critical); outline-offset: 1px; }
.bar.selected, .ms.selected, .sbar.selected { box-shadow: 0 0 0 3px var(--accent); }
.ms {
  position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg);
  border: 2px solid var(--text); background: var(--panel); cursor: pointer; z-index: 2;
}
.ms.reached { background: var(--text); }
.ms.critical { border-color: var(--critical); }
.ms.auto { border-color: var(--muted); cursor: default; }
.ms.auto.end { background: var(--muted); }
.sbar { position: absolute; top: 10px; height: 10px; background: var(--text); border-radius: 2px 2px 0 0; cursor: pointer; z-index: 2; }
.sbar::before, .sbar::after { content: ''; position: absolute; top: 10px; border: 5px solid transparent; border-top-color: var(--text); }
.sbar::before { left: 0; border-left-color: var(--text); }
.sbar::after { right: 0; border-right-color: var(--text); }

.legend { padding: .5rem 1rem; }
.legend ul { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin: 0; padding: 0; list-style: none; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: .35rem; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); vertical-align: middle; }
.swatch.critical { background: transparent; box-shadow: 0 0 0 2px var(--critical); }
.swatch.today { width: 3px; background: var(--today); }

/* Panneau d'édition */
.editor {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); overflow: auto; z-index: 5;
  background: var(--panel); border-left: 1px solid var(--line); padding: 1rem; box-shadow: -8px 0 24px rgba(0,0,0,.18);
}
.field { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .7rem; }
.field.check { flex-direction: row; align-items: center; gap: .5rem; }
.field label { font-weight: 600; }
.field-error { margin: .1rem 0 0; color: var(--critical); font-weight: 600; }
.hint { margin: .2rem 0; color: var(--muted); }
.warning { color: var(--warning); font-weight: 600; }
fieldset.sub { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 .7rem; padding: .4rem .6rem .6rem; }
fieldset.sub legend { font-weight: 600; padding: 0 .3rem; }
ul.rows { list-style: none; margin: 0 0 .4rem; padding: 0; display: flex; flex-direction: column; gap: .3rem; }
ul.rows li { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
ul.rows .who { flex: 1 1 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.rows input[type="number"] { width: 5.5rem; }
.add-row { display: flex; gap: .3rem; flex-wrap: wrap; }
.add-row select { flex: 1 1 10rem; }
.actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }

/* Fenêtres */
dialog.dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 1.2rem; width: min(520px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; }
dialog.dialog.wide { width: min(900px, calc(100vw - 2rem)); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dialog-body p { margin: .3rem 0; }
.dialog-body .strong { font-weight: 700; }
table.manage { border-collapse: collapse; width: 100%; margin-bottom: .7rem; }
table.manage th, table.manage td { padding: .3rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.manage input[type="number"] { width: 5rem; }
fieldset.emojis { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-wrap: wrap; gap: .2rem; }
.emoji-opt { display: inline-flex; align-items: center; }
.emoji-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.emoji-opt label { font-size: 1.3rem; padding: .2rem .35rem; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
.emoji-opt input:checked + label { border-color: var(--accent); background: var(--panel-2); }
.emoji-opt input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 1px; }

/* Écrans étroits (4.4) */
@media (max-width: 900px) {
  .planner { grid-template-columns: 1fr; max-height: none; }
  .list { border-right: 0; overflow-x: auto; }
  .editor { width: 100vw; }
}

/* Moins de mouvement (EX-04) */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media print {
  .topbar .toolbar, .editor, .skip { display: none !important; }
  body { background: #fff; color: #000; }
  .planner { max-height: none; overflow: visible; }
}

<script>
(() => {
'use strict';
// ── js/core/00-dates.js ──
/* Dates « civiles » sans fuseau : un jour est un entier (dn), nombre de jours depuis le
 * 01/01/1970. Tous les calculs se font sur ces entiers, jamais sur des Date locales, ce qui
 * évite les décalages d'heure d'été et de fuseau (défaut A-23 de la version 2.3).
 * La date du jour est lue dans le fuseau de l'utilisateur (todayDn). */
const Dates = (() => {
  const MIN_YEAR = 1970;
  const MAX_YEAR = 2199; // borne de sûreté : un fichier ne peut pas forcer un calcul sur des millénaires
  const ISO = /^(\d{4})-(\d{2})-(\d{2})$/;

  /** 'AAAA-MM-JJ' → dn, ou null si la chaîne n'est pas une date existante dans les bornes. */
  function parse(s) {
    if (typeof s !== 'string') return null;
    const m = ISO.exec(s);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (y < MIN_YEAR || y > MAX_YEAR || mo < 1 || mo > 12 || d < 1) return null;
    const t = Date.UTC(y, mo - 1, d);
    const back = new Date(t);
    if (back.getUTCMonth() !== mo - 1 || back.getUTCDate() !== d) return null;
    return Math.round(t / 86400000);
  }

  function fromYMD(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / 86400000); }

  function toISO(dn) {
    const t = new Date(dn * 86400000);
    const p = (n, w) => String(n).padStart(w, '0');
    return `${p(t.getUTCFullYear(), 4)}-${p(t.getUTCMonth() + 1, 2)}-${p(t.getUTCDate(), 2)}`;
  }

  /** {y, m (1-12), d} d'un dn. */
  function ymd(dn) {
    const t = new Date(dn * 86400000);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
  }

  /** Jour de la semaine : 0 = lundi … 6 = dimanche (le 01/01/1970 était un jeudi). */
  function weekday(dn) { return ((dn + 3) % 7 + 7) % 7; }

  /** Date du jour dans le fuseau de l'ordinateur de l'utilisateur. */
  function todayDn(now = new Date()) {
    return fromYMD(now.getFullYear(), now.getMonth() + 1, now.getDate());
  }

  function mondayOf(dn) { return dn - weekday(dn); }
  function monthStart(dn) { const { y, m } = ymd(dn); return fromYMD(y, m, 1); }
  function monthEnd(dn) { const { y, m } = ymd(dn); return fromYMD(y, m + 1, 1) - 1; }

  const MAX_DN = fromYMD(MAX_YEAR, 12, 31);
  const MIN_DN = fromYMD(MIN_YEAR, 1, 1);

  return { parse, fromYMD, toISO, ymd, weekday, todayDn, mondayOf, monthStart, monthEnd, MIN_DN, MAX_DN, MIN_YEAR, MAX_YEAR };
})();

// ── js/core/10-calendar.js ──
/* Calendrier du projet (RG-01 à RG-03, 3.9).
 *
 * Les jours ouvrés sont numérotés : l'index 0 est le premier jour ouvré à partir du début du
 * projet, les suivants 1, 2…, les précédents −1, −2… Une durée, un délai ou un écart en jours
 * ouvrés devient alors une simple soustraction d'index. Les tables s'étendent à la demande,
 * dans la limite de Dates.MIN_DN … Dates.MAX_DN (au-delà : RangeError, signalée à l'utilisateur). */
const Calendar = (() => {
  const HOLIDAY_SETS = ['FR', 'FR-AM', 'BE', 'DE', 'NONE'];
  const DEFAULT = Object.freeze({ workDays: [1, 1, 1, 1, 1, 0, 0], holidays: 'FR', daysOff: [], daysWorked: [] });

  /** Dimanche de Pâques (calendrier grégorien, algorithme de Meeus/Jones/Butcher). */
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return Dates.fromYMD(y, month, day);
  }

  /** Jours fériés d'une année pour un jeu donné : Map dn → clé de libellé (traduite par l'interface). */
  function holidaysOf(set, y) {
    const out = new Map();
    if (set === 'NONE') return out;
    const E = easter(y);
    const add = (dn, key) => out.set(dn, key);
    const fixed = (m, d, key) => add(Dates.fromYMD(y, m, d), key);
    fixed(1, 1, 'hol.newYear');
    if (set === 'DE' || set === 'FR-AM') add(E - 2, 'hol.goodFriday');
    add(E + 1, 'hol.easterMonday');
    fixed(5, 1, 'hol.labour');
    if (set === 'FR' || set === 'FR-AM') fixed(5, 8, 'hol.victory');
    add(E + 39, 'hol.ascension');
    add(E + 50, 'hol.whitMonday');
    if (set === 'FR' || set === 'FR-AM') fixed(7, 14, 'hol.bastille');
    if (set === 'BE') fixed(7, 21, 'hol.belgium');
    if (set !== 'DE') { fixed(8, 15, 'hol.assumption'); fixed(11, 1, 'hol.allSaints'); fixed(11, 11, 'hol.armistice'); }
    if (set === 'DE') fixed(10, 3, 'hol.germanUnity');
    fixed(12, 25, 'hol.christmas');
    if (set === 'DE' || set === 'FR-AM') fixed(12, 26, 'hol.stStephen');
    return out;
  }

  /** Développe une liste de plages {start, end, label} en Map dn → libellé. */
  function expandRanges(list) {
    const out = new Map();
    for (const r of list || []) {
      const a = Dates.parse(r.start), b = Dates.parse(r.end || r.start);
      if (a == null || b == null) continue;
      for (let dn = a; dn <= b; dn++) out.set(dn, r.label || '');
    }
    return out;
  }

  /**
   * Crée le calendrier de calcul.
   * @param {object} def   calendrier du projet (3.9)
   * @param {string} startIso  début du projet : l'index 0 est le premier jour ouvré à partir de cette date
   */
  function create(def, startIso) {
    const cfg = def || DEFAULT;
    const workDays = (cfg.workDays || DEFAULT.workDays).map(v => !!v);
    const set = HOLIDAY_SETS.includes(cfg.holidays) ? cfg.holidays : 'FR';
    const off = expandRanges(cfg.daysOff);
    const worked = expandRanges(cfg.daysWorked);
    const holCache = new Map();

    function holidayKey(dn) {
      const y = Dates.ymd(dn).y;
      if (!holCache.has(y)) holCache.set(y, holidaysOf(set, y));
      return holCache.get(y).get(dn) || null;
    }

    /** RG-01 : le jour travaillé exceptionnel l'emporte sur tout. */
    function isWork(dn) {
      if (worked.has(dn)) return true;
      if (!workDays[Dates.weekday(dn)]) return false;
      if (off.has(dn)) return false;
      return holidayKey(dn) == null;
    }

    /** Pourquoi un jour n'est pas travaillé : {kind:'holiday', key} | {kind:'off', label} | {kind:'weekend'} | null. */
    function dayInfo(dn) {
      if (worked.has(dn)) return { kind: 'worked', label: worked.get(dn) };
      if (off.has(dn) && workDays[Dates.weekday(dn)]) return { kind: 'off', label: off.get(dn) };
      const hk = holidayKey(dn);
      if (hk && workDays[Dates.weekday(dn)]) return { kind: 'holiday', key: hk };
      if (!workDays[Dates.weekday(dn)]) return { kind: 'weekend', key: hk };
      return null;
    }

    const start = Dates.parse(startIso);
    if (start == null) throw new RangeError('calendar.start');
    if (!workDays.some(Boolean) && worked.size === 0) throw new RangeError('calendar.noWorkday');

    // fwd[i] = dn du jour ouvré d'index i (i ≥ 0) ; bwd[j] = dn du jour ouvré d'index −(j+1).
    const fwd = [], bwd = [];
    let fwdScan = start - 1;   // dernier dn examiné vers l'avant
    let bwdScan = start;       // dernier dn examiné vers l'arrière

    function growFwd(untilDn) {
      while (fwdScan < untilDn) {
        fwdScan++;
        if (fwdScan > Dates.MAX_DN) throw new RangeError('calendar.range');
        if (isWork(fwdScan)) fwd.push(fwdScan);
      }
    }
    function growFwdIdx(i) {
      // Une semaine sans aucun jour ouvré est possible (fermeture) : on avance jusqu'à trouver.
      while (fwd.length <= i) growFwd(fwdScan + 7);
    }
    function growBwd(untilDn) {
      while (bwdScan > untilDn) {
        bwdScan--;
        if (bwdScan < Dates.MIN_DN) throw new RangeError('calendar.range');
        if (isWork(bwdScan)) bwd.push(bwdScan);
      }
    }
    function growBwdIdx(j) { while (bwd.length <= j) growBwd(bwdScan - 7); }

    growFwdIdx(0);

    /** dn du jour ouvré d'index i. */
    function dnOf(i) {
      if (i >= 0) { growFwdIdx(i); return fwd[i]; }
      growBwdIdx(-i - 1); return bwd[-i - 1];
    }

    // Recherche dichotomique : premier index de arr (croissant) dont la valeur est ≥ v.
    function lowerBound(arr, v) {
      let lo = 0, hi = arr.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] < v) lo = mid + 1; else hi = mid; }
      return lo;
    }

    /** Index du premier jour ouvré ≥ dn. */
    function ceil(dn) {
      if (dn >= fwd[0]) {
        growFwd(dn);
        // Garantit l'existence d'un jour ouvré ≥ dn, sans étendre la table à chaque appel.
        while (fwd[fwd.length - 1] < dn) growFwdIdx(fwd.length);
        return lowerBound(fwd, dn);
      }
      // dn avant le premier jour ouvré du projet : on cherche parmi les jours précédents.
      growBwd(dn);
      // bwd est décroissant : le plus petit jour ouvré ≥ dn est le dernier élément ≥ dn.
      let j = -1;
      for (let lo = 0, hi = bwd.length - 1; lo <= hi;) {
        const mid = (lo + hi) >> 1;
        if (bwd[mid] >= dn) { j = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return j < 0 ? 0 : -(j + 1);
    }

    /** Index du dernier jour ouvré ≤ dn. */
    function floor(dn) {
      const c = ceil(dn);
      return dnOf(c) === dn ? c : c - 1;
    }

    /** Nombre de jours ouvrés de a à b inclus (0 si b < a). */
    function count(a, b) { return b < a ? 0 : Math.max(0, floor(b) - ceil(a) + 1); }

    return { isWork, dayInfo, holidayKey, dnOf, ceil, floor, count, startDn: start, set };
  }

  return { create, easter, holidaysOf, HOLIDAY_SETS, DEFAULT };
})();

// ── js/core/20-schedule.js ──
/* Ordonnancement (RG-04 à RG-12, RG-23 à RG-25, RG-33).
 *
 * Gestion de la charge des ressources, au choix du projet (project.leveling) :
 *   'level'  nivellement automatique (défaut) : une tâche est décalée jusqu'à ce que ses ressources
 *            soient libres, quitte à repousser la fin du projet (RG-08) ;
 *   'smooth' lissage : une tâche n'est décalée que dans sa marge — jamais après sa date de début au
 *            plus tard calculée SANS nivellement — donc la fin du projet et les échéances ne bougent
 *            pas ; une surcharge qui ne tient pas dans la marge reste un conflit (RG-33) ;
 *   'off'    aucun décalage : chaque chevauchement est un conflit.
 *
 * Calcul déterministe : mêmes données, même ordre de liste → mêmes dates. Tout se fait en
 * index de jours ouvrés (voir Calendar) ; les dates ne sont reconstituées qu'à la fin.
 * Entrée : un projet déjà contrôlé par Model.sanitize (aucune boucle, références valides).
 * Liens : type FS (fin-début, FD), SS (DD), FF, SF (DF), délai entier en jours ouvrés. */
const Schedule = (() => {
  const isMilestone = t => t.type === 'milestone';
  const isSummary = t => t.type === 'summary';
  const durOf = t => (isMilestone(t) ? 0 : t.dur);
  /** Décalage début → fin : une tâche de n jours finit n−1 jours ouvrés après son début (RG-05). */
  const spanOf = t => Math.max(durOf(t) - 1, 0);

  const MODES = Object.freeze(['level', 'smooth', 'off']);

  function compute(project, opts = {}) {
    const mode = opts.mode || (MODES.includes(project.leveling) ? project.leveling : 'level');
    // Lissage : dates de début au plus tard d'un calcul sans nivellement ni enchaînement de ressource.
    const smoothCap = mode === 'smooth' ? lateStartsWithoutLeveling(project) : null;
    const cal = Calendar.create(project.calendar, project.projectStart);
    const tasks = project.tasks;
    const order = new Map(tasks.map((t, i) => [t.id, i]));
    const byId = new Map(tasks.map(t => [t.id, t]));
    const resources = new Map(project.resources.map(r => [r.id, r]));
    const out = new Map();
    const warnings = [];

    // Absences (RG-25) en index de jours ouvrés ; charge par ressource et par jour.
    const absent = new Map(), load = new Map();
    for (const r of project.resources) {
      const set = new Set();
      for (const a of r.absences || []) {

        for (let i = from; i <= to; i++) set.add(i);

    }
    const assignsOf = t => (isMilestone(t) || isSummary(t) ? [] : (t.assign || []).filter(a => resources.has(a.res)));

    /** Début au plus tôt imposé par un lien (RG-06, RG-10). */
    function linkBound(t, dep) {
      const p = out.get(dep.id), lag = dep.lag || 0;
      switch (dep.type) {
        case 'SS': return p.s + lag;
        case 'FF': return p.e + lag - spanOf(t);

          // Un taux supérieur à la capacité est refusé à la saisie ; par sûreté il n'est pas nivelé.
          if (a.units <= cap && (load.get(a.res).get(i) || 0) + a.units > cap) return { i, res: a.res, kind: 'overload' };

     * cap (lissage, RG-33) : début à ne pas dépasser ; au-delà, la tâche reste à son début au plus tôt.
     * Renvoie {s, cause} — cause : première ressource qui a imposé un décalage — ou {s, unresolved}.

    function level(assigns, s, d, cap = Infinity) {
      const start = s;
      let cause = null;
      for (let guard = 0; guard < 1e6; guard++) {
        const f = firstFault(assigns, s, d);
        if (!f) return { s, cause };
        if (!cause) cause = f;
        if (f.i + 1 > cap) return { s: start, cause, unresolved: true };
        s = f.i + 1;
      }
      return { s, cause };
    }

    const state = new Map();
    function place(t) {
      if (isSummary(t) || state.get(t.id) === 2) return;
      if (state.get(t.id) === 1) throw new Error('schedule.cycle'); // impossible après Model.sanitize
      state.set(t.id, 1);
      for (const dep of t.deps) { const p = byId.get(dep.id); if (p) place(p); }

      const d = durOf(t), assigns = assignsOf(t);

      for (const dep of t.deps) if (out.has(dep.id)) earliest = Math.max(earliest, linkBound(t, dep));

      let s, shift = null;
      if (t.forcedStart) {
        s = cal.ceil(Dates.parse(t.forcedStart)); // RG-07 : l'emporte sur les liens et le nivellement
        for (const dep of t.deps) {
          if (!out.has(dep.id)) continue;

      }

    function summarize(t) {
      if (out.has(t.id)) return out.get(t.id);

        if (isSummary(c)) { const r = summarize(c); if (!r.empty) { s = Math.min(s, r.s); e = Math.max(e, r.e); } leaves = leaves.concat(leafTasks.get(c.id)); }

      return r;

    for (const t of tasks) if (isSummary(t)) summarize(t);

    let projectEnd = 0;
    for (const t of tasks) if (!isSummary(t)) projectEnd = Math.max(projectEnd, out.get(t.id).e);

    const succ = new Map(tasks.map(t => [t.id, []]));
    for (const t of tasks) for (const dep of t.deps) if (succ.has(dep.id)) succ.get(dep.id).push({ to: t, type: dep.type, lag: dep.lag || 0 });
    for (const r of (mode === 'off' || opts.noResourceEdges ? [] : project.resources)) {
      const on = tasks.filter(t => assignsOf(t).some(a => a.res === r.id))
        .sort((a, b) => out.get(a.id).s - out.get(b.id).s || order.get(a.id) - order.get(b.id));
      for (let k = 0; k < on.length; k++) {
        const te = out.get(on[k].id).e;
        for (let j = k + 1; j < on.length; j++) {
          if (out.get(on[j].id).s > te) { succ.get(on[k].id).push({ to: on[j], type: 'RES', lag: 0 }); break; }
        }
      }
    }

    // Fin au plus tard (passe arrière) ; une date imposée ne bouge pas.
    const lateFinish = new Map(), visiting = new Set();
    function lf(t) {
      if (lateFinish.has(t.id)) return lateFinish.get(t.id);
      if (visiting.has(t.id)) return projectEnd; // garde-fou (liens + enchaînement de ressource)
      visiting.add(t.id);
      let L = projectEnd;
      if (t.deadline) L = Math.min(L, cal.floor(Dates.parse(t.deadline)));
      const oT = spanOf(t);
      for (const { to: S, type, lag } of succ.get(t.id)) {
        const rs = out.get(S.id);
        const LS = S.forcedStart ? rs.s : lf(S) - spanOf(S);
        const LE = S.forcedStart ? rs.e : lf(S);
        switch (type) {
          case 'SS': L = Math.min(L, LS - lag + oT); break;
          case 'FF': L = Math.min(L, LE - lag); break;
          case 'SF': L = Math.min(L, LE + 1 - lag + oT); break;
          case 'RES': L = Math.min(L, LS - 1); break;
          default: L = Math.min(L, isMilestone(S) ? LS - lag : LS - 1 - lag);

      }
      visiting.delete(t.id);
      lateFinish.set(t.id, L);
      return L;
    }
    for (const t of tasks) {
      if (isSummary(t)) continue;
      const r = out.get(t.id);
      r.slack = lf(t) - r.e;
      r.critical = r.slack <= 0;
      if (t.deadline) {
        const late = r.e - cal.floor(Dates.parse(t.deadline));

      }
    }

    // Dates civiles.
    for (const r of out.values()) {
      if (r.empty) continue;
      r.startDn = cal.dnOf(r.s);
      r.endDn = cal.dnOf(r.e);
      if (r.shift) r.earliestDn = cal.dnOf(r.earliest);
    }

    const criticalPath = tasks.filter(t => !isSummary(t) && out.get(t.id).critical)
      .sort((a, b) => out.get(a.id).s - out.get(b.id).s || out.get(a.id).e - out.get(b.id).e || order.get(a.id) - order.get(b.id))
      .map(t => t.id);

    // Conflits (RG-12) : périodes continues de jours en surcharge ou en absence.
    const conflicts = [];
    for (const r of project.resources) {
      const m = load.get(r.id), abs = absent.get(r.id);

      for (let k = 0; k < bad.length;) {
        let j = k;
        while (j + 1 < bad.length && bad[j + 1] === bad[j] + 1) j++;
        const from = bad[k], to = bad[j];
        const involved = tasks.filter(t => assignsOf(t).some(a => a.res === r.id) && out.get(t.id).s <= to && out.get(t.id).e >= from).map(t => t.id);
        const kind = bad.slice(k, j + 1).some(i => abs.has(i)) ? 'absence' : 'overload';

        k = j + 1;
      }
    }

    return {
      mode, cal, tasks: out, projectEnd, projectEndDn: cal.dnOf(projectEnd), startDn: cal.dnOf(0),
      criticalPath, conflicts, warnings,
      /** Charge d'une ressource un jour ouvré (somme des taux, RG-25). */
      loadOf: (resId, i) => (load.get(resId) && load.get(resId).get(i)) || 0,
      /** Capacité du jour : 0 un jour d'absence (RG-25). */
      capacityOf: (resId, i) => (absent.get(resId) && absent.get(resId).has(i) ? 0 : (resources.get(resId) || { capacity: 0 }).capacity),

    }
    return caps;
  }

  return { compute, durOf, isMilestone, isSummary, MODES };

/* Suivi et indicateurs (RG-13 à RG-20, RG-26, RG-28).
 * Un seul calcul de statut pour toute l'application (défaut A-06 de la version 2.3). */
const Metrics = (() => {
  const STATUS = Object.freeze({ DONE: 'done', LATE: 'late', ONGOING: 'ongoing', NOT_STARTED: 'notStarted', UPCOMING: 'upcoming' });

  /** Avancement effectif : une récapitulative prend celui calculé à partir de ses enfants (RG-23). */
  function pctOf(t, sched) { return t.type === 'summary' ? sched.tasks.get(t.id).pct : t.pct; }

  /** RG-14. today : dn. Renvoie null pour une récapitulative sans enfant. */
  function status(t, sched, today) {
    const r = sched.tasks.get(t.id);
    if (!r || r.empty) return null;
    const pct = pctOf(t, sched);
    if (t.type === 'milestone') {
      if (pct >= 100) return STATUS.DONE;
      return r.endDn < today ? STATUS.LATE : STATUS.UPCOMING;
    }
    if (pct >= 100) return STATUS.DONE;
    if (r.endDn < today) return STATUS.LATE;
    if (pct > 0) return STATUS.ONGOING;
    if (r.startDn <= today) return STATUS.NOT_STARTED;
    return STATUS.UPCOMING;
  }

  /** RG-15 : écart en jours ouvrés entre fin prévue et fin réelle ; {days, ongoing} ou null. */
  function deviation(t, sched, today) {
    const r = sched.tasks.get(t.id);
    if (!r || r.empty || t.type === 'summary') return null;
    const real = Dates.parse(t.realEnd);
    if (real != null) return { days: sched.cal.floor(real) - r.e, ongoing: false };
    if (t.pct < 100 && r.endDn < today) return { days: sched.cal.floor(today) - r.e, ongoing: true };
    return null;
  }

  const countsInProgress = t => t.type === 'task';

  /** RG-16 : avancement global pondéré par la durée, en pourcentage (non arrondi). */
  function globalProgress(project) {
    let w = 0, acc = 0;
    for (const t of project.tasks) if (countsInProgress(t)) { w += t.dur; acc += t.dur * t.pct; }
    return w ? acc / w : 0;
  }

  /** RG-16 : compteurs par statut (tâches et jalons, hors récapitulatives). */
  function counters(project, sched, today) {
    const c = { done: 0, ongoing: 0, late: 0, notStarted: 0, upcoming: 0, total: 0 };
    for (const t of project.tasks) {
      if (t.type === 'summary') continue;
      c.total++;
      c[status(t, sched, today)]++;
    }
    return c;
  }

  /** RG-17 : périodes (semaines du lundi au dimanche, ou mois civils) couvrant [fromDn, toDn]. */
  function periods(fromDn, toDn, unit) {
    const out = [];
    let a = unit === 'month' ? Dates.monthStart(fromDn) : Dates.mondayOf(fromDn);
    while (a <= toDn) {
      const b = unit === 'month' ? Dates.monthEnd(a) : a + 6;
      out.push({ start: a, end: b });
      a = b + 1;
    }
    return out;
  }

  /**
   * Courbe en S (RG-17 à RG-20). Renvoie {periods, planned[], real[], baselines: {id: []}} en pourcentages.
   * real s'arrête à la période qui contient aujourd'hui.
   */
  function sCurve(project, sched, today, unit = 'week') {
    const work = project.tasks.filter(countsInProgress);
    const total = work.reduce((a, t) => a + t.dur, 0);
    let last = sched.projectEndDn;
    const shownBaselines = (project.baselines || []).filter(b => b.shownOnScurve);
    for (const b of shownBaselines) for (const bt of b.tasks) { const e = Dates.parse(bt.end); if (e != null) last = Math.max(last, e); }
    const ps = periods(Dates.parse(project.projectStart), last, unit);
    // Charge prévue cumulée par jour ouvré (tableau de différences) : O(tâches + jours), pas O(tâches × périodes).
    const lo = Math.min(0, ...work.map(t => sched.tasks.get(t.id).s));
    const hi = Math.max(0, ...work.map(t => sched.tasks.get(t.id).e));
    const diff = new Float64Array(hi - lo + 2);
    for (const t of work) { const r = sched.tasks.get(t.id); diff[r.s - lo] += 1; diff[r.e - lo + 1] -= 1; }
    const cumul = new Float64Array(hi - lo + 1);
    for (let i = 0, running = 0, acc = 0; i <= hi - lo; i++) { running += diff[i]; acc += running; cumul[i] = acc; }
    const plannedUpTo = dn => { const i = Math.min(sched.cal.floor(dn), hi) - lo; return i < 0 ? 0 : cumul[i]; };
    const planned = ps.map(p => (total ? 100 * plannedUpTo(p.end) / total : 0));
    const real = [];
    for (const p of ps) {
      if (p.start > today) break;
      if (!total) { real.push(0); continue; }
      if (p.end < today) {
        real.push(100 * work.reduce((a, t) => { const re = Dates.parse(t.realEnd); return a + (re != null && re <= p.end ? t.dur : 0); }, 0) / total);
      } else {
        real.push(work.reduce((a, t) => a + t.dur * t.pct, 0) / total);
      }
    }
    const baselines = {};
    for (const b of shownBaselines) {
      const bts = b.tasks.filter(bt => bt.dur > 0);
      const btotal = bts.reduce((a, bt) => a + bt.dur, 0);
      baselines[b.id] = ps.map(p => btotal ? 100 * bts.reduce((a, bt) => {
        const s = Dates.parse(bt.start), e = Dates.parse(bt.end);
        return a + Math.min(bt.dur, sched.cal.count(s, Math.min(e, p.end)));
      }, 0) / btotal : 0);
    }
    return { periods: ps, planned, real, baselines };
  }

  /** RG-26 : occupation d'une ressource sur [fromDn, toDn]. */
  function occupation(sched, resId, fromDn, toDn) {
    const cal = sched.cal;
    let loadPd = 0, availPd = 0;
    for (let i = cal.ceil(fromDn), last = cal.floor(toDn); i <= last; i++) {
      loadPd += sched.loadOf(resId, i) / 100;
      availPd += sched.capacityOf(resId, i) / 100;
    }
    let state;
    if (availPd === 0) state = loadPd > 0 ? 'overload' : 'absent';
    else state = loadPd > availPd + 1e-9 ? 'overload' : 'ok';
    return { load: loadPd, available: availPd, ratio: availPd ? loadPd / availPd : null, state };
  }

  /** RG-28 : voyant du rapport d'état ('red' | 'orange' | 'green') et écart avec la baseline. */
  function statusLight(project, sched, today, baseline) {
    let lateCritical = false, lateOther = false;
    for (const t of project.tasks) {
      if (t.type === 'summary' || status(t, sched, today) !== STATUS.LATE) continue;
      if (sched.tasks.get(t.id).critical) lateCritical = true; else lateOther = true;
    }
    let drift = null;
    if (baseline && baseline.tasks.length) {
      const bEnd = Math.max(...baseline.tasks.map(bt => Dates.parse(bt.end)).filter(v => v != null));
      drift = sched.projectEnd - sched.cal.floor(bEnd);
    }
    let light = 'green';
    if (lateCritical || (drift != null && drift > 5)) light = 'red';
    else if (lateOther || (drift != null && drift >= 1)) light = 'orange';
    return { light, drift };
  }

  return { STATUS, status, deviation, globalProgress, counters, periods, sCurve, occupation, statusLight, pctOf };
})();

/* Résolution des conflits de ressource (EF-31, RG-34).
 *
 * Pour chaque conflit, propose des corrections et SIMULE chacune sur une copie du projet avant de
 * l'afficher : nombre de conflits restants et décalage de la fin du projet. Rien n'est appliqué
 * sans un clic de l'utilisateur. Propositions, de la moins à la plus intrusive :
 *   moveForced  déplacer la date imposée d'une tâche au premier jour où ses ressources sont libres ;
 *   reassign    confier la tâche à une autre ressource libre sur toute sa période ;
 *   unforce     lever la date imposée (la tâche est alors placée par le nivellement) ;
 *   sequence    arbitrer : faire passer X avant Y, par un lien fin-début X → Y visible et retirable ;
 *   level       passer le projet en nivellement automatique (si lissage ou désactivé).
 * Les propositions sont classées par conflits restants, puis par décalage de la fin. */

  const MAX_REASSIGN = 3;
  const MAX_PAIRS = 6;
  const SEARCH_DAYS = 520; // environ deux ans ouvrés de recherche pour une date libre

  const copy = p => JSON.parse(JSON.stringify(p));

  function firstFreeStart(sched, task, from) {

    const d = task.dur;
    for (let i = from; i < from + SEARCH_DAYS; i++) {
      let ok = true;
      for (let k = i; k < i + d && ok; k++) {
        for (const a of task.assign) {
          const own = k >= r.s && k <= r.e ? a.units : 0;
          const cap = sched.capacityOf(a.res, k);
          if (cap === 0 || sched.loadOf(a.res, k) - own + a.units > cap) { ok = false; break; }

  function isFree(sched, res, units, s, e) {
    for (let k = s; k <= e; k++) {
      const cap = sched.capacityOf(res, k);
      if (cap === 0 || sched.loadOf(res, k) + units > cap) return false;

    return true;

    const p = copy(project);

      ? sched.cal.count(sched.projectEndDn + 1, after.projectEndDn)

    const seen = new Set();

    for (const c of sched.conflicts.slice(0, max)) {
      const options = [];
      const add = (o, mutate) => {

        const after = simulate(project, sched, mutate);

      for (const id of c.tasks) {

          if (i != null) {
            const date = Dates.toISO(sched.cal.dnOf(i));
            add({ kind: 'moveForced', task: id, date }, p => { p.tasks.find(x => x.id === id).forcedStart = date; });
          }
          add({ kind: 'unforce', task: id }, p => { p.tasks.find(x => x.id === id).forcedStart = ''; });
        }
        const a = t.assign.find(x => x.res === c.res);
        if (!a) continue;
        let n = 0;
        for (const other of project.resources) {
          if (n >= MAX_REASSIGN) break;
          if (other.id === c.res || t.assign.some(x => x.res === other.id) || a.units > other.capacity) continue;
          if (!isFree(sched, other.id, a.units, r.s, r.e)) continue;
          n++;
          add({ kind: 'reassign', task: id, from: c.res, to: other.id }, p => {
            const pt = p.tasks.find(x => x.id === id);
            pt.assign = pt.assign.map(x => (x.res === c.res ? { res: other.id, units: x.units } : x));
          });
        }
      }
      // Arbitrage (RG-34) : « faire passer X avant Y » = lien fin-début X → Y, visible et retirable.
      const tasksIn = c.tasks.map(id => byId.get(id)).filter(x => x && x.type === 'task');
      let pairs = 0;
      for (const x of tasksIn) {
        for (const y of tasksIn) {
          if (pairs >= MAX_PAIRS) break;
          if (x === y || y.forcedStart || y.deps.some(d => d.id === x.id) || y.deps.length >= 50) continue;
          const trial = project.tasks.map(t => (t.id === y.id ? { ...t, deps: [...t.deps, { id: x.id, type: 'FS', lag: 0 }] } : t));
          if (Model.findCycle(trial)) continue;
          pairs++;
          add({ kind: 'sequence', first: x.id, task: y.id }, p => {
            p.tasks.find(t => t.id === y.id).deps.push({ id: x.id, type: 'FS', lag: 0 });
          });
        }
      }
      options.sort((x, y) => x.after.conflicts - y.after.conflicts || x.after.endShift - y.after.endShift);
      result.conflicts.push({ conflict: c, options: options.filter(o => !seen.has(o.key) && seen.add(o.key)) });
    }
    if (sched.conflicts.length && sched.mode !== 'level') {
      const after = simulate(project, sched, p => { p.leveling = 'level'; });
      if (after) result.global.push({ kind: 'level', mutate: p => { p.leveling = 'level'; }, after });
    }
    return result;
  }

  return { suggest, firstFreeStart };
})();

// ── js/core/40-model.js ──
/* Données du projet : limites (3.7), projet initial (3.8), contrôle complet d'un fichier (8.3)
 * et écriture au format 3 (8.2).
 *
 * Sécurité (A03, A08 – SECURITY.md) : un fichier importé est une donnée NON FIABLE. Il n'est
 * jamais copié tel quel : chaque objet est reconstruit champ par champ à partir d'une liste
 * blanche, chaque valeur est contrôlée (type, longueur, bornes, format), et toute erreur refuse
 * le fichier entier sans toucher au projet ouvert (EX-14). Les messages sont des clés de
 * traduction avec paramètres : ils ne contiennent jamais de HTML. */
const Model = (() => {
  const FORMAT = 3;
  const MAX_BYTES = 5 * 1024 * 1024;
  const LIMITS = Object.freeze({
    tasks: 1000, depth: 5, resources: 100, categories: 100, deps: 50, assign: 10, tags: 10, projectTags: 200,
    comments: 50, absences: 100, calendarDays: 366, baselines: 3, versions: 10, dur: 3650, lag: 365,
  });
  const ID_RE = /^[A-Z0-9._-]{1,12}$/;
  const COLOR_RE = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
  const EMOJIS = Object.freeze(['🚁', '🚀', '🏗️', '💡', '🎯', '📱', '🌍', '⚙️', '🔬', '🎨', '🏭', '📦', '🔧', '🛸', '🌿', '🏆', '📊', '🔐', '🚂', '💊', '📁']);
  const PALETTE = Object.freeze(['#4d9fff', '#ff5757', '#36d9a0', '#f0b429', '#b57bff', '#ff9a3c', '#e879f9', '#34d399', '#fb923c', '#38bdf8']);
  const BASELINE_COLORS = Object.freeze(['#f0b429', '#e879f9', '#ff9a3c', '#38bdf8', '#34d399', '#ff5757']);
  const LINK_TYPES = Object.freeze(['FS', 'SS', 'FF', 'SF']);
  const TYPES = Object.freeze(['task', 'milestone', 'summary']);

  /** Erreur de contrôle : clé de message + paramètres (texte brut, jamais interprété). */
  class Invalid extends Error {
    constructor(key, params = {}) { super(key); this.key = key; this.params = params; }
  }
  const fail = (key, params) => { throw new Invalid(key, params); };

  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const lower = s => s.toLocaleLowerCase('fr');

  /** Lecteur de champs d'un objet du fichier : compte les champs inconnus, contrôle chaque valeur. */
  function reader(src, where, allowed, stats) {
    for (const k of Object.keys(src)) if (!allowed.includes(k)) stats.unknown++;
    const err = (field, rule, extra = {}) => fail('imp.field', { ...where, field, rule, ...extra });
    const present = k => has(src, k) && src[k] !== undefined && src[k] !== null;
    return {
      present,
      text(k, { min = 0, max, def = '', trim = false } = {}) {
        if (!present(k)) { if (min > 0 && def === '') err(k, 'rule.text', { min, max }); return def; }
        if (typeof src[k] !== 'string') err(k, 'rule.text', { min, max });
        const v = trim ? src[k].trim() : src[k];
        if (v.length < min || v.length > max) err(k, 'rule.text', { min, max });
        return v;
      },
      int(k, { min, max, def }) {
        if (!present(k)) return def;
        const v = src[k];
        if (!Number.isInteger(v) || v < min || v > max) err(k, 'rule.int', { min, max });
        return v;
      },
      num(k, { def = 0 } = {}) {
        if (!present(k)) return def;
        if (typeof src[k] !== 'number' || !Number.isFinite(src[k]) || src[k] < 0) err(k, 'rule.number');
        return src[k];
      },
      bool(k, def = false) {
        if (!present(k)) return def;
        if (typeof src[k] !== 'boolean') err(k, 'rule.bool');
        return src[k];
      },
      date(k, { required = false, def = '' } = {}) {
        if (!present(k) || src[k] === '') { if (required) err(k, 'rule.date'); return def; }
        if (Dates.parse(src[k]) == null) err(k, 'rule.date');
        return src[k];
      },
      color(k, def) {
        if (!present(k)) return def;
        if (typeof src[k] !== 'string' || !COLOR_RE.test(src[k])) err(k, 'rule.color');
        return src[k];
      },
      oneOf(k, values, def) {
        if (!present(k)) return def;
        if (!values.includes(src[k])) err(k, 'rule.enum', { values: values.join(', ') });
        return src[k];
      },
      list(k, max) {
        if (!present(k)) return [];
        if (!Array.isArray(src[k])) err(k, 'rule.list', { max });
        if (src[k].length > max) err(k, 'rule.list', { max });
        return src[k];
      },
      obj(k) {
        if (!present(k)) return null;
        if (!isObj(src[k])) err(k, 'rule.object');
        return src[k];
      },
      raw: k => src[k],
    };
  }

  function ranges(list, where, field, stats, maxDays) {
    let days = 0;
    return list.map((r, i) => {
      if (!isObj(r)) fail('imp.field', { ...where, field, rule: 'rule.object' });
      const f = reader(r, { ...where, field }, ['start', 'end', 'label'], stats);
      const start = f.date('start', { required: true });
      const end = f.date('end', { def: start }) || start;
      if (Dates.parse(end) < Dates.parse(start)) fail('imp.rangeOrder', { ...where, field, n: i + 1 });
      days += Dates.parse(end) - Dates.parse(start) + 1;
      if (maxDays && days > maxDays) fail('imp.tooMany', { what: field, max: maxDays });
      return { start, end, label: f.text('label', { max: 100 }) };
    });
  }

  function sanitizeCalendar(src, stats) {
    if (src == null) return { workDays: [1, 1, 1, 1, 1, 0, 0], holidays: 'FR', daysOff: [], daysWorked: [] };
    if (!isObj(src)) fail('imp.field', { obj: 'project', field: 'calendar', rule: 'rule.object' });
    const where = { obj: 'calendar' };
    const f = reader(src, where, ['workDays', 'holidays', 'daysOff', 'daysWorked'], stats);
    let workDays = [1, 1, 1, 1, 1, 0, 0];
    if (f.present('workDays')) {
      const w = f.raw('workDays');
      if (!Array.isArray(w) || w.length !== 7 || !w.every(v => v === 0 || v === 1)) fail('imp.field', { ...where, field: 'workDays', rule: 'rule.week' });
      workDays = w.slice();
    }
    if (!workDays.includes(1)) fail('imp.noWorkday');
    const holidays = f.oneOf('holidays', Calendar.HOLIDAY_SETS, 'FR');
    const daysOff = ranges(f.list('daysOff', LIMITS.calendarDays), where, 'daysOff', stats, LIMITS.calendarDays);
    const daysWorked = ranges(f.list('daysWorked', LIMITS.calendarDays), where, 'daysWorked', stats, LIMITS.calendarDays);
    const offSet = new Set();
    for (const r of daysOff) for (let d = Dates.parse(r.start); d <= Dates.parse(r.end); d++) offSet.add(d);
    for (const r of daysWorked) for (let d = Dates.parse(r.start); d <= Dates.parse(r.end); d++) if (offSet.has(d)) fail('imp.calendarClash', { date: Dates.toISO(d) });
    return { workDays, holidays, daysOff, daysWorked };
  }

  /** Recherche d'une boucle de dépendances (RG-09) ; renvoie le chemin ['A','B','A'] ou null. */
  function findCycle(tasks) {
    const deps = new Map(tasks.map(t => [t.id, t.deps.map(d => d.id)]));
    const state = new Map(), stack = [];
    function visit(id) {
      state.set(id, 1); stack.push(id);
      for (const p of deps.get(id) || []) {
        if (state.get(p) === 1) return stack.slice(stack.indexOf(p)).concat(p);
        if (!state.has(p)) { const c = visit(p); if (c) return c; }
      }
      state.set(id, 2); stack.pop();
      return null;
    }
    for (const t of tasks) if (!state.has(t.id)) { const c = visit(t.id); if (c) return c.reverse(); }
    return null;
  }

  /** Ancêtres d'une tâche (du parent à la racine). */
  function ancestors(byId, id) {
    const out = [];
    let cur = byId.get(id);
    while (cur && cur.parent) { out.push(cur.parent); cur = byId.get(cur.parent); if (out.length > LIMITS.depth + 1) break; }
    return out;
  }

  /**
   * Contrôle complet d'un objet projet (section 8.3).
   * @returns {{project, notices:{unknown:number, createdResources:string[], createdCategories:string[]}}}
   * @throws {Invalid}
   */
  function sanitize(raw, { nested = false } = {}) {
    const stats = { unknown: 0 };
    if (!isObj(raw)) fail('imp.unreadable');
    if (has(raw, 'format') && !(Number.isInteger(raw.format) && raw.format >= 1)) fail('imp.field', { obj: 'project', field: 'format', rule: 'rule.int', min: 1, max: FORMAT });
    if (raw.format > FORMAT) fail('imp.newer');
    if (!Array.isArray(raw.tasks)) fail('imp.noTasks');
    const P = reader(raw, { obj: 'project' }, ['format', 'id', 'createdAt', 'name', 'desc', 'emoji', 'projectStart', 'reportNote', 'calendar', 'leveling',
      'tasks', 'resources', 'categories', 'baselines', 'versions'], stats);

    const lim = (list, max, what) => { if (list.length > max) fail('imp.tooMany', { what, max }); return list; };
    const rawTasks = lim(raw.tasks, LIMITS.tasks, 'tasks');
    const rawRes = lim(P.list('resources', Infinity), LIMITS.resources, 'resources');
    const rawCats = lim(P.list('categories', Infinity), LIMITS.categories, 'categories');
    const rawBl = lim(P.list('baselines', Infinity), LIMITS.baselines, 'baselines');
    const rawVer = nested ? [] : lim(P.list('versions', Infinity), LIMITS.versions, 'versions');
    if (nested && P.present('versions')) fail('imp.field', { obj: 'version', field: 'versions', rule: 'rule.absent' });

    const project = {
      id: P.text('id', { max: 64, def: '' }),
      createdAt: P.num('createdAt', { def: 0 }),
      name: P.text('name', { min: 1, max: 60, def: 'Nouveau projet', trim: true }) || 'Nouveau projet',
      desc: P.text('desc', { max: 500 }),
      emoji: P.oneOf('emoji', EMOJIS, '📁'),
      projectStart: P.date('projectStart', { def: Dates.toISO(Dates.todayDn()) }),
      reportNote: P.text('reportNote', { max: 2000 }),
      calendar: sanitizeCalendar(P.raw('calendar'), stats),
      // Lissage par défaut : l'utilisateur arbitre lui-même les surcharges (A.3). Un fichier 2.3
      // (sans champ format) garde le nivellement automatique pour retrouver ses dates d'origine.
      leveling: P.oneOf('leveling', ['level', 'smooth', 'off'], has(raw, 'format') ? 'smooth' : 'level'),
    };
    if (project.id && !/^[A-Za-z0-9._-]+$/.test(project.id)) fail('imp.field', { obj: 'project', field: 'id', rule: 'rule.ident' });

    // Ressources et catégories : identités internes neuves ; les noms doivent être uniques (casse ignorée).
    const resources = [], resByName = new Map();
    rawRes.forEach((r, i) => {
      const where = { obj: 'resource', n: i + 1 };
      if (!isObj(r)) fail('imp.field', { ...where, field: '', rule: 'rule.object' });
      const f = reader(r, where, ['id', 'name', 'role', 'color', 'capacity', 'absences'], stats);
      const name = f.text('name', { min: 1, max: 100, trim: true });
      if (resByName.has(lower(name))) fail('imp.dupResource', { name });
      const res = {
        id: 'R' + (i + 1), name, role: f.text('role', { max: 100 }),
        color: f.color('color', PALETTE[i % PALETTE.length]),
        capacity: f.int('capacity', { min: 1, max: 100, def: 100 }),
        absences: ranges(f.list('absences', LIMITS.absences), where, 'absences', stats),
      };
      if (f.present('id') && (typeof r.id !== 'string' || r.id.length > 64)) fail('imp.field', { ...where, field: 'id', rule: 'rule.ident' });
      resources.push(res); resByName.set(lower(name), res);
    });
    const categories = [], catByName = new Map();
    rawCats.forEach((c, i) => {
      const where = { obj: 'category', n: i + 1 };
      if (!isObj(c)) fail('imp.field', { ...where, field: '', rule: 'rule.object' });
      const f = reader(c, where, ['id', 'name', 'color'], stats);
      const name = f.text('name', { min: 1, max: 100, trim: true });
      if (catByName.has(lower(name))) fail('imp.dupCategory', { name });
      if (f.present('id') && (typeof c.id !== 'string' || c.id.length > 64)) fail('imp.field', { ...where, field: 'id', rule: 'rule.ident' });
      const cat = { id: 'C' + (i + 1), name, color: f.color('color', PALETTE[i % PALETTE.length]) };
      categories.push(cat); catByName.set(lower(name), cat);
    });
    const createdResources = [], createdCategories = [];
    const resolveRes = name => {
      let r = resByName.get(lower(name));
      if (!r) {
        if (resources.length >= LIMITS.resources) fail('imp.tooMany', { what: 'resources', max: LIMITS.resources });
        r = { id: 'R' + (resources.length + 1), name, role: '', color: PALETTE[resources.length % PALETTE.length], capacity: 100, absences: [] };
        resources.push(r); resByName.set(lower(name), r); createdResources.push(name);
      }
      return r;
    };
    const resolveCat = name => {
      let c = catByName.get(lower(name));
      if (!c) {
        if (categories.length >= LIMITS.categories) fail('imp.tooMany', { what: 'categories', max: LIMITS.categories });
        c = { id: 'C' + (categories.length + 1), name, color: PALETTE[categories.length % PALETTE.length] };
        categories.push(c); catByName.set(lower(name), c); createdCategories.push(name);
      }
      return c;
    };

    // Tâches.
    const ids = new Set(), tagSet = new Set();
    const tasks = rawTasks.map((t, i) => {
      const where = { obj: 'task', n: i + 1 };
      if (!isObj(t)) fail('imp.field', { ...where, field: '', rule: 'rule.object' });
      const f = reader(t, where, ['id', 'name', 'type', 'parent', 'dur', 'deps', 'res', 'assign', 'cat', 'pct', 'forcedStart', 'notBefore',
        'deadline', 'realStart', 'realEnd', 'tags', 'notes', 'comments', 'collapsed'], stats);
      if (typeof t.id !== 'string' || !ID_RE.test(t.id)) fail('imp.badId', { n: i + 1 });
      if (ids.has(t.id)) fail('imp.dupId', { id: t.id });
      ids.add(t.id);
      const type = f.oneOf('type', TYPES, 'task');
      const isTask = type === 'task';
      let dur = 0;
      if (isTask) dur = f.int('dur', { min: 1, max: LIMITS.dur, def: 5 });
      else if (type === 'milestone') f.int('dur', { min: 0, max: 0, def: 0 });
      else f.int('dur', { min: 0, max: LIMITS.dur, def: 0 });
      let pct = f.int('pct', { min: 0, max: 100, def: 0 });
      if (type === 'milestone' && pct !== 0 && pct !== 100) fail('imp.field', { ...where, field: 'pct', rule: 'rule.milestonePct' });
      if (type === 'summary') pct = 0;

      const deps = f.list('deps', LIMITS.deps).map(d => {
        if (typeof d === 'string') return { id: d, type: 'FS', lag: 0 };
        if (!isObj(d)) fail('imp.field', { ...where, field: 'deps', rule: 'rule.link' });
        const g = reader(d, { ...where, field: 'deps' }, ['id', 'type', 'lag'], stats);
        if (typeof d.id !== 'string') fail('imp.field', { ...where, field: 'deps', rule: 'rule.link' });
        return { id: d.id, type: g.oneOf('type', LINK_TYPES, 'FS'), lag: g.int('lag', { min: -LIMITS.lag, max: LIMITS.lag, def: 0 }) };
      });

      let assign;
      if (f.present('assign')) {
        assign = f.list('assign', LIMITS.assign).map(a => {
          if (!isObj(a)) fail('imp.field', { ...where, field: 'assign', rule: 'rule.object' });
          const g = reader(a, { ...where, field: 'assign' }, ['res', 'units'], stats);
          const name = g.text('res', { min: 1, max: 100, trim: true });
          return { name, units: g.int('units', { min: 1, max: 100, def: 100 }) };
        });
      } else {
        const name = f.text('res', { max: 100, trim: true });
        assign = name ? [{ name, units: 100 }] : [];
      }
      if (!isTask && assign.length) fail(type === 'summary' ? 'imp.summaryField' : 'imp.milestoneRes', { n: i + 1, id: t.id, field: 'assign' });
      const seenRes = new Set();
      assign = assign.map(a => {
        const r = resolveRes(a.name);
        if (seenRes.has(r.id)) fail('imp.dupAssign', { n: i + 1, name: r.name });
        seenRes.add(r.id);
        if (a.units > r.capacity) fail('imp.overCapacity', { n: i + 1, units: a.units, capacity: r.capacity, name: r.name });
        return { res: r.id, units: a.units };
      });

      const catName = f.text('cat', { max: 100, trim: true });
      const cat = catName ? resolveCat(catName).id : '';

      const task = {
        id: t.id, name: f.text('name', { min: 1, max: 200, trim: true }), type, parent: f.text('parent', { max: 12 }), dur, deps, assign, cat, pct,
        forcedStart: f.date('forcedStart'), notBefore: f.date('notBefore'), deadline: f.date('deadline'),
        realStart: f.date('realStart'), realEnd: f.date('realEnd'),
        tags: [], notes: f.text('notes', { max: 2000 }), comments: [], collapsed: false,
      };
      if (task.realStart && task.realEnd && task.realEnd < task.realStart) fail('imp.realOrder', { n: i + 1 });
      if (task.realEnd && task.pct < 100 && type !== 'summary') fail('imp.realEndPct', { n: i + 1 });
      if (type === 'summary' && (deps.length || task.forcedStart || task.notBefore || task.deadline)) fail('imp.summaryField', { n: i + 1, id: t.id });
      const tagsSeen = new Set();
      task.tags = f.list('tags', LIMITS.tags).map(tag => {
        if (typeof tag !== 'string' || !tag.trim() || tag.trim().length > 30) fail('imp.field', { ...where, field: 'tags', rule: 'rule.text', min: 1, max: 30 });
        const v = tag.trim();
        if (tagsSeen.has(lower(v))) fail('imp.field', { ...where, field: 'tags', rule: 'rule.unique' });
        tagsSeen.add(lower(v)); tagSet.add(lower(v));
        return v;
      });
      task.comments = f.list('comments', LIMITS.comments).map(c => {
        if (!isObj(c)) fail('imp.field', { ...where, field: 'comments', rule: 'rule.object' });
        const g = reader(c, { ...where, field: 'comments' }, ['ts', 'text'], stats);
        return { ts: g.num('ts'), text: g.text('text', { min: 1, max: 500 }) };
      });
      task.collapsed = type === 'summary' ? f.bool('collapsed') : (f.bool('collapsed'), false);
      return task;
    });
    if (tagSet.size > LIMITS.projectTags) fail('imp.tooMany', { what: 'tags', max: LIMITS.projectTags });

    // Hiérarchie (RG-23).
    const byId = new Map(tasks.map(t => [t.id, t]));
    tasks.forEach((t, i) => {
      if (!t.parent) return;
      const p = byId.get(t.parent);
      if (!p || p.type !== 'summary' || p.id === t.id) fail('imp.badParent', { n: i + 1, parent: t.parent });
      const up = ancestors(byId, t.id);
      if (up.includes(t.id)) fail('imp.parentCycle', { id: t.id });
      if (up.length > LIMITS.depth) fail('imp.tooDeep', { id: t.id, max: LIMITS.depth });
    });
    // Liens.
    tasks.forEach((t, i) => {
      const seen = new Set();
      const up = new Set(ancestors(byId, t.id));
      for (const d of t.deps) {
        const p = byId.get(d.id);
        if (!p) fail('imp.missingPred', { n: i + 1, pred: d.id });
        if (d.id === t.id) fail('imp.selfLink', { n: i + 1 });
        if (seen.has(d.id)) fail('imp.dupLink', { n: i + 1, pred: d.id });
        if (p.type === 'summary') fail('imp.linkSummary', { n: i + 1, pred: d.id });
        if (up.has(d.id) || ancestors(byId, d.id).includes(t.id)) fail('imp.linkHierarchy', { n: i + 1, pred: d.id });
        seen.add(d.id);
      }
    });
    const cycle = findCycle(tasks);
    if (cycle) fail('imp.cycle', { path: cycle.join(' → ') });

    // Baselines : copies figées, contrôlées pour leur forme.
    const baselines = rawBl.map((b, i) => {
      const where = { obj: 'baseline', n: i + 1 };
      if (!isObj(b)) fail('imp.field', { ...where, field: '', rule: 'rule.object' });
      const f = reader(b, where, ['id', 'name', 'color', 'createdAt', 'projectStart', 'shownOnGantt', 'shownOnScurve', 'tasks'], stats);
      const bl = {
        id: 'B' + (i + 1), name: f.text('name', { min: 1, max: 100, trim: true }), color: f.color('color', BASELINE_COLORS[i % BASELINE_COLORS.length]),
        createdAt: f.num('createdAt'), projectStart: f.date('projectStart', { def: project.projectStart }),
        shownOnGantt: f.bool('shownOnGantt', true), shownOnScurve: f.bool('shownOnScurve', true), tasks: [],
      };
      if (f.present('id') && (typeof b.id !== 'string' || b.id.length > 64)) fail('imp.field', { ...where, field: 'id', rule: 'rule.ident' });
      bl.tasks = f.list('tasks', LIMITS.tasks).map((bt, j) => {
        const w = { obj: 'baselineTask', n: j + 1, baseline: i + 1 };
        if (!isObj(bt)) fail('imp.field', { ...w, field: '', rule: 'rule.object' });
        const g = reader(bt, w, ['id', 'name', 'dur', 'deps', 'cat', 'start', 'end'], stats);
        if (typeof bt.id !== 'string' || !ID_RE.test(bt.id)) fail('imp.badId', { n: j + 1 });
        const start = g.date('start', { required: true }), end = g.date('end', { required: true });
        if (end < start) fail('imp.rangeOrder', { ...w, field: 'end' });
        const deps = g.list('deps', LIMITS.deps).map(d => {
          const did = typeof d === 'string' ? d : (isObj(d) ? d.id : null);
          if (typeof did !== 'string' || !ID_RE.test(did)) fail('imp.field', { ...w, field: 'deps', rule: 'rule.link' });
          return did;
        });
        return { id: bt.id, name: g.text('name', { max: 200 }), dur: g.int('dur', { min: 0, max: LIMITS.dur, def: 0 }), deps, cat: g.text('cat', { max: 100 }), start, end };
      });
      return bl;
    });

    // Versions : chaque état est contrôlé comme un projet complet, sans versions imbriquées.
    const versions = rawVer.map((v, i) => {
      const where = { obj: 'version', n: i + 1 };
      if (!isObj(v)) fail('imp.field', { ...where, field: '', rule: 'rule.object' });
      const f = reader(v, where, ['id', 'label', 'ts', 'state'], stats);
      const state = f.obj('state');
      if (!state) fail('imp.field', { ...where, field: 'state', rule: 'rule.object' });
      let inner;
      try { inner = sanitize(state, { nested: true }); } catch (e) { if (e instanceof Invalid) fail('imp.version', { n: i + 1, inner: e }); throw e; }
      stats.unknown += inner.notices.unknown;
      return { id: 'V' + (i + 1), label: f.text('label', { min: 1, max: 100, trim: true }), ts: f.num('ts'), state: serialize(inner.project, { withVersions: false }) };
    });

    Object.assign(project, { tasks, resources, categories, baselines, versions });
    // Dernier contrôle : le planning doit pouvoir se calculer (dates dans les bornes 1970-2199).
    try { Schedule.compute(project); } catch (e) { if (e instanceof RangeError) fail('imp.horizon'); throw e; }
    return { project, notices: { unknown: stats.unknown, createdResources, createdCategories } };
  }

  /**
   * Lecture d'un texte de fichier : taille, JSON, enveloppe chiffrée, puis sanitize.
   * @returns {{encrypted:true, envelope}|{project, notices}}
   */
  function parseFile(text) {
    if (typeof text !== 'string') fail('imp.unreadable');
    if (new TextEncoder().encode(text).length > MAX_BYTES) fail('imp.tooBig');
    let raw;
    try { raw = JSON.parse(text); } catch { fail('imp.unreadable'); }
    if (isObj(raw) && raw.encrypted === true) return { encrypted: true, envelope: raw };
    return sanitize(raw);
  }

  const resName = (project, id) => (project.resources.find(r => r.id === id) || { name: '' }).name;

  /** Écriture au format 3 (8.2). anonymize : « Ressource 1 », sans rôle (EF-51). */
  function serialize(project, { anonymize = false, withVersions = true } = {}) {
    const rIndex = new Map(project.resources.map((r, i) => [r.id, i]));
    const nameOf = id => (anonymize ? `Ressource ${rIndex.get(id) + 1}` : resName(project, id));
    const catName = id => (project.categories.find(c => c.id === id) || { name: '' }).name;
    const file = {
      format: FORMAT, id: project.id, createdAt: project.createdAt,
      name: project.name, desc: project.desc, emoji: project.emoji, projectStart: project.projectStart, reportNote: project.reportNote,
      calendar: JSON.parse(JSON.stringify(project.calendar)),
      leveling: project.leveling || 'level',
      tasks: project.tasks.map(t => ({
        id: t.id, name: t.name, type: t.type, parent: t.parent, dur: t.dur,
        deps: t.deps.map(d => (d.type === 'FS' && !d.lag ? d.id : { id: d.id, type: d.type, lag: d.lag })),
        res: t.assign.length ? nameOf(t.assign[0].res) : '',
        assign: t.assign.map(a => ({ res: nameOf(a.res), units: a.units })),
        cat: catName(t.cat), pct: t.pct,
        forcedStart: t.forcedStart, notBefore: t.notBefore, deadline: t.deadline, realStart: t.realStart, realEnd: t.realEnd,
        tags: t.tags.slice(), notes: t.notes, comments: t.comments.map(c => ({ ts: c.ts, text: c.text })), collapsed: t.collapsed,
      })),
      resources: project.resources.map((r, i) => ({
        id: r.id, name: anonymize ? `Ressource ${i + 1}` : r.name, role: anonymize ? '' : r.role, color: r.color,
        capacity: r.capacity, absences: anonymize ? [] : r.absences.map(a => ({ ...a })),
      })),
      categories: project.categories.map(c => ({ id: c.id, name: c.name, color: c.color })),
      baselines: project.baselines.map(b => ({ ...b, tasks: b.tasks.map(bt => ({ ...bt, deps: bt.deps.slice() })) })),
    };
    // Les versions contiennent des noms : elles ne sont pas exportées dans un fichier anonymisé.
    if (withVersions) file.versions = anonymize ? [] : (project.versions || []).map(v => ({ id: v.id, label: v.label, ts: v.ts, state: v.state }));
    return file;
  }

  /** Prochain identifiant libre dans la suite A, B, … Z, AA, AB… (3.2). */
  function nextTaskId(existing) {
    const used = new Set(existing);
    for (let n = 1; ; n++) {
      let s = '', k = n;
      while (k > 0) { k--; s = String.fromCharCode(65 + (k % 26)) + s; k = Math.floor(k / 26); }
      if (!used.has(s)) return s;
    }
  }

  /** Projet initial (3.8). */
  function newProject(todayIso, now = 0, names = {}) {
    const n = { project: 'Nouveau projet', task: 'Renommer cette tâche…', resource: 'Ressource', category: 'Général', ...names };
    return {
      id: 'P' + now.toString(36), createdAt: now, name: n.project, desc: '', emoji: '📁', projectStart: todayIso, reportNote: '',
      calendar: { workDays: [1, 1, 1, 1, 1, 0, 0], holidays: 'FR', daysOff: [], daysWorked: [] }, leveling: 'smooth',
      tasks: [{ id: 'A', name: n.task, type: 'task', parent: '', dur: 10, deps: [], assign: [], cat: 'C1', pct: 0,
        forcedStart: '', notBefore: '', deadline: '', realStart: '', realEnd: '', tags: [], notes: '', comments: [], collapsed: false }],
      resources: [{ id: 'R1', name: n.resource, role: '', color: PALETTE[0], capacity: 100, absences: [] }],
      categories: [{ id: 'C1', name: n.category, color: PALETTE[0] }],
      baselines: [], versions: [],
    };
  }

  return { FORMAT, MAX_BYTES, LIMITS, ID_RE, COLOR_RE, EMOJIS, PALETTE, BASELINE_COLORS, LINK_TYPES, Invalid, sanitize, parseFile, serialize, nextTaskId, newProject, findCycle };
})();

  function getLang() { return lang; }

    return str.replace(/\{(\w+)\}/g, (m, k) => (params && params[k] !== undefined ? String(params[k]) : m));

    if (typeof v === 'object') {
      const n = Number(params.count) || 0;
      const one = lang === 'fr' ? Math.abs(n) < 2 : Math.abs(n) === 1;
      v = one ? v.one : v.other;

  function error(e) {

    if (p.obj) p.obj = t('obj.' + p.obj);
    if (p.n === undefined) p.n = '';
    if (p.rule) p.rule = t(p.rule, p);
    if (p.inner) p.inner = error(p.inner);

    if (dn == null) return '';

  function shortDate(dn) {
    const { m, d } = Dates.ymd(dn);

  }
  function monthLabel(dn) { const { y, m } = Dates.ymd(dn); return `${MONTHS[lang][m - 1]} ${y}`; }
  function number(n, digits = 0) {
    const s = n.toFixed(digits);
    return lang === 'fr' ? s.replace('.', ',') : s;
  }

  return { t, error, setLang, getLang, date, shortDate, monthLabel, number, CATALOGS };
})();

// ── js/ui/00-dom.js ──
/* Construction du DOM SANS innerHTML (A03 – injection) : tout texte passe par textContent,
 * tout attribut par setAttribute après contrôle du nom, tout style par le CSSOM.
 * Un texte venant d'un fichier ne peut donc jamais devenir du code (EX-13). */
const $ = id => document.getElementById(id);

const FORBIDDEN_ATTR = /^(on|style$|srcdoc$|formaction$)/i;
const URL_ATTR = /^(href|src|action|xlink:href)$/i;

/**
 * h('button', {class:'x', data:{click:'save'}, aria:{label:'…'}, css:{left:'4px'}, text:'OK'}, enfants…)
 * Les enfants sont des nœuds ou des chaînes (insérées comme texte).
 */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'text') el.textContent = String(v);
    else if (k === 'class') el.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : v;
    else if (k === 'data') for (const [dk, dv] of Object.entries(v)) { if (dv !== undefined && dv !== null) el.dataset[dk] = String(dv); }
    else if (k === 'aria') for (const [ak, av] of Object.entries(v)) { if (av !== undefined && av !== null) el.setAttribute('aria-' + ak, String(av)); }
    else if (k === 'css') for (const [ck, cv] of Object.entries(v)) el.style.setProperty(ck, String(cv));
    else if (k === 'value') el.value = String(v);
    else if (k === 'checked' || k === 'selected' || k === 'disabled' || k === 'hidden' || k === 'required' || k === 'multiple') el[k] = !!v;
    else {
      if (FORBIDDEN_ATTR.test(k)) throw new Error('attribut interdit : ' + k);
      if (URL_ATTR.test(k) && !/^(#|blob:|data:image\/png)/.test(String(v))) throw new Error('adresse interdite');
      el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

/** Couleur sûre pour le CSSOM : uniquement #rgb ou #rrggbb (EX-13), sinon la teinte neutre. */
function safeColor(c, fallback = '#8a94a6') { return typeof c === 'string' && Model.COLOR_RE.test(c) ? c : fallback; }

/** Texte lisible (noir ou blanc) sur une couleur de fond (contraste EX-03). */
function inkOn(hex) {
  let c = safeColor(hex).slice(1);
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const lum = [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255).map(v => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  const L = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2];
  return L > 0.179 ? '#000000' : '#ffffff';
}

let liveTimer = 0;
/** Message annoncé aux lecteurs d'écran (EX-02) et affiché brièvement. */
function announce(msg) {
  const live = $('live');
  live.textContent = '';
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { live.textContent = msg; }, 30);
}

// ── js/ui/10-storage.js ──
/* Seul module autorisé à toucher au stockage du navigateur (contrôlé par tools/build.py).
 *
 * Vie privée (EX-10, EX-22) : ne sont conservés sur l'appareil que les RÉGLAGES (langue, thème),
 * jamais un projet ni un nom de ressource. Pas de cookie. Chaque lecture est validée (le stockage
 * est une donnée non fiable : une autre page locale peut l'avoir modifié) et chaque accès est
 * protégé, car le stockage peut être indisponible (navigation privée, fichier local). */
const Settings = (() => {
  const PREFIX = 'ganttpro.settings.';
  const ALLOWED = { theme: ['system', 'light', 'dark'], lang: ['fr', 'en'] };

  function get(key) {
    try {
      const v = window.localStorage.getItem(PREFIX + key);
      return ALLOWED[key] && ALLOWED[key].includes(v) ? v : null;
    } catch { return null; }
  }
  function set(key, value) {
    if (!ALLOWED[key] || !ALLOWED[key].includes(value)) return false;
    try { window.localStorage.setItem(PREFIX + key, value); return true; } catch { return false; }
  }
  /** Efface tout ce que GanttPro a écrit sur l'appareil (EF-104). */
  function clearAll() {
    try {
      for (let i = window.localStorage.length - 1; i >= 0; i--) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith('ganttpro.')) window.localStorage.removeItem(k);
      }
      return true;
    } catch { return false; }
  }
  return { get, set, clearAll };
})();

// ── js/ui/20-actions.js ──
/* Aucune action n'est attachée par un attribut onclick= (interdit, et bloqué par la CSP).
 * Les éléments portent data-click / data-change / data-input / data-submit (+ data-arg) ;
 * un seul écouteur par type d'événement les relie à la table ACTIONS ci-dessous.
 * data-arg est toujours passé comme chaîne brute (les identifiants de tâche sont des chaînes). */
const ACTIONS = Object.create(null);

function action(name, fn) { ACTIONS[name] = fn; }

function dispatch(kind, ev) {
  const el = ev.target.closest(`[data-${kind}]`);
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[el.dataset[kind]];
  if (!fn) return;
  if (kind === 'submit') ev.preventDefault();
  fn(el.dataset.arg, el, ev);
}

function initActions() {
  document.addEventListener('click', ev => dispatch('click', ev));
  document.addEventListener('change', ev => dispatch('change', ev));
  document.addEventListener('input', ev => dispatch('input', ev));
  document.addEventListener('submit', ev => dispatch('submit', ev));
  // Élément non natif marqué role="button" : Entrée et Espace l'activent (EX-01).
  document.addEventListener('keydown', ev => {
    const el = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.click) {
      ev.preventDefault();
      dispatch('click', ev);
    }
  });
}

/* Fenêtres de l'application (4.3) : jamais alert/confirm/prompt du navigateur.
 * Élément <dialog> natif ouvert en modal : l'arrière-plan est inerte, Tab reste dans la fenêtre,
 * Échap ferme ; le focus revient ensuite à l'élément qui l'avait ouverte. Chaque fenêtre est
 * annoncée comme un dialogue titré (EX-02). Plusieurs fenêtres peuvent s'empiler. */
const Dialog = (() => {
  let seq = 0;

  /**
   * @param {object} o
   * @param {string} o.title
   * @param {Node[]} o.body
   * @param {{label:string, value:string, kind?:string, focus?:boolean}[]} o.actions
   * @param {(value:string, dlg:HTMLDialogElement) => boolean|void} [o.onAction] renvoyer false garde la fenêtre ouverte
   * @param {string} [o.size] 'wide'
   * @returns {Promise<string>} valeur du bouton choisi, ou 'cancel'
   */
  function open({ title, body = [], actions = [], onAction, size }) {
    const opener = document.activeElement;
    const id = 'dlg-' + (++seq);
    return new Promise(resolve => {
      const buttons = actions.map(a => h('button', {
        type: a.value === 'cancel' ? 'button' : 'submit', value: a.value, class: a.kind || '',
        data: { dlg: a.value }, autofocus: a.focus ? true : undefined,
      }, a.label));
      const form = h('form', { method: 'dialog', novalidate: true },
        h('h2', { id: id + '-title', text: title }),
        h('div', { class: 'dialog-body' }, body),
        h('div', { class: 'actions' }, buttons));
      const dlg = h('dialog', { class: ['dialog', size], aria: { labelledby: id + '-title' } }, form);
      let done = false;
      const finish = value => {
        if (done) return;
        done = true;
        if (dlg.open) dlg.close();
        dlg.remove();
        if (opener && opener.isConnected && typeof opener.focus === 'function') opener.focus();
        resolve(value);
      };
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        const value = ev.submitter ? ev.submitter.value : (actions.find(a => a.kind === 'primary') || {}).value;
        if (onAction && onAction(value, dlg) === false) return;
        finish(value);
      });
      for (const b of buttons) if (b.value === 'cancel') b.addEventListener('click', () => finish('cancel'));
      dlg.addEventListener('cancel', ev => { ev.preventDefault(); finish('cancel'); });
      document.body.append(dlg);
      dlg.showModal();
      const first = dlg.querySelector('[autofocus]') || dlg.querySelector('input, select, textarea, button');
      if (first) first.focus();
    });
  }

  /** Message simple. */
  function message(title, text) {
    return open({ title, body: [h('p', { text })], actions: [{ label: I18n.t('dlg.ok'), value: 'ok', kind: 'primary', focus: true }] });
  }

  /** Confirmation : « Annuler » est l'action par défaut (4.3). Renvoie true si confirmé. */
  async function confirm(title, lines, confirmLabel, danger = true) {
    const v = await open({
      title, body: lines.filter(Boolean).map(text => h('p', { text })),
      actions: [{ label: I18n.t('dlg.cancel'), value: 'cancel', focus: true }, { label: confirmLabel, value: 'ok', kind: danger ? 'danger' : 'primary' }],
    });
    return v === 'ok';
  }

  return { open, message, confirm };
})();
