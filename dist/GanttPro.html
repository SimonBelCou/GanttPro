const Xlsx = (() => {
  const esc = Xml.escape;
  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const colIndex = ref => { let n = 0; for (const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  const sheetName = (n, i) => (String(n).replace(/[[\]:*?/\\]/g, ' ').slice(0, 31).trim() || `Feuille${i + 1}`);

  function sheetXml(rows, widths) {
    const n = Math.max(1, ...rows.map(r => r.length));
    const cols = widths && widths.length ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const data = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : '';
      if (v === null || v === undefined || v === '') return '';
      if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${esc(Csv.neutralize(v))}</t></is></c>`;
    }).join('')}</row>`).join('');
    const last = colName(n - 1) + Math.max(1, rows.length);
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      cols + `<sheetData>${data}</sheetData>` + (rows.length > 1 ? `<autoFilter ref="A1:${last}"/>` : '') + '</worksheet>';
  }

  /** @param {{name:string, rows:(string|number|null)[][]}[]} sheets → octets .xlsx */
  function build(sheets) {
    const names = sheets.map((s, i) => sheetName(s.name, i));
    const widthsOf = rows => {
      const n = Math.max(0, ...rows.map(r => r.length));
      return Array.from({ length: n }, (_, c) => Math.min(60, Math.max(8, ...rows.slice(0, 500).map(r => String(r[c] ?? '').length + 2))));
    };
    const files = [
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        names.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        names.map((n, i) => `<sheet name="${esc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets>' +
        (sheets.some(s => s.rows.length > 1) ? '<definedNames>' + names.map((n, i) => sheets[i].rows.length > 1
          ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${esc(n.replace(/'/g, "''"))}'!$A$1:$${colName(Math.max(0, ...sheets[i].rows.map(r => r.length)) - 1)}$${sheets[i].rows.length}</definedName>` : '').join('') + '</definedNames>' : '') + '</workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        names.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
        `<Relationship Id="rId${names.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
        '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows, widthsOf(s.rows)) })),
    ];
    return Zip.write(files);
  }

  /** Classeur → [{name, rows}] (valeurs texte ou nombre). */
  async function read(bytes) {
    const files = await Zip.read(bytes);
    const text = name => { const b = files.get(name); return b ? new TextDecoder().decode(b) : null; };
    const wbText = text('xl/workbook.xml');
    if (!wbText) throw new Error('xlsx');
    const wb = Xml.parse(wbText);
    const rels = new Map();
    const relText = text('xl/_rels/workbook.xml.rels');
    if (relText) for (const r of Xml.children(Xml.child(Xml.parse(relText), 'Relationships'), 'Relationship')) rels.set(r.attrs.Id, r.attrs.Target);
    const shared = [];
    const ss = text('xl/sharedStrings.xml');
    if (ss) for (const si of Xml.children(Xml.child(Xml.parse(ss), 'sst'), 'si')) shared.push(Xml.deepText({ ...si, children: si.children.filter(c => c.name !== 'rPh') }));
    const sheets = [];
    for (const sh of Xml.children(Xml.child(Xml.child(wb, 'workbook'), 'sheets'), 'sheet')) {
      let target = rels.get(sh.attrs.id) || '';
      target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
      const xml = text(target);
      if (!xml) continue;
      const data = Xml.child(Xml.child(Xml.parse(xml), 'worksheet'), 'sheetData');
      const rows = [];
      for (const row of Xml.children(data, 'row')) {
        const ri = Number(row.attrs.r || rows.length + 1) - 1;
        if (ri > 5000) throw new Error('xlsx.tooMany');
        const cells = [];
        let ci = 0;
        for (const c of Xml.children(row, 'c')) {
          if (c.attrs.r) ci = colIndex(c.attrs.r);
          const tp = c.attrs.t, v = Xml.textOf(c, 'v');
          let val;
          if (tp === 's') val = shared[Number(v)] ?? '';
          else if (tp === 'inlineStr') { const is = Xml.child(c, 'is'); val = is ? Xml.deepText(is) : ''; }
          else if (tp === 'str' || tp === 'e') val = v;
          else if (tp === 'b') val = v === '1' ? 'TRUE' : 'FALSE';
          else val = v === '' ? '' : Number(v);
          cells[ci++] = val;
        }
        rows[ri] = Array.from(cells, x => (x === undefined ? '' : x));
      }
      sheets.push({ name: sh.attrs.name || `Feuille${sheets.length + 1}`, rows: Array.from(rows, r => r || []) });
    }
    return sheets;
  }

  return { build, read, colName };
})();

// ── js/core/64-exchange.js ──
/* Échanges de fichiers (EF-93 à EF-96, 8.6) : tableur (CSV, Excel), MS Project (XML), import de
 * tâches depuis un tableau. Tout ce qui entre repasse par Model.sanitize (section 8.3). */
const Exchange = (() => {
  const t = (k, p) => I18n.t(k, p);
  const LINK_FR = { FS: 'FD', SS: 'DD', FF: 'FF', SF: 'DF' };
  const LINK_IN = { FD: 'FS', DD: 'SS', FF: 'FF', DF: 'SF', FS: 'FS', SS: 'SS', SF: 'SF' };

  /** Numérotation hiérarchique 1, 1.1, 1.2, 2… selon l'ordre de la liste. */
  function outline(project) {
    const num = new Map(), counters = new Map();
    for (const x of project.tasks) {
      const base = x.parent ? num.get(x.parent) : '';
      const n = (counters.get(x.parent || '') || 0) + 1;
      counters.set(x.parent || '', n);
      num.set(x.id, base ? `${base}.${n}` : String(n));
    }
    return num;
  }

  function depsCell(task) {
    const codes = I18n.getLang() === 'fr' ? LINK_FR : { FS: 'FS', SS: 'SS', FF: 'FF', SF: 'SF' };
    return task.deps.map(d => d.id + (d.type !== 'FS' || d.lag ? ` ${codes[d.type]}${d.lag ? (d.lag > 0 ? '+' : '') + d.lag : ''}` : '')).join('; ');
  }

  /** Lignes du tableau des tâches (EF-93) : en-tête puis une ligne par tâche. */
  function taskRows(project, sched, today, { anonymize = false } = {}) {
    const rIndex = new Map(project.resources.map((r, i) => [r.id, i]));
    const resName = id => (anonymize ? `${t('init.resource')} ${rIndex.get(id) + 1}` : (project.resources.find(r => r.id === id) || { name: '' }).name);
    const cat = id => (project.categories.find(c => c.id === id) || { name: '' }).name;
    const num = outline(project);
    const head = ['xp.outline', 'xp.id', 'xp.name', 'xp.type', 'xp.parent', 'xp.dur', 'xp.start', 'xp.end', 'xp.deps', 'xp.res', 'xp.cat', 'xp.pct',
      'xp.status', 'xp.critical', 'xp.slack', 'xp.realStart', 'xp.realEnd', 'xp.forced', 'xp.notBefore', 'xp.deadline', 'xp.tags', 'xp.notes'].map(k => t(k));
    const rows = [head];
    for (const x of project.tasks) {
      const r = sched.tasks.get(x.id);
      const st = r && !r.empty ? Metrics.status(x, sched, today) : null;
      rows.push([
        num.get(x.id), x.id, x.name, t('type.' + x.type), x.parent, x.type === 'summary' ? (r && !r.empty ? r.d : 0) : (x.type === 'milestone' ? 0 : x.dur),
        r && !r.empty ? Dates.toISO(r.startDn) : '', r && !r.empty ? Dates.toISO(r.endDn) : '', depsCell(x),
        x.assign.map(a => resName(a.res) + (a.units !== 100 ? ` ${a.units} %` : '')).join('; '), cat(x.cat), Metrics.pctOf(x, sched),
        st ? t('status.' + st) : '', r && r.critical && x.type !== 'summary' ? t('xp.yes') : '', x.type !== 'summary' && r ? r.slack : '',
        x.realStart, x.realEnd, x.forcedStart, x.notBefore, x.deadline, x.tags.join('; '), x.notes,
      ]);
    }
    return rows;
  }

  const csv = (project, sched, today, opts) => Csv.write(taskRows(project, sched, today, opts));

  /** Classeur de cinq feuilles (EF-94). */
  function xlsx(project, sched, today, { anonymize = false } = {}) {
    const rName = (r, i) => (anonymize ? `${t('init.resource')} ${i + 1}` : r.name);
    const loadOf = r => project.tasks.reduce((a, x) => a + x.assign.filter(z => z.res === r.id).reduce((b, z) => b + x.dur * z.units / 100, 0), 0);
    const cal = project.calendar;
    return Xlsx.build([
      { name: t('xp.sheet.tasks'), rows: taskRows(project, sched, today, { anonymize }) },
      { name: t('xp.sheet.resources'), rows: [[t('res.name'), t('res.role'), t('res.capacity'), t('xp.loadPd')],
        ...project.resources.map((r, i) => [rName(r, i), anonymize ? '' : r.role, r.capacity, Math.round(loadOf(r) * 10) / 10])] },
      { name: t('xp.sheet.absences'), rows: [[t('res.name'), t('cal.from'), t('xp.to'), t('cal.label')],
        ...(anonymize ? [] : project.resources.flatMap((r, i) => r.absences.map(a => [rName(r, i), a.start, a.end, a.label])))] },
      { name: t('xp.sheet.calendar'), rows: [[t('xp.kind'), t('cal.from'), t('xp.to'), t('cal.label')],
        [t('cal.holidays'), '', '', t('cal.set.' + cal.holidays)],
        [t('cal.week'), '', '', cal.workDays.map((v, i) => (v ? I18n.dayName(i) : '')).filter(Boolean).join(' ')],
        ...cal.daysOff.map(d => [t('cal.daysOff'), d.start, d.end, d.label]), ...cal.daysWorked.map(d => [t('cal.daysWorked'), d.start, d.end, d.label])] },
      { name: t('xp.sheet.baselines'), rows: [[t('xp.id'), t('xp.name'), ...project.baselines.flatMap(b => [`${b.name} — ${t('xp.start')}`, `${b.name} — ${t('xp.end')}`])],
        ...project.tasks.filter(x => x.type !== 'summary').map(x => [x.id, x.name, ...project.baselines.flatMap(b => { const bt = b.tasks.find(y => y.id === x.id); return bt ? [bt.start, bt.end] : ['', '']; })])] },
    ]);
  }

  /* ── MS Project XML (EF-95, 8.6) ─────────────────────────────────────────────────────────── */
  const MSP_TYPE = { FF: 0, FS: 1, SF: 2, SS: 3 }, MSP_BACK = ['FF', 'FS', 'SF', 'SS'];
  const X = Xml.escape;

  function mspXml(project, sched) {
    const cal = Calendar.create(project.calendar, project.projectStart);
    const uid = new Map(project.tasks.map((x, i) => [x.id, i + 1]));
    const ruid = new Map(project.resources.map((r, i) => [r.id, i + 1]));
    const level = new Map();
    for (const x of project.tasks) level.set(x.id, x.parent ? level.get(x.parent) + 1 : 1);
    const iso = dn => Dates.toISO(dn);
    const lo = sched.startDn, hi = sched.projectEndDn;
    // Jours fériés et chômés de la période : exceptions non travaillées ; jours travaillés exceptionnels : exceptions travaillées.
    const exc = [];
    for (let dn = lo - 7; dn <= hi + 31; dn++) {
      const info = cal.dayInfo(dn);
      if (!info) continue;
      if ((info.kind === 'holiday' || info.kind === 'off')) exc.push({ dn, working: false, name: info.kind === 'holiday' ? t(info.key) : info.label });
      if (info.kind === 'worked') exc.push({ dn, working: true, name: info.label });
    }
    const wt = '<WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime><WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>';
    const mspDay = k => (k + 1) % 7 + 1; // lundi (0) → 2 … dimanche (6) → 1
    const weekDays = project.calendar.workDays.map((w, k) => `<WeekDay><DayType>${mspDay(k)}</DayType><DayWorking>${w}</DayWorking>${w ? wt : ''}</WeekDay>`).join('');
    const exceptions = exc.map(e => `<Exception><EnteredByOccurrences>0</EnteredByOccurrences><TimePeriod><FromDate>${iso(e.dn)}T00:00:00</FromDate><ToDate>${iso(e.dn)}T23:59:00</ToDate></TimePeriod><Occurrences>1</Occurrences><Name>${X(e.name)}</Name><Type>1</Type><DayWorking>${e.working ? 1 : 0}</DayWorking>${e.working ? wt : ''}</Exception>`).join('');
    const tasks = project.tasks.map(x => {
      const r = sched.tasks.get(x.id);
      const dur = x.type === 'summary' ? (r && !r.empty ? r.d : 0) : x.type === 'milestone' ? 0 : x.dur;
      const start = r && !r.empty ? `${iso(r.startDn)}T08:00:00` : `${project.projectStart}T08:00:00`;
      const finish = r && !r.empty ? `${iso(r.endDn)}T${x.type === 'milestone' ? '08:00:00' : '17:00:00'}` : start;
      let ctype = 0, cdate = '';
      if (x.forcedStart) { ctype = 2; cdate = x.forcedStart; } else if (x.notBefore) { ctype = 4; cdate = x.notBefore; }
      return `<Task><UID>${uid.get(x.id)}</UID><ID>${uid.get(x.id)}</ID><Name>${X(x.name)}</Name><WBS>${X(x.id)}</WBS><OutlineLevel>${level.get(x.id)}</OutlineLevel>` +
        `<Start>${start}</Start><Finish>${finish}</Finish><Duration>PT${dur * 8}H0M0S</Duration><DurationFormat>7</DurationFormat>` +
        `<Milestone>${x.type === 'milestone' ? 1 : 0}</Milestone><Summary>${x.type === 'summary' ? 1 : 0}</Summary><PercentComplete>${Metrics.pctOf(x, sched)}</PercentComplete>` +
        `<ConstraintType>${ctype}</ConstraintType>${cdate ? `<ConstraintDate>${cdate}T08:00:00</ConstraintDate>` : ''}` +
        (x.deadline ? `<Deadline>${x.deadline}T17:00:00</Deadline>` : '') +
        (x.realStart ? `<ActualStart>${x.realStart}T08:00:00</ActualStart>` : '') + (x.realEnd ? `<ActualFinish>${x.realEnd}T17:00:00</ActualFinish>` : '') +
        x.deps.map(d => `<PredecessorLink><PredecessorUID>${uid.get(d.id)}</PredecessorUID><Type>${MSP_TYPE[d.type]}</Type><LinkLag>${d.lag * 4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('') +
        (x.notes ? `<Notes>${X(x.notes)}</Notes>` : '') + '</Task>';
    }).join('');
    const resources = project.resources.map(r => `<Resource><UID>${ruid.get(r.id)}</UID><ID>${ruid.get(r.id)}</ID><Name>${X(r.name)}</Name><Type>1</Type><MaxUnits>${(r.capacity / 100).toFixed(2)}</MaxUnits></Resource>`).join('');
    let auid = 0;
    const assigns = project.tasks.flatMap(x => x.assign.map(a => `<Assignment><UID>${++auid}</UID><TaskUID>${uid.get(x.id)}</TaskUID><ResourceUID>${ruid.get(a.res)}</ResourceUID><Units>${(a.units / 100).toFixed(2)}</Units></Assignment>`)).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Project xmlns="http://schemas.microsoft.com/project">' +
      `<SaveVersion>14</SaveVersion><Name>${X(project.name)}</Name><Title>${X(project.name)}</Title><StartDate>${project.projectStart}T08:00:00</StartDate>` +
      `<FinishDate>${iso(hi)}T17:00:00</FinishDate><CalendarUID>1</CalendarUID><MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>2400</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth>` +
      `<Calendars><Calendar><UID>1</UID><Name>Standard</Name><IsBaseCalendar>1</IsBaseCalendar><WeekDays>${weekDays}</WeekDays><Exceptions>${exceptions}</Exceptions></Calendar></Calendars>` +
      `<Tasks>${tasks}</Tasks><Resources>${resources}</Resources><Assignments>${assigns}</Assignments></Project>\n`;
  }

  /** XML MS Project → {raw (objet au format 8.2, à contrôler par Model.sanitize), ignored:[libellés]}. */
  function fromMspXml(text) {
    let doc;
    try { doc = Xml.parse(text); } catch { throw new Model.Invalid('imp.unreadable'); }
    const P = Xml.child(doc, 'Project');
    if (!P) throw new Model.Invalid('imp.unreadable');
    const ignored = new Set();
    const day = s => (s || '').slice(0, 10);
    const calUid = Xml.textOf(P, 'CalendarUID') || '1';
    const cals = Xml.children(Xml.child(P, 'Calendars'), 'Calendar');
    const base = cals.find(c => Xml.textOf(c, 'UID') === calUid) || cals[0];
    const calendar = { workDays: [1, 1, 1, 1, 1, 0, 0], holidays: 'NONE', daysOff: [], daysWorked: [] };
    if (base) {
      for (const wd of Xml.children(Xml.child(base, 'WeekDays'), 'WeekDay')) {
        const dt = Number(Xml.textOf(wd, 'DayType'));
        if (dt >= 1 && dt <= 7 && !Xml.child(wd, 'TimePeriod')) calendar.workDays[(dt + 5) % 7] = Xml.textOf(wd, 'DayWorking') === '1' ? 1 : 0;
      }
      for (const e of [...Xml.children(Xml.child(base, 'Exceptions'), 'Exception'), ...Xml.children(Xml.child(base, 'WeekDays'), 'WeekDay').filter(w => Xml.child(w, 'TimePeriod'))]) {
        const tp = Xml.child(e, 'TimePeriod');
        const from = day(Xml.textOf(tp, 'FromDate')), to = day(Xml.textOf(tp, 'ToDate')) || from;
        if (!Dates.parse(from)) continue;
        const entry = { start: from, end: Dates.parse(to) != null && to >= from ? to : from, label: Xml.textOf(e, 'Name').slice(0, 100) };
        (Xml.textOf(e, 'DayWorking') === '1' ? calendar.daysWorked : calendar.daysOff).push(entry);
      }
      if (cals.length > 1) ignored.add(t('msp.ign.calendars'));
    }
    const rows = Xml.children(Xml.child(P, 'Tasks'), 'Task')
      .filter(x => Xml.textOf(x, 'UID') !== '0' && Xml.textOf(x, 'IsNull') !== '1')
      .sort((a, b) => Number(Xml.textOf(a, 'ID')) - Number(Xml.textOf(b, 'ID')));
    const used = new Set(), byUid = new Map(), stack = [];
    const tasks = rows.map(x => {
      const wbs = Xml.textOf(x, 'WBS').toUpperCase();
      let id = Model.ID_RE.test(wbs) && !used.has(wbs) ? wbs : '';
      if (!id) id = Model.nextTaskId([...used]);
      used.add(id);
      byUid.set(Xml.textOf(x, 'UID'), id);
      const lvl = Math.max(1, Number(Xml.textOf(x, 'OutlineLevel')) || 1);
      stack.length = lvl - 1;
      const parent = stack.length ? stack[stack.length - 1] : '';
      const summary = Xml.textOf(x, 'Summary') === '1', milestone = Xml.textOf(x, 'Milestone') === '1';
      stack[lvl - 1] = id;
      const m = /PT(\d+)H(\d+)M/.exec(Xml.textOf(x, 'Duration'));
      const hours = m ? Number(m[1]) + Number(m[2]) / 60 : 8;
      const ct = Number(Xml.textOf(x, 'ConstraintType') || 0), cd = day(Xml.textOf(x, 'ConstraintDate'));
      if (ct && ct !== 2 && ct !== 4) ignored.add(t('msp.ign.constraint', { n: ct }));
      for (const k of ['Cost', 'Work', 'FixedCost', 'ActualCost', 'ActualWork']) if (Number(Xml.textOf(x, k).replace(/[^\d.]/g, '')) > 0) ignored.add(t('msp.ign.' + (k.includes('Cost') ? 'cost' : 'work')));
      const pct = Math.max(0, Math.min(100, Math.round(Number(Xml.textOf(x, 'PercentComplete')) || 0)));
      const realEnd = day(Xml.textOf(x, 'ActualFinish'));
      return {
        uid: Xml.textOf(x, 'UID'), id, name: (Xml.textOf(x, 'Name') || id).slice(0, 200), parent,
        type: summary ? 'summary' : milestone ? 'milestone' : 'task',
        dur: summary || milestone ? 0 : Math.min(Model.LIMITS.dur, Math.max(1, Math.ceil(hours / 8))),
        pct: milestone ? (pct >= 100 ? 100 : 0) : summary ? 0 : (realEnd ? 100 : pct),
        forcedStart: summary ? '' : ct === 2 ? cd : '', notBefore: summary ? '' : ct === 4 ? cd : '',
        deadline: summary ? '' : day(Xml.textOf(x, 'Deadline')),
        realStart: summary || milestone ? '' : day(Xml.textOf(x, 'ActualStart')), realEnd: summary || milestone ? '' : realEnd,
        notes: Xml.textOf(x, 'Notes').slice(0, 2000), links: summary ? [] : Xml.children(x, 'PredecessorLink'),
      };
    });
    const resources = Xml.children(Xml.child(P, 'Resources'), 'Resource').filter(r => Xml.textOf(r, 'UID') !== '0' && Xml.textOf(r, 'Name'))
      .map(r => ({ uid: Xml.textOf(r, 'UID'), name: Xml.textOf(r, 'Name').slice(0, 100), capacity: Math.max(1, Math.min(100, Math.round((Number(Xml.textOf(r, 'MaxUnits')) || 1) * 100))) }));
    if (Xml.children(Xml.child(P, 'Resources'), 'Resource').some(r => Xml.textOf(r, 'CalendarUID') && Xml.textOf(r, 'CalendarUID') !== calUid && Xml.textOf(r, 'CalendarUID') !== '-1')) ignored.add(t('msp.ign.resCalendars'));
    const resByUid = new Map(resources.map(r => [r.uid, r]));
    const assign = new Map();
    for (const a of Xml.children(Xml.child(P, 'Assignments'), 'Assignment')) {
      const r = resByUid.get(Xml.textOf(a, 'ResourceUID')), tid = Xml.textOf(a, 'TaskUID');
      if (!r) continue;
      let units = Math.round((Number(Xml.textOf(a, 'Units')) || 1) * 100);
      if (units > r.capacity) { units = r.capacity; ignored.add(t('msp.ign.units')); }
      (assign.get(tid) || assign.set(tid, []).get(tid)).push({ res: r.name, units: Math.max(1, units) });
    }
    const raw = {
      format: 3, name: (Xml.textOf(P, 'Title') || Xml.textOf(P, 'Name') || 'Projet MS Project').slice(0, 60),
      projectStart: day(Xml.textOf(P, 'StartDate')) || Dates.toISO(Dates.todayDn()), calendar, leveling: 'smooth',
      tasks: tasks.map(x => ({
        id: x.id, name: x.name, type: x.type, parent: x.parent, dur: x.dur, pct: x.pct,
        deps: x.links.map(l => ({ id: byUid.get(Xml.textOf(l, 'PredecessorUID')), type: MSP_BACK[Number(Xml.textOf(l, 'Type'))] || 'FS',
          lag: Math.max(-365, Math.min(365, Math.round((Number(Xml.textOf(l, 'LinkLag')) || 0) / 4800))) })).filter(d => d.id && d.id !== x.id),
        assign: x.type === 'task' ? (assign.get(x.uid) || []) : [],
        forcedStart: x.forcedStart, notBefore: x.notBefore, deadline: x.deadline, realStart: x.realStart, realEnd: x.realEnd, notes: x.notes,
      })),
      resources: resources.map(r => ({ name: r.name, capacity: r.capacity })),
      categories: [], baselines: [],
    };
    return { raw, ignored: [...ignored] };
  }

  /* ── Import de tâches depuis un tableau (EF-96, RG-30) ─────────────────────────────────── */
  const FIELDS = ['id', 'num', 'name', 'type', 'parent', 'dur', 'deps', 'res', 'cat', 'pct', 'tags', 'notes', 'forcedStart', 'notBefore', 'deadline'];
  const SYN = {
    id: ['identifiant', 'id', 'code'], num: ['n°', 'n', 'no', 'numero', 'num', 'number', 'ligne', 'row', '#', 'wbs', 'edt'], name: ['nom', 'name', 'activite', 'activity', 'tache', 'task', 'libelle'],
    type: ['type'], parent: ['parent', 'recapitulative', 'summary'], dur: ['duree', 'duration', 'jours', 'days'],
    deps: ['predecesseurs', 'predecessors', 'dependances', 'dependencies', 'dep'], res: ['ressource', 'ressources', 'resource', 'resources'],
    cat: ['categorie', 'category'], pct: ['avancement', 'progress', '% acheve', 'percent complete'], tags: ['etiquettes', 'tags', 'etiquette'],
    notes: ['notes', 'note', 'commentaire'], forcedStart: ['debut impose', 'date imposee', 'fixed start date', 'fixed start', 'must start on'],
    notBefore: ['ne pas commencer avant', 'start no earlier than', 'pas avant'], deadline: ['echeance', 'deadline'],
  };
  const norm = s => View.fold(String(s)).replace(/[^a-z0-9%° ]/g, ' ').replace(/\s+/g, ' ').trim();

  /** Association automatique des colonnes à partir de la première ligne (RG-30). */
  function guessMapping(header) {
    const map = {};
    header.forEach((h, i) => {
      const n = norm(h);
      for (const f of FIELDS) if (map[f] === undefined && SYN[f].includes(n)) { map[f] = i; break; }
    });
    return map;
  }

  function parseDate(v) {
    if (typeof v === 'number' && v > 20000 && v < 120000) return Dates.toISO(Math.round(v) - 25569); // date série Excel
    const s = String(v ?? '').trim();
    if (!s) return '';
    if (Dates.parse(s) != null) return s;
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) { const iso = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; if (Dates.parse(iso) != null) return iso; }
    return null;
  }

  /**
   * Lignes → tâches au format 8.2. Renvoie {tasks, resources, categories, errors:[{line, msg}], valid}.
   * Une ligne en erreur est écartée ; les autres sont gardées. Les prédécesseurs désignent les
   * identifiants du fichier, sinon des tâches existantes du projet (RG-30). Sans colonne
   * d'identifiant, une colonne « N° » sert de référence pour les liens et les parents : les tâches
   * reçoivent alors de nouveaux identifiants et les liens suivent.
   */
  function rowsToTasks(rows, map, existing, { skipHeader = true } = {}) {
    const data = rows.slice(skipHeader ? 1 : 0);
    if (data.length > 1000) throw new Model.Invalid('imp.tooMany', { what: 'lignes', max: 1000 });
    const get = (r, f) => (map[f] === undefined ? '' : r[map[f]] ?? '');
    const errors = [], out = [];
    const fileIds = new Set();
    const refOf = r => String(get(r, 'id')).trim().toUpperCase() || String(get(r, 'num')).trim().toUpperCase();
    for (const r of data) { const id = refOf(r); if (Model.ID_RE.test(id)) fileIds.add(id); }
    const known = new Set([...fileIds, ...existing]);
    data.forEach((r, k) => {
      const line = k + (skipHeader ? 2 : 1);
      const LABEL = { name: 'xp.name', dur: 'xp.dur', pct: 'xp.pct', deps: 'xp.deps', res: 'xp.res', forcedStart: 'xp.forced', notBefore: 'xp.notBefore', deadline: 'xp.deadline' };
      const fail = (field, msg) => errors.push({ line, msg: `${t(LABEL[field])} : ${msg}` });
      const before = errors.length;
      const name = String(get(r, 'name')).trim();
      if (!name || name.length > 200) fail('name', t('rule.text', { min: 1, max: 200 }));
      const typeRaw = norm(get(r, 'type'));
      let type = ['jalon', 'milestone'].includes(typeRaw) ? 'milestone' : ['recapitulative', 'summary task', 'summary'].includes(typeRaw) ? 'summary' : 'task';
      let dur = 5;
      const dRaw = String(get(r, 'dur')).trim();
      if (dRaw !== '') {
        const m = /^(\d+)\s*(j|d|jours?|days?)?$/i.exec(dRaw);
        if (!m) fail('dur', t('imp.durFormat'));
        else { dur = Number(m[1]); if (dur === 0 && type === 'task') type = 'milestone'; else if (type === 'task' && (dur < 1 || dur > Model.LIMITS.dur)) fail('dur', t('rule.int', { min: 1, max: '3 650' })); }
      }
      let pct = 0;
      const pRaw = String(get(r, 'pct')).replace('%', '').trim();
      if (pRaw !== '') { pct = Number(pRaw.replace(',', '.')); if (!Number.isFinite(pct) || pct < 0 || pct > 100) fail('pct', t('rule.int', { min: 0, max: 100 })); else pct = Math.round(pct); }
      const deps = [];
      for (const part of String(get(r, 'deps')).split(/[;,]/).map(x => x.trim()).filter(Boolean)) {
        const m = /^([A-Za-z0-9._-]{1,12})(?:\s+([A-Za-z]{2})\s*([+\-−]\s*\d+)?)?$/.exec(part);
        if (!m || (m[2] && !LINK_IN[m[2].toUpperCase()])) { fail('deps', t('imp.depFormat', { value: part })); continue; }
        const id = m[1].toUpperCase();
        if (!known.has(id)) { fail('deps', t('imp.missingDep', { id })); continue; }
        const lag = m[3] ? Number(m[3].replace(/\s/g, '').replace('\u2212', '-')) : 0;
        if (Math.abs(lag) > Model.LIMITS.lag) { fail('deps', t('rule.int', { min: -365, max: 365 })); continue; }
        deps.push({ id, type: m[2] ? LINK_IN[m[2].toUpperCase()] : 'FS', lag });
      }
      const assign = [];
      for (const part of String(get(r, 'res')).split(';').map(x => x.trim()).filter(Boolean)) {
        const m = /^(.*?)(?:\s+(\d{1,3})\s*%)?$/.exec(part);
        const units = m[2] ? Number(m[2]) : 100;
        if (!m[1] || m[1].length > 100 || units < 1 || units > 100) { fail('res', t('imp.resFormat', { value: part })); continue; }
        assign.push({ res: m[1].trim(), units });
      }
      const dates = {};
      for (const f of ['forcedStart', 'notBefore', 'deadline']) { const v = parseDate(get(r, f)); if (v === null) fail(f, t('rule.date')); else dates[f] = v; }
      const tags = String(get(r, 'tags')).split(/[;,]/).map(x => x.trim()).filter(Boolean).slice(0, Model.LIMITS.tags).map(x => x.slice(0, 30));
      if (errors.length > before) return;
      out.push({
        fileId: String(get(r, 'id')).trim().toUpperCase(), ref: refOf(r), name, type, parent: String(get(r, 'parent')).trim().toUpperCase(),
        dur: type === 'task' ? dur : 0, pct: type === 'milestone' ? (pct >= 100 ? 100 : 0) : type === 'summary' ? 0 : pct,
        deps: type === 'summary' ? [] : deps, assign: type === 'task' ? assign : [], cat: String(get(r, 'cat')).trim().slice(0, 100),
        tags, notes: String(get(r, 'notes')).slice(0, 2000), ...dates, line,
      });
    });
    return { rows: out, errors, total: data.length };
  }

  /**
   * Fusionne les lignes valides dans le projet (ajout ou remplacement), au format 8.2, puis contrôle
   * le tout par Model.sanitize. Renvoie {project, added:[ids]} ou lève Model.Invalid.
   */
  function mergeRows(project, rows, mode) {
    const file = Model.serialize(project, { withVersions: true });
    if (mode === 'replace') file.tasks = [];
    const used = new Set(file.tasks.map(x => x.id));
    const remap = new Map();
    // Identifiant du fichier gardé s'il est libre ; sinon un identifiant libre, et les liens suivent.
    const ids = rows.map(r => {
      const id = Model.ID_RE.test(r.fileId) && !used.has(r.fileId) ? r.fileId : Model.nextTaskId([...used]);
      used.add(id);
      if (r.ref || r.fileId) remap.set(r.ref || r.fileId, id);
      return id;
    });
    const fix = id => remap.get(id) || id;
    rows.forEach((r, i) => file.tasks.push({
      id: ids[i], name: r.name, type: r.type, parent: r.parent ? fix(r.parent) : '', dur: r.dur, pct: r.pct,
      deps: r.deps.map(d => ({ id: fix(d.id), type: d.type, lag: d.lag })), assign: r.assign, cat: r.cat, tags: r.tags, notes: r.notes,
      forcedStart: r.forcedStart || '', notBefore: r.notBefore || '', deadline: r.deadline || '',
    }));
    const { project: p } = Model.sanitize(file);
    return { project: p, added: ids };
  }

  return { taskRows, csv, xlsx, mspXml, fromMspXml, guessMapping, rowsToTasks, mergeRows, FIELDS, outline };
})();

// ── js/core/65-crypto.js ──
/* Protection par mot de passe (EF-102, section 8.5) avec l'API Web Crypto du navigateur, sans
 * bibliothèque : clé dérivée par PBKDF2-SHA256 (600 000 itérations, sel aléatoire de 16 octets),
 * chiffrement authentifié AES-256-GCM (vecteur de 12 octets). Le mot de passe n'est jamais
 * enregistré ; un mot de passe faux et un fichier altéré donnent le même message.
 * Choix (CLAUDE.md, A02) : bcrypt/argon2 servent à STOCKER des mots de passe ; ici on dérive une
 * clé de chiffrement, rôle pour lequel PBKDF2 est natif et recommandé à ce nombre d'itérations. */
const Secure = (() => {
  const ITER = 600000, MAX_ITER = 5000000, MIN_PASSWORD = 12;
  const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = str => { const s = atob(str); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; };

  async function key(password, salt, iterations, usage) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, [usage]);
  }

  /** Mot de passe acceptable : 12 caractères au moins (ou une phrase), recommandation ANSSI. */
  const passwordOk = p => typeof p === 'string' && [...p].length >= MIN_PASSWORD;

  /** Texte → enveloppe 8.5. */
  async function encrypt(text, password, iterations = ITER) {
    if (!passwordOk(password)) throw new Model.Invalid('pwd.short', { min: MIN_PASSWORD });
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const k = await key(password, salt, iterations, 'encrypt');
    const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(text)));
    return { format: Model.FORMAT, encrypted: true, kdf: { name: 'PBKDF2-SHA256', iterations, salt: b64(salt) }, cipher: { name: 'AES-256-GCM', iv: b64(iv) }, data: b64(data) };
  }

  /** Enveloppe → texte ; Model.Invalid('pwd.bad') si mot de passe faux ou fichier altéré. */
  async function decrypt(env, password) {
    const ok = env && env.encrypted === true && env.kdf && env.kdf.name === 'PBKDF2-SHA256' && env.cipher && env.cipher.name === 'AES-256-GCM'
      && Number.isInteger(env.kdf.iterations) && env.kdf.iterations >= ITER && env.kdf.iterations <= MAX_ITER
      && typeof env.kdf.salt === 'string' && typeof env.cipher.iv === 'string' && typeof env.data === 'string';
    if (!ok) throw new Model.Invalid('imp.unreadable');
    let salt, iv, data;
    try { salt = unb64(env.kdf.salt); iv = unb64(env.cipher.iv); data = unb64(env.data); } catch { throw new Model.Invalid('imp.unreadable'); }
    if (salt.length < 16 || iv.length !== 12) throw new Model.Invalid('imp.unreadable');
    try {
      const k = await key(password, salt, env.kdf.iterations, 'decrypt');
      return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, data));
    } catch { throw new Model.Invalid('pwd.bad'); }
  }

  return { encrypt, decrypt, passwordOk, MIN_PASSWORD, ITER };
})();

// ── js/ui/00-dom.js ──
/* Construction du DOM SANS innerHTML (A03 – injection) : tout texte passe par textContent,
 * tout attribut par setAttribute après contrôle du nom, tout style par le CSSOM.
 * Un texte venant d'un fichier ne peut donc jamais devenir du code (EX-13). */
const $ = id => document.getElementById(id);

const FORBIDDEN_ATTR = /^(on|style$|srcdoc$|formaction$)/i;
const URL_ATTR = /^(href|src|action|xlink:href)$/i;

/**
 * h('button', {class:'x', data:{click:'save'}, aria:{label:'…'}, css:{left:'4px'}, text:'OK'}, enfants…)
 * Les enfants sont des nœuds ou des chaînes (insérées comme texte).
 */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'text') el.textContent = String(v);
    else if (k === 'class') el.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : v;
    else if (k === 'data') for (const [dk, dv] of Object.entries(v)) { if (dv !== undefined && dv !== null) el.dataset[dk] = String(dv); }
    else if (k === 'aria') for (const [ak, av] of Object.entries(v)) { if (av !== undefined && av !== null) el.setAttribute('aria-' + ak, String(av)); }
    else if (k === 'css') for (const [ck, cv] of Object.entries(v)) el.style.setProperty(ck, String(cv));
    else if (k === 'value') el.value = String(v);
    else if (k === 'checked' || k === 'selected' || k === 'disabled' || k === 'hidden' || k === 'required' || k === 'multiple') el[k] = !!v;
    else {
      if (FORBIDDEN_ATTR.test(k)) throw new Error('attribut interdit : ' + k);
      if (URL_ATTR.test(k) && !/^(#|blob:|data:image\/png)/.test(String(v))) throw new Error('adresse interdite');
      el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* Vide un élément. Si le focus est dedans, on le retire AVANT : le « change » ou le « blur » qui en
 * découle (et qui peut lui-même repeindre) s'exécute entièrement, puis le vidage a lieu. */
function clear(el) {
  const a = document.activeElement;
  if (a && a !== document.body && el.contains(a)) a.blur();
  el.replaceChildren();
  return el;
}

/** Couleur sûre pour le CSSOM : uniquement #rgb ou #rrggbb (EX-13), sinon la teinte neutre. */
function safeColor(c, fallback = '#8a94a6') { return typeof c === 'string' && Model.COLOR_RE.test(c) ? c : fallback; }

/** Texte lisible (noir ou blanc) sur une couleur de fond (contraste EX-03). */
function inkOn(hex) {
  let c = safeColor(hex).slice(1);
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const lum = [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255).map(v => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  const L = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2];
  return L > 0.179 ? '#000000' : '#ffffff';
}

let liveTimer = 0;
/** Message annoncé aux lecteurs d'écran (EX-02) et affiché brièvement. */
function announce(msg) {
  const live = $('live');
  live.textContent = '';
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { live.textContent = msg; }, 30);
}

// ── js/ui/10-storage.js ──
/* Seul module autorisé à toucher au stockage du navigateur (contrôlé par tools/build.py).
 *
 * Vie privée (EX-10, EX-22) : ne sont conservés sur l'appareil que les RÉGLAGES (langue, thème),
 * jamais un projet ni un nom de ressource. Pas de cookie. Chaque lecture est validée (le stockage
 * est une donnée non fiable : une autre page locale peut l'avoir modifié) et chaque accès est
 * protégé, car le stockage peut être indisponible (navigation privée, fichier local). */
const Settings = (() => {
  const PREFIX = 'ganttpro.settings.';
  const ALLOWED = { theme: ['system', 'light', 'dark'], lang: ['fr', 'en'] };

  function get(key) {
    try {
      const v = window.localStorage.getItem(PREFIX + key);
      return ALLOWED[key] && ALLOWED[key].includes(v) ? v : null;
    } catch { return null; }
  }
  function set(key, value) {
    if (!ALLOWED[key] || !ALLOWED[key].includes(value)) return false;
    try { window.localStorage.setItem(PREFIX + key, value); return true; } catch { return false; }
  }
  /** Efface tout ce que GanttPro a écrit sur l'appareil (EF-104). */
  function clearAll() {
    try {
      for (let i = window.localStorage.length - 1; i >= 0; i--) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith('ganttpro.')) window.localStorage.removeItem(k);
      }
      return true;
    } catch { return false; }
  }
  return { get, set, clearAll };
})();

// ── js/ui/20-actions.js ──
/* Aucune action n'est attachée par un attribut onclick= (interdit, et bloqué par la CSP).
 * Les éléments portent data-click / data-change / data-input / data-submit (+ data-arg) ;
 * un seul écouteur par type d'événement les relie à la table ACTIONS ci-dessous.
 * data-arg est toujours passé comme chaîne brute (les identifiants de tâche sont des chaînes). */
const ACTIONS = Object.create(null);

function action(name, fn) { ACTIONS[name] = fn; }

function dispatch(kind, ev) {
  const el = ev.target.closest(`[data-${kind}]`);
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[el.dataset[kind]];
  if (!fn) return;
  if (kind === 'submit') ev.preventDefault();
  fn(el.dataset.arg, el, ev);
}

function initActions() {
  document.addEventListener('click', ev => dispatch('click', ev));
  document.addEventListener('change', ev => dispatch('change', ev));
  document.addEventListener('input', ev => dispatch('input', ev));
  document.addEventListener('submit', ev => dispatch('submit', ev));
  // Élément non natif marqué role="button" : Entrée et Espace l'activent (EX-01).
  document.addEventListener('keydown', ev => {
    const el = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.click) {
      ev.preventDefault();
      dispatch('click', ev);
    }
  });
}

// ── js/ui/30-dialog.js ──
/* Fenêtres de l'application (4.3) : jamais alert/confirm/prompt du navigateur.
 * Élément <dialog> natif ouvert en modal : l'arrière-plan est inerte, Tab reste dans la fenêtre,
 * Échap ferme ; le focus revient ensuite à l'élément qui l'avait ouverte. Chaque fenêtre est
 * annoncée comme un dialogue titré (EX-02). Plusieurs fenêtres peuvent s'empiler. */
const Dialog = (() => {
  let seq = 0;

  /**
   * @param {object} o
   * @param {string} o.title
   * @param {Node[]} o.body
   * @param {{label:string, value:string, kind?:string, focus?:boolean}[]} o.actions
   * @param {(value:string, dlg:HTMLDialogElement) => boolean|void} [o.onAction] renvoyer false garde la fenêtre ouverte
   * @param {string} [o.size] 'wide'
   * @returns {Promise<string>} valeur du bouton choisi, ou 'cancel'
   */
  function open({ title, body = [], actions = [], onAction, size }) {
    const opener = document.activeElement;
    const id = 'dlg-' + (++seq);
    return new Promise(resolve => {
      const buttons = actions.map(a => h('button', {
        type: a.value === 'cancel' ? 'button' : 'submit', value: a.value, class: a.kind || '',
        data: { dlg: a.value }, autofocus: a.focus ? true : undefined,
      }, a.label));
      const form = h('form', { method: 'dialog', novalidate: true },
        h('h2', { id: id + '-title', text: title }),
        h('div', { class: 'dialog-body' }, body),
        h('div', { class: 'actions' }, buttons));
      const dlg = h('dialog', { class: ['dialog', size], aria: { labelledby: id + '-title' } }, form);
      let done = false;
      const finish = value => {
        if (done) return;
        done = true;
        if (dlg.open) dlg.close();
        dlg.remove();
        if (opener && opener.isConnected && typeof opener.focus === 'function') opener.focus();

      dlg.showModal();
      const first = dlg.querySelector('[autofocus]') || dlg.querySelector('input, select, textarea, button');
      if (first) first.focus();

  /** Message simple. */
  function message(title, text) {
    return open({ title, body: [h('p', { text })], actions: [{ label: I18n.t('dlg.ok'), value: 'ok', kind: 'primary', focus: true }] });

/* État de l'application : le projet, son planning calculé, l'historique d'annulation et
 * l'indicateur de modifications non exportées (EF-53, EF-55). */
const App = {
  project: null,
  sched: null,
  calcError: null,
  selected: null,
  zoom: 100,
  showAlerts: true,
  showLinks: true,
  // Recherche, filtres et regroupement (EF-84 à EF-86) : affichage seulement, jamais enregistrés.
  view: { query: '', highlight: false, filters: null, groupBy: '', collapsedGroups: new Set(), panel: false },
  undo: [],
  redo: [],
  dirty: false,
};
const UNDO_MAX = 50;

const clone = o => JSON.parse(JSON.stringify(o));

/** Remet les descendants de chaque récapitulative juste sous elle, en gardant l'ordre relatif. */
function normalizeOrder(project) {
  const kids = new Map();
  const ids = new Set(project.tasks.map(t => t.id));
  for (const t of project.tasks) {
    const p = t.parent && ids.has(t.parent) ? t.parent : '';
    (kids.get(p) || kids.set(p, []).get(p)).push(t);
  }
  const out = [], seen = new Set();
  const walk = t => { if (seen.has(t.id)) return; seen.add(t.id); out.push(t); for (const c of kids.get(t.id) || []) walk(c); };
  for (const t of kids.get('') || []) walk(t);
  for (const t of project.tasks) walk(t); // sûreté : rien ne se perd
  project.tasks = out;
}

function recompute() {
  try {
    App.sched = Schedule.compute(App.project);
    App.calcError = null;
  } catch {
    App.sched = null;
    App.calcError = 'calc.error'; // RangeError : date au-delà de 2199
  }
}

/**
 * Applique une modification de données en un seul pas d'annulation.
 * @param {(p:object) => void} mutate
 */
function commit(mutate) {
  const before = clone(App.project);
  mutate(App.project);
  normalizeOrder(App.project);
  App.undo.push(before);
  if (App.undo.length > UNDO_MAX) App.undo.shift();
  App.redo = [];
  App.dirty = true;
  recompute();
  render();
}

function loadProject(project) {
  App.project = project;
  normalizeOrder(App.project);
  App.undo = []; App.redo = [];
  App.selected = null;
  App.dirty = false;
  recompute();
}

function undoStep(from, to) {
  if (!from.length) return false;
  to.push(clone(App.project));
  App.project = from.pop();
  App.dirty = true;
  const editing = Editor.isOpen() ? App.selected : null;
  if (App.selected && !App.project.tasks.some(t => t.id === App.selected)) App.selected = null;
  recompute();
  // La fiche d'édition ouverte suit l'état rétabli : rechargée si la tâche existe encore, fermée sinon.
  if (editing) { if (App.selected === editing) Editor.open(editing); else Editor.close(); }
  render();
  return true;
}

const taskById = id => App.project.tasks.find(t => t.id === id);
const resById = id => App.project.resources.find(r => r.id === id);
const catById = id => App.project.categories.find(c => c.id === id);

/** Descendants d'une récapitulative. */
function descendants(id, tasks = App.project.tasks) {
  const out = [];
  const walk = pid => { for (const t of tasks) if (t.parent === pid) { out.push(t); walk(t.id); } };
  walk(id);
  return out;
}
function ancestorsOf(id, tasks = App.project.tasks) {
  const out = [];
  let t = tasks.find(x => x.id === id);
  while (t && t.parent && out.length <= Model.LIMITS.depth) { out.push(t.parent); t = tasks.find(x => x.id === t.parent); }
  return out;
}

/** Lignes visibles : une tâche dont un ancêtre est replié est masquée (RG-27 : sans effet sur le calcul). */
function visibleTasks() {
  const collapsed = new Set(App.project.tasks.filter(t => t.type === 'summary' && t.collapsed).map(t => t.id));
  return App.project.tasks.filter(t => !ancestorsOf(t.id).some(a => collapsed.has(a)));
}

function alertMessages() {

/** Fenêtre de temps de la grille (EF-17) : toutes les dates affichées. */

function renderGantt(items, fl) {
  const rows = items.filter(it => it.task).map(it => it.task);

  const { from, to } = gridRange();
  const dayW = 26 * App.zoom / 100 / 7;
  const days = to - from + 1;
  const width = Math.max(1, Math.round(days * dayW));

  const x = dn => (dn - from) * dayW;

  // En-tête sur deux lignes : les mois, puis le lundi de chaque semaine (vue semaine) ;

  const head = h('div', { class: 'g-head' });

  };

    mc.setAttribute('aria-hidden', 'true');
    head.append(mc);
  }
  if (!monthView) {
    for (const p of Metrics.periods(from, to, 'week')) {
      const names = [];
      for (let dn = p.start; dn <= p.end; dn++) { const info = s.cal.dayInfo(dn); if (info && info.kind === 'holiday') names.push(t(info.key)); }
      const c = cell(['g-col', 'week', names.length && 'has-holiday'].filter(Boolean).join(' '), p.start, p.end,
        String(Dates.ymd(p.start).d).padStart(2, '0'), names.join(', '));
      if (!names.length) c.setAttribute('aria-hidden', 'true');

  const body = h('div', { class: 'g-body' });

  for (let dn = from; dn <= to; dn++) {
    if (s.cal.isWork(dn)) continue;
    let end = dn;
    while (end + 1 <= to && !s.cal.isWork(end + 1)) end++;
    const off = h('div', { class: 'g-off', aria: { hidden: 'true' } });
    off.style.setProperty('left', x(dn) + 'px');
    off.style.setProperty('width', ((end - dn + 1) * dayW) + 'px');
    body.append(off);
    dn = end;
  }
  const td = today();
  if (td >= from && td <= to) {

  const row = (...children) => h('div', { class: 'g-row' }, children);
  const rowOf = new Map(); // id → index de ligne visible, pour les flèches
  items.forEach((it, i) => { if (it.task && !rowOf.has(it.task.id)) rowOf.set(it.task.id, i + 1); });
  const msAuto = (dn, cls) => { const m = h('div', { class: 'ms auto ' + cls, aria: { hidden: 'true' } }); m.style.setProperty('left', x(dn + 0.5) + 'px'); return row(m); };

  for (const it of items) {

      const gr = h('div', { class: 'g-row g-group', aria: { hidden: 'true' } });
      // EF-72 : en regroupement par ressource, les absences sont hachurées sur l'en-tête du groupe.

      if (res) for (const a of res.absences) {

const SVG_NS = 'http://www.w3.org/2000/svg';
/** Élément SVG ; mêmes interdits que h() (pas d'attribut on… ni style). */
function svg(tag, attrs = {}, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (FORBIDDEN_ATTR.test(k)) throw new Error('attribut interdit : ' + k);
    if (k === 'text') el.textContent = String(v); else el.setAttribute(k, String(v));
  }
  for (const c of children.flat(Infinity)) if (c) el.append(c);
  return el;
}

/** Flèches de dépendance (EF-45) : du bord du prédécesseur au bord du successeur selon le type. */
function linkArrows(rows, rowOf, x, dayW, count) {
  const s = App.sched;
  const rowH = 34, mid = i => i * rowH + rowH / 2;
  const height = (count + 2) * rowH;
  const layer = svg('svg', { class: 'g-links', 'aria-hidden': 'true', height, width: '100%' },
    svg('defs', {}, ['n', 'c'].map(k => svg('marker', { id: 'arrow-' + k, viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' },
      svg('path', { d: 'M0,0 L8,4 L0,8 z', class: 'head-' + k })))));
  for (const task of rows) {
    const rs = s.tasks.get(task.id);
    if (!rs || rs.empty || !rowOf.has(task.id)) continue;
    for (const d of task.deps) {
      const rp = s.tasks.get(d.id);
      if (!rowOf.has(d.id) || !rp) continue;
      const predMs = taskById(d.id).type === 'milestone', succMs = task.type === 'milestone';
      const edge = (r, ms, atEnd) => (ms ? x(r.startDn + 0.5) : atEnd ? x(r.endDn + 1) : x(r.startDn));
      const fromEnd = d.type === 'FS' || d.type === 'FF', toEnd = d.type === 'FF' || d.type === 'SF';
      const x1 = edge(rp, predMs, fromEnd), y1 = mid(rowOf.get(d.id));
      const x2 = edge(rs, succMs, toEnd), y2 = mid(rowOf.get(task.id));
      const out = fromEnd ? 6 : -6, inn = toEnd ? 6 : -6;
      const crit = rp.critical && rs.critical;
      const path = `M${x1},${y1} h${out} V${(y1 + y2) / 2} H${x2 + inn} V${y2} H${x2}`;
      layer.append(svg('g', { 'data-click': 'editLink', 'data-arg': task.id },
        svg('path', { d: path, class: 'link-hit' }),
        svg('path', { d: path, class: crit ? 'link critical' : 'link', 'marker-end': `url(#arrow-${crit ? 'c' : 'n'})` },
          svg('title', { text: `${d.id} → ${task.id} (${t('link.' + d.type)}${d.lag ? ', ' + (d.lag > 0 ? '+' : '') + d.lag + ' j' : ''})` }))));
    }
  }
  return layer;
}

const viewFilters = () => App.view.filters || (App.view.filters = clone(View.EMPTY));

/** Lignes à afficher : {task, flat?, dim?, hit?} ou {group}. */
function viewItems() {
  const v = App.view;
  App.viewMatched = null;
  if (!App.sched) return visibleTasks().map(task => ({ task }));
  const sel = viewActive() ? View.select(App.project, App.sched, { query: v.query, filters: viewFilters() }) : null;
  App.viewMatched = sel ? sel.matched : null;
  const hasQuery = !!v.query.trim();
  if (v.groupBy) {
    const ids = sel ? sel.matched : new Set(App.project.tasks.map(x => x.id));
    const out = [];
    for (const g of View.group(App.project, App.sched, ids, v.groupBy)) {
      out.push({ group: g });
      if (!v.collapsedGroups.has(g.key)) for (const id of g.ids) out.push({ task: taskById(id), flat: true, hit: hasQuery });
    }
    return out;
  }
  let base = visibleTasks();
  if (sel && !v.highlight) base = base.filter(x => sel.ids.has(x.id));
  return base.map(task => ({
    task,
    dim: !!(sel && v.highlight && task.type !== 'summary' && !sel.matched.has(task.id)),
    hit: !!(sel && hasQuery && sel.matched.has(task.id)),

}

/* Infobulle des barres (EF-23) : au survol ET au focus clavier ; Échap la ferme.
 * Contenu en texte seul (textContent) ; position par le CSSOM. Les mêmes informations sont dans
 * le nom accessible de la barre et dans le panneau d'édition. */
const Tooltip = (() => {
  let current = null;

  function lines(task) {
    const s = App.sched, r = s && s.tasks.get(task.id);
    if (!r || r.empty) return [];
    const out = [`${task.id} — ${task.name}`];
    out.push(`${t('tip.planned')} : ${I18n.date(r.startDn)} → ${I18n.date(r.endDn)} (${durText(task, r)})`);
    if (task.realStart || task.realEnd) out.push(`${t('tip.real')} : ${task.realStart ? I18n.date(Dates.parse(task.realStart)) : '…'} → ${task.realEnd ? I18n.date(Dates.parse(task.realEnd)) : '…'}`);
    const st = Metrics.status(task, s, Dates.todayDn());
    out.push(`${t('f.pct')} : ${Metrics.pctOf(task, s)} % — ${st ? t('status.' + st) : ''}`);
    if (task.deps.length) out.push(`${t('f.deps')} : ${depsText(task)}`);
    if (task.type === 'task') out.push(`${t('col.res')} : ${resText(task) || t('list.noRes')}`);
    if (r.shift) out.push(shiftText(r));
    if (task.type !== 'summary') out.push(`${t('tip.slack')} : ${r.slack}${r.critical ? ' — ' + t('list.critical') : ''}`);
    for (const b of baselineTexts(task.id)) out.push(b);
    if (task.notes) out.push(`${t('f.notes')} : ${task.notes.length > 120 ? task.notes.slice(0, 120) + '…' : task.notes}`);
    if (task.tags.length) out.push(`${t('view.f.tag')} : ${task.tags.join(', ')}`);
    return out;
  }

  function show(el) {
    const task = taskById(el.dataset.arg);
    if (!task) return;
    const tip = $('tooltip');
    clear(tip);
    for (const l of lines(task)) tip.append(h('div', { text: l }));
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth, hgt = tip.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left));
    const top = r.bottom + 8 + hgt > window.innerHeight ? r.top - hgt - 8 : r.bottom + 8;
    tip.style.setProperty('left', left + 'px');
    tip.style.setProperty('top', Math.max(8, top) + 'px');
    el.setAttribute('aria-describedby', 'tooltip');
    current = el;
  }
  function showText(el, list) {
    const tip = $('tooltip');
    clear(tip);
    for (const l of list) tip.append(h('div', { text: l }));
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    tip.style.setProperty('left', Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left)) + 'px');
    tip.style.setProperty('top', (r.bottom + 6) + 'px');
    current = el;
  }
  function hide() {
    $('tooltip').hidden = true;
    if (current) current.removeAttribute('aria-describedby');
    current = null;
  }
  const target = ev => ev.target.closest && ev.target.closest('#gantt .bar, #gantt .ms[data-arg], #gantt .sbar');

  function init() {
    document.addEventListener('mouseover', ev => { const el = target(ev); if (el && el !== current) show(el); else if (!el && current && !current.contains(document.activeElement)) hide(); });
    document.addEventListener('focusin', ev => {
      const el = target(ev);
      if (el) { show(el); return; }
      const hol = ev.target.closest && ev.target.closest('.g-col.has-holiday');
      if (hol) { showText(hol, [hol.getAttribute('aria-label')]); return; }
      hide();
    });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && current) { hide(); ev.stopPropagation(); } }, true);
  }
  return { init, hide };
})();

/* Panneau d'édition d'une tâche (EF-04 à EF-08, EF-19, EF-20, EF-60, EF-65 à EF-68).
 * Rien n'est appliqué avant « Enregistrer » : le formulaire travaille sur un brouillon.
 * Chaque champ refusé affiche un message précis sous lui, annoncé, et reçoit le focus (EX-06). */
const Editor = (() => {
  let draft = null;     // copie de la tâche en cours d'édition
  let originalId = null;

  const field = (name, label, control, hint) => {
    const id = 'f-' + name;
    control.id = id;
    control.name = name;
    const err = h('p', { class: 'field-error', id: id + '-err', hidden: true });
    control.setAttribute('aria-describedby', id + '-err');
    return h('div', { class: 'field', data: { field: name } }, h('label', { for: id, text: label }), control, hint ? h('p', { class: 'hint', text: hint }) : null, err);
  };
  const input = (type, value, attrs = {}) => h('input', { type, value: value ?? '', ...attrs });
  const select = (options, value) => h('select', {}, options.map(([v, label]) => h('option', { value: v, selected: v === value }, label)));

  function eligiblePreds() {
    const banned = new Set([originalId, ...descendants(originalId).map(t => t.id), ...ancestorsOf(originalId)]);
    return App.project.tasks.filter(t => t.type !== 'summary' && !banned.has(t.id) && !draft.deps.some(d => d.id === t.id));
  }

  function depsEditor() {
    const box = h('fieldset', { class: 'sub', id: 'deps-box' }, h('legend', { text: t('f.deps') }));
    const list = h('ul', { class: 'rows' });
    draft.deps.forEach((d, i) => {
      const other = taskById(d.id);
      const type = select(Model.LINK_TYPES.map(k => [k, t('link.' + k)]), d.type);
      type.setAttribute('aria-label', t('f.linkType', { id: d.id }));
      type.dataset.change = 'draftDep'; type.dataset.arg = i + ':type';
      const lag = input('number', d.lag, { min: -Model.LIMITS.lag, max: Model.LIMITS.lag, step: 1, inputmode: 'numeric', aria: { label: t('f.lag', { id: d.id }) } });
      lag.dataset.change = 'draftDep'; lag.dataset.arg = i + ':lag';
      list.append(h('li', {}, h('span', { class: 'who', text: `${d.id} ${other ? other.name : ''}` }), type, lag,
        h('button', { type: 'button', class: 'icon', data: { click: 'draftRemoveDep', arg: String(i) }, aria: { label: t('f.remove', { name: d.id }) } }, '✕')));
    });
    box.append(list);
    const opts = eligiblePreds();
    if (opts.length && draft.deps.length < Model.LIMITS.deps) {
      const pick = select([['', t('f.depPick')], ...opts.map(o => [o.id, `${o.id} ${o.name}`])], '');
      pick.id = 'dep-pick';
      pick.setAttribute('aria-label', t('f.depPick'));
      box.append(h('div', { class: 'add-row' }, pick, h('button', { type: 'button', data: { click: 'draftAddDep' } }, t('f.addDep'))));
    }
    box.append(h('p', { class: 'field-error', id: 'deps-err', hidden: true, role: 'alert' }));
    return box;
  }

  function assignEditor() {
    const box = h('fieldset', { class: 'sub', id: 'assign-box' }, h('legend', { text: t('f.assign') }));
    const list = h('ul', { class: 'rows' });
    draft.assign.forEach((a, i) => {
      const r = resById(a.res);
      const units = input('number', a.units, { min: 1, max: r ? r.capacity : 100, step: 1, inputmode: 'numeric', aria: { label: t('f.units', { name: r ? r.name : '' }) } });
      units.dataset.change = 'draftUnits'; units.dataset.arg = String(i);
      list.append(h('li', {}, h('span', { class: 'who', text: r ? r.name : '' }), units,
        h('button', { type: 'button', class: 'icon', data: { click: 'draftRemoveAssign', arg: String(i) }, aria: { label: t('f.remove', { name: r ? r.name : '' }) } }, '✕')));
    });
    box.append(list);
    const free = App.project.resources.filter(r => !draft.assign.some(a => a.res === r.id));
    if (free.length && draft.assign.length < Model.LIMITS.assign) {
      const pick = select([['', t('f.resPick')], ...free.map(r => [r.id, r.name])], '');
      pick.id = 'res-pick';
      pick.setAttribute('aria-label', t('f.resPick'));
      box.append(h('div', { class: 'add-row' }, pick, h('button', { type: 'button', data: { click: 'draftAddAssign' } }, t('f.addAssign'))));
    }
    box.append(h('p', { class: 'field-error', id: 'assign-err', hidden: true, role: 'alert' }));
    return box;
  }

  function build() {
    const box = clear($('edit-fields'));
    const d = draft;
    $('editor-title').textContent = t('edit.title', { id: originalId });
    const r = App.sched && App.sched.tasks.get(originalId);
    if (r && r.shift) {
      const res = resById(r.shift.res);
      box.append(h('p', { class: 'note', id: 'edit-shift', text: t('edit.shift', { count: r.shift.days, res: res ? res.name : '', why: t('why.' + r.shift.kind), date: I18n.date(r.earliestDn) }) }));
    }
    const idIn = input('text', d.id, { maxlength: 12, autocomplete: 'off', spellcheck: 'false', class: 'upper', required: true });
    idIn.dataset.input = 'upperCase';
    box.append(field('id', t('f.id'), idIn));
    box.append(field('name', t('f.name'), input('text', d.name, { maxlength: 200, required: true })));
    if (d.type === 'summary' && r) {
      // EF-62 : dates, durée et avancement calculés, affichés mais non modifiables.
      box.append(h('p', { class: 'note', id: 'edit-computed', text: r.empty ? t('edit.summaryEmpty')
        : t('edit.summaryComputed', { start: I18n.date(r.startDn), end: I18n.date(r.endDn), dur: r.d, pct: r.pct }) }));
    }
    if (d.type !== 'summary') {
      const typeSel = select([['task', t('type.task')], ['milestone', t('type.milestone')]], d.type);
      typeSel.dataset.change = 'draftType';
      box.append(field('type', t('f.type'), typeSel));
    }
    const banned = new Set([originalId, ...descendants(originalId).map(x => x.id)]);
    const parents = App.project.tasks.filter(x => x.type === 'summary' && !banned.has(x.id));
    box.append(field('parent', t('f.parent'), select([['', t('f.none')], ...parents.map(p => [p.id, `${p.id} ${p.name}`])], d.parent)));
    if (d.type === 'task') box.append(field('dur', t('f.dur'), input('number', d.durRaw ?? d.dur, { min: 1, max: Model.LIMITS.dur, step: 1, inputmode: 'numeric', required: true })));
    if (d.type !== 'summary') {
      box.append(depsEditor());
      if (d.type === 'task') box.append(assignEditor());
      box.append(field('cat', t('f.cat'), select([['', t('f.none')], ...App.project.categories.map(c => [c.id, c.name])], d.cat)));
    }
    if (d.type === 'task') {
      // EF-19 : curseur et champ numérique liés.
      const num = input('number', d.pctRaw ?? d.pct, { min: 0, max: 100, step: 1, inputmode: 'numeric' });
      num.dataset.input = 'pctSync';
      const fld = field('pct', t('f.pct'), num);
      const range = h('input', { type: 'range', id: 'f-pct-range', min: 0, max: 100, step: 5, value: Number(d.pctRaw ?? d.pct) || 0, aria: { label: t('f.pctSlider') }, data: { input: 'pctSync' } });
      fld.insertBefore(range, num);
      box.append(fld);
    } else if (d.type === 'milestone') {
      const cb = input('checkbox', '', { checked: d.pct >= 100 });
      box.append(h('div', { class: 'field check' }, cb, h('label', { for: 'f-reached', text: t('f.reached') })));
      cb.id = 'f-reached'; cb.name = 'reached';
    }
    if (d.type !== 'summary') {
      box.append(field('forcedStart', t('f.forced'), input('date', d.forcedStart, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('notBefore', t('f.notBefore'), input('date', d.notBefore, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('deadline', t('f.deadline'), input('date', d.deadline, { min: '1970-01-01', max: '2199-12-31' })));
    }
    if (d.type === 'task') {
      box.append(field('realStart', t('f.realStart'), input('date', d.realStart, { min: '1970-01-01', max: '2199-12-31' })));
      box.append(field('realEnd', t('f.realEnd'), input('date', d.realEnd, { min: '1970-01-01', max: '2199-12-31' })));
    }
    // EF-91 : étiquettes avec suggestions tirées du projet.
    const tagField = field('tags', t('f.tags'), input('text', d.tagsRaw ?? d.tags.join(', '), { maxlength: 400 }));
    const current = new Set((d.tagsRaw ?? d.tags.join(',')).split(',').map(x => x.trim().toLowerCase()).filter(Boolean));
    const known = [...new Set(App.project.tasks.flatMap(x => x.tags))].filter(x => !current.has(x.toLowerCase())).sort((a, b) => a.localeCompare(b, 'fr')).slice(0, 12);
    if (known.length) tagField.append(h('div', { class: 'suggest', role: 'group', aria: { label: t('f.tagSuggest') } },
      known.map(tg => h('button', { type: 'button', class: 'chip', data: { click: 'draftAddTag', arg: tg }, aria: { label: t('f.tagAdd', { tag: tg }) } }, '+ ' + tg))));
    box.append(tagField);
    box.append(field('notes', t('f.notes'), h('textarea', { rows: 3, maxlength: 2000, text: d.notes })));
    // EF-90 : journal de commentaires horodatés.
    const com = h('fieldset', { class: 'sub', id: 'comments-box' }, h('legend', { text: t('f.comments') }));
    com.append(h('ul', { class: 'rows comments' }, d.comments.map((c, i) => h('li', {},
      h('span', { class: 'who' }, h('span', { class: 'hint', text: I18n.dateTime(c.ts) + ' — ' }), c.text),
      h('button', { type: 'button', class: 'icon', data: { click: 'draftRemoveComment', arg: String(i) }, aria: { label: t('f.commentRemove', { date: I18n.dateTime(c.ts) }) } }, '✕')))));
    if (d.comments.length < Model.LIMITS.comments) com.append(h('div', { class: 'add-row' },
      h('textarea', { id: 'f-comment', rows: 2, maxlength: 500, aria: { label: t('f.commentNew') } }),
      h('button', { type: 'button', data: { click: 'draftAddComment' } }, t('f.commentAdd'))));
    box.append(com);
  }

  /** Relit les champs simples du formulaire dans le brouillon (sans valider). */
  function readForm() {
    const f = $('edit-form').elements;
    const val = n => (f[n] ? f[n].value : undefined);
    const d = draft;
    d.id = (val('id') || '').trim().toUpperCase();
    d.name = (val('name') || '').trim();
    if (f.parent) d.parent = val('parent');
    if (f.dur) d.durRaw = val('dur');
    if (f.cat) d.cat = val('cat');
    if (f.pct) d.pctRaw = val('pct');
    if (f.reached) d.pct = f.reached.checked ? 100 : 0;
    for (const k of ['forcedStart', 'notBefore', 'deadline', 'realStart', 'realEnd']) if (f[k]) d[k] = val(k);
    d.tagsRaw = val('tags') || '';
    d.notes = val('notes') || '';
  }

  function open(id) {
    const task = taskById(id);
    if (!task) return;
    originalId = id;
    draft = clone(task);
    App.selected = id;
    $('editor').hidden = false;
    build();
    render();
    $('f-name').focus();
  }

  function close() {
    $('editor').hidden = true;
    draft = null;
    const sel = App.selected && document.querySelector(`button.select[data-arg="${CSS.escape(App.selected)}"]`);
    if (sel) sel.focus();
  }

  function showErrors(errors) {
    for (const el of document.querySelectorAll('#editor .field-error')) { el.hidden = true; el.textContent = ''; }
    for (const el of document.querySelectorAll('#editor [aria-invalid]')) el.removeAttribute('aria-invalid');
    let first = null;
    for (const [name, msg] of Object.entries(errors)) {
      const ctl = $('f-' + name) || $(name + '-box');
      const err = $('f-' + name + '-err') || $(name + '-err');
      if (err) { err.textContent = msg; err.hidden = false; }
      if (ctl && ctl.tagName !== 'FIELDSET') ctl.setAttribute('aria-invalid', 'true');
      if (!first) first = ctl;
    }
    if (first) { (first.tagName === 'FIELDSET' ? first.querySelector('select, input, button') || first : first).focus(); announce(Object.values(errors)[0]); }
  }

  function intIn(raw, min, max) { const n = Number(raw); return raw !== '' && Number.isInteger(n) && n >= min && n <= max ? n : null; }

  function validate() {
    readForm();
    const d = draft, e = {};
    if (!Model.ID_RE.test(d.id)) e.id = t('err.idFormat', { field: t('f.id') });
    else if (d.id !== originalId && taskById(d.id)) e.id = t('err.idTaken', { field: t('f.id'), id: d.id });
    if (!d.name) e.name = t('err.required', { field: t('f.name') });
    if (d.type === 'task') {
      const dur = intIn(d.durRaw, 1, Model.LIMITS.dur);
      if (dur == null) e.dur = t('err.int', { field: t('f.dur'), min: 1, max: '3 650' }); else d.dur = dur;
      const pct = intIn(d.pctRaw, 0, 100);
      if (pct == null) e.pct = t('err.int', { field: t('f.pct'), min: 0, max: 100 }); else d.pct = pct;
    }
    for (const k of ['forcedStart', 'notBefore', 'deadline', 'realStart', 'realEnd']) {
      if (d[k] && Dates.parse(d[k]) == null) e[k] = t('err.date', { field: t('f.' + ({ forcedStart: 'forced' }[k] || k)) });
    }
    if (!e.realStart && !e.realEnd && d.realStart && d.realEnd && d.realEnd < d.realStart) e.realEnd = t('err.realOrder', { field: t('f.realEnd') });
    d.deps.forEach(dep => { if (!Number.isInteger(dep.lag) || Math.abs(dep.lag) > Model.LIMITS.lag) e.deps = t('err.int', { field: t('f.lag', { id: dep.id }), min: -365, max: 365 }); });
    d.assign.forEach(a => { const r = resById(a.res); if (!r || !Number.isInteger(a.units) || a.units < 1 || a.units > r.capacity) e.assign = t('err.capacity', { field: t('f.units', { name: r ? r.name : '' }), name: r ? r.name : '', cap: r ? r.capacity : 100 }); });
    const tags = d.tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
    if (tags.length > Model.LIMITS.tags || tags.some(s => s.length > 30)) e.tags = t('err.text', { field: t('f.tags'), min: 1, max: 30 });
    else d.tags = tags.filter((s, i) => tags.findIndex(x => x.toLowerCase() === s.toLowerCase()) === i);
    if (d.parent) {
      const height = Math.max(0, ...descendants(originalId).map(x => ancestorsOf(x.id).length - ancestorsOf(originalId).length));
      if (ancestorsOf(d.parent).length + 1 + height > Model.LIMITS.depth) e.parent = t('err.depth', { max: Model.LIMITS.depth });
    }
    return e;
  }

  async function save() {
    const e = validate();
    if (Object.keys(e).length) { showErrors(e); return; }
    const d = draft;
    let cleared = false;
    if (d.type === 'task') {
      if (d.realEnd && d.pct < 100) {
        // Une fin réelle porte l'avancement à 100 % (RG-13), sauf si l'utilisateur vient de le baisser.
        const before = taskById(originalId);
        if (before.realEnd === d.realEnd && before.pct === 100) { d.realEnd = ''; cleared = true; } else d.pct = 100;
      }
    }
    const oldId = originalId, newId = d.id;
    const final = {
      id: newId, name: d.name, type: d.type, parent: d.parent, dur: d.type === 'task' ? d.dur : 0,
      deps: d.type === 'summary' ? [] : d.deps.map(x => ({ id: x.id, type: x.type, lag: x.lag })),
      assign: d.type === 'task' ? d.assign.map(a => ({ res: a.res, units: a.units })) : [],
      cat: d.cat, pct: d.type === 'summary' ? 0 : d.pct,
      forcedStart: d.type === 'summary' ? '' : d.forcedStart, notBefore: d.type === 'summary' ? '' : d.notBefore, deadline: d.type === 'summary' ? '' : d.deadline,
      realStart: d.type === 'task' ? d.realStart : '', realEnd: d.type === 'task' ? d.realEnd : '',
      tags: d.tags, notes: d.notes, comments: d.comments, collapsed: d.collapsed,
    };
    // Simulation : le planning doit rester calculable (dates ≤ 2199).
    const trial = clone(App.project);
    applyTask(trial, oldId, final);
    try { Schedule.compute(trial); } catch { showErrors({ forcedStart: t('calc.error') }); return; }
    commit(p => applyTask(p, oldId, final));
    App.selected = newId;
    originalId = newId;
    $('editor').hidden = true;
    draft = null;
    render();
    announce(t('saved', { id: newId }) + (cleared ? ' ' + t('err.realEndCleared') : ''));
    const sel = document.querySelector(`button.select[data-arg="${CSS.escape(newId)}"]`);
    if (sel) sel.focus();
  }

  /** Remplace la tâche oldId ; un changement d'identifiant est répercuté partout (EF-05). */
  function applyTask(p, oldId, final) {
    const i = p.tasks.findIndex(x => x.id === oldId);
    const parentChanged = p.tasks[i].parent !== final.parent;
    p.tasks[i] = final;
    if (oldId !== final.id) {
      for (const x of p.tasks) {
        for (const dep of x.deps) if (dep.id === oldId) dep.id = final.id;
        if (x.parent === oldId) x.parent = final.id;
      }
      for (const b of p.baselines) for (const bt of b.tasks) {
        if (bt.id === oldId) bt.id = final.id;
        bt.deps = bt.deps.map(x => (x === oldId ? final.id : x));
      }
    }
    if (parentChanged && final.parent) {
      // Se place à la fin de sa nouvelle récapitulative.
      const block = [final, ...descendants(final.id, p.tasks)];
      p.tasks = p.tasks.filter(x => !block.includes(x));
      const pi = p.tasks.findIndex(x => x.id === final.parent);
      const after = descendants(final.parent, p.tasks);
      const at = after.length ? p.tasks.indexOf(after[after.length - 1]) + 1 : pi + 1;
      p.tasks.splice(at, 0, ...block);
    }
  }

  // ── Actions du brouillon ───────────────────────────────────────────────────────────────
  action('upperCase', (arg, el) => { const pos = el.selectionStart; el.value = el.value.toUpperCase(); el.setSelectionRange(pos, pos); });
  action('draftType', (arg, el) => { readForm(); draft.type = el.value; if (draft.type === 'milestone') { draft.assign = []; draft.pct = draft.pct >= 100 ? 100 : 0; } else if (!draft.dur) draft.dur = 5; build(); $('f-type').focus(); });
  action('draftDep', (arg, el) => {
    const [i, k] = arg.split(':');
    const dep = draft.deps[Number(i)];
    if (k === 'type') dep.type = Model.LINK_TYPES.includes(el.value) ? el.value : 'FS';
    else dep.lag = el.value === '' ? NaN : Number(el.value);
  });
  action('draftRemoveDep', arg => { readForm(); draft.deps.splice(Number(arg), 1); build(); const p = $('dep-pick'); if (p) p.focus(); });
  action('draftAddDep', () => {
    readForm();
    const pick = $('dep-pick');
    if (!pick || !pick.value) return;
    const trialTasks = App.project.tasks.map(x => (x.id === originalId ? { ...x, deps: [...draft.deps, { id: pick.value, type: 'FS', lag: 0 }] } : x));
    const cycle = Model.findCycle(trialTasks);
    if (cycle) { const err = $('deps-err'); err.textContent = t('err.cycle', { path: cycle.join(' → ') }); err.hidden = false; pick.focus(); return; }
    draft.deps.push({ id: pick.value, type: 'FS', lag: 0 });
    build();
    const again = $('dep-pick'); if (again) again.focus();
  });
  action('draftUnits', (arg, el) => { draft.assign[Number(arg)].units = el.value === '' ? NaN : Number(el.value); });
  action('draftRemoveAssign', arg => { readForm(); draft.assign.splice(Number(arg), 1); build(); const p = $('res-pick'); if (p) p.focus(); });
  action('draftAddAssign', () => {
    readForm();
    const pick = $('res-pick');
    if (!pick || !pick.value) return;
    const r = resById(pick.value);
    draft.assign.push({ res: r.id, units: Math.min(100, r.capacity) });
    build();
    const again = $('res-pick'); if (again) again.focus();
  });
  action('pctSync', (arg, el) => {
    const v = el.value;
    const num = $('f-pct'), range = $('f-pct-range');
    if (el === range) num.value = v; else if (range && v !== '' && Number(v) >= 0 && Number(v) <= 100) range.value = v;
  });
  action('draftAddTag', tg => { readForm(); draft.tagsRaw = [draft.tagsRaw, tg].filter(x => x && x.trim()).join(', '); build(); $('f-tags').focus(); });
  action('draftAddComment', () => {
    readForm();
    const text = $('f-comment').value.trim().slice(0, 500);
    if (!text) { $('f-comment').focus(); return; }
    draft.comments.push({ ts: Date.now(), text });
    build();
    $('f-comment').focus();
  });
  action('draftRemoveComment', i => { readForm(); draft.comments.splice(Number(i), 1); build(); const c = $('f-comment'); if (c) c.focus(); });
  action('saveTask', () => save());
  action('closeEditor', () => close());

  return { open, close, isOpen: () => !!draft };
})();

// ── js/ui/62-shortcuts.js ──
/* Dupliquer (EF-80) et équivalents clavier des gestes (EF-78). Chaque action = un pas d'annulation. */

/** Copie d'une tâche (et de sa descendance) juste sous l'original ; liens internes rattachés aux copies. */
function duplicateBlock(p, id) {
  const src = p.tasks.find(x => x.id === id);
  if (!src) return [];
  const block = [src, ...descendants(id, p.tasks)];
  if (p.tasks.length + block.length > Model.LIMITS.tasks) return null;
  const used = p.tasks.map(x => x.id), map = new Map();
  for (const x of block) { const nid = Model.nextTaskId(used); used.push(nid); map.set(x.id, nid); }
  const suffix = t('dup.suffix');
  const copies = block.map(x => ({
    ...clone(x), id: map.get(x.id), name: (x.name.slice(0, 200 - suffix.length) + (x === src ? suffix : '')),
    parent: x === src ? x.parent : map.get(x.parent), pct: 0, realStart: '', realEnd: '', comments: [],
    deps: x.deps.map(d => ({ ...d, id: map.get(d.id) || d.id })),
  }));
  const last = block[block.length - 1];
  p.tasks.splice(p.tasks.indexOf(last) + 1, 0, ...copies);
  return copies.map(c => c.id);
}

action('duplicateTask', () => {
  if (App.multi.size > 1) { ACTIONS.duplicateSelection(); return; }
  const id = App.selected;
  if (!taskById(id)) return;
  let ids = null;
  const trial = clone(App.project);
  ids = duplicateBlock(trial, id);
  if (!ids) { Dialog.message(t('edit.duplicate'), t('err.limit', { max: Model.LIMITS.tasks, what: 'tâches' })); return; }
  try { Schedule.compute(trial); } catch { announce(t('calc.error')); return; }
  commit(p => { duplicateBlock(p, id); });
  Editor.close();
  App.selected = ids[0];
  render();
  announce(t('dup.done', { count: ids.length, ids: ids.join(', ') }));
  const btn = document.querySelector(`button.select[data-arg="${CSS.escape(ids[0])}"]`);
  if (btn) btn.focus();
});

/** Alt + ←/→ : date imposée d'un jour ouvré ; Alt + Maj + ←/→ : durée d'un jour (EF-78). */
function nudge(dir, duration) {
  const task = taskById(App.selected);
  if (!task || !App.sched) return;
  if (task.type === 'summary') { announce(t('kb.notTask')); return; }
  const r = App.sched.tasks.get(task.id), cal = App.sched.cal;
  if (duration) {
    if (task.type !== 'task') { announce(t('kb.notTask')); return; }
    const d = Math.min(Model.LIMITS.dur, Math.max(1, task.dur + dir));
    if (d === task.dur) return;
    commit(p => { p.tasks.find(x => x.id === task.id).dur = d; });
    announce(t('kb.dur', { count: d }));
  } else {
    const iso = Dates.toISO(cal.dnOf(r.s + dir));
    const trial = clone(App.project); trial.tasks.find(x => x.id === task.id).forcedStart = iso;
    try { Schedule.compute(trial); } catch { announce(t('calc.error')); return; }
    commit(p => { p.tasks.find(x => x.id === task.id).forcedStart = iso; });
    announce(t('kb.forced', { date: I18n.date(Dates.parse(iso)) }));
  }
}

function initShortcuts() {
